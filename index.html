<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobStart | Find Your Career Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #0b5c55;
      --primary-light: #14b8a6;
      --accent: #fb7a57;
      --accent-dark: #ea5f3c;
      --bg: #faf8f5;
      --card-bg: #ffffff;
      --text: #1c2321;
      --text-muted: #6b7280;
      --border: #e7e2da;
      --success: #16a34a;
      --radius: 14px;
      --radius-sm: 9px;
      --font-display: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-body); background-color: var(--bg); color: var(--text); line-height: 1.55; padding: 24px 16px 60px; }
    .container { max-width: 900px; margin: 0 auto; }

    h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.01em; }

    a:focus-visible, button:focus-visible, .option-btn:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 2px;
    }

    /* Header & Navigation */
    header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; padding-top: 4px; }
    .logo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
    .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; box-shadow: 0 2px 6px rgba(15,118,110,0.35); }
    .logo-text .accent-dot { color: var(--accent); }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; }

    /* Cards */
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 26px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(28,35,33,0.04), 0 8px 24px -12px rgba(28,35,33,0.08); margin-bottom: 20px; }

    /* Progress & XP Bar — "runway" motif */
    .progress-container { margin-bottom: 20px; }
    .progress-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .progress-bar-bg { position: relative; width: 100%; height: 10px; background: var(--border); border-radius: 20px; overflow: visible; }
    .progress-bar-fill { position: relative; height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); transition: width 0.35s ease; }
    .progress-bar-fill::after { content: "🚀"; position: absolute; right: -10px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15)); }
    .xp-badge { background: #fff1ea; color: var(--accent-dark); padding: 3px 10px; border-radius: 20px; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.01em; }

    /* Hero / Home View */
    .hero { text-align: center; padding: 48px 24px; }
    .hero-eyebrow { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); margin-bottom: 14px; }
    .hero h1 { font-size: 2.15rem; font-weight: 700; margin-bottom: 14px; line-height: 1.2; }
    .hero p { color: var(--text-muted); font-size: 1rem; max-width: 520px; margin: 0 auto 28px auto; }
    .hero-meta { display: flex; justify-content: center; gap: 20px; margin-top: 22px; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); }
    .hero-meta span { display: inline-flex; align-items: center; gap: 6px; }

    .btn { font-family: var(--font-body); background: var(--primary); color: white; border: none; padding: 13px 26px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #f1efe9; color: var(--text); }
    .btn-secondary:hover { background: #e7e2da; }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); padding: 11.5px 26px; }
    .btn-outline:hover { background: #effaf9; }

    /* Quiz Options */
    .q-category { text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
    .q-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; line-height: 1.35; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .option-btn { width: 100%; text-align: left; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: white; cursor: pointer; transition: all 0.15s ease; font-family: var(--font-body); font-size: 0.94rem; font-weight: 500; color: var(--text); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .option-btn:hover { border-color: var(--primary-light); background: #f6fbfa; }
    .option-btn.selected { border-color: var(--primary); background: #effaf9; box-shadow: inset 0 0 0 1px var(--primary); }
    .option-letter { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
    .option-btn.selected .option-letter { background: var(--primary); color: white; }
    .option-btn:hover .option-letter { background: var(--primary-light); color: white; }
    .option-txt { flex: 1; }
    .option-arrow { color: var(--text-muted); flex-shrink: 0; }

    .quiz-footer { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .quiz-hint { font-size: 0.82rem; color: var(--text-muted); }

    /* Results Dashboard Grid */
    .results-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .results-grid { grid-template-columns: 1fr 1fr; } }

    .hero-result { background: linear-gradient(135deg, var(--primary-dark), var(--primary) 60%, var(--primary-light)); color: white; }

    /* Skill Meter */
    .skill-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
    .skill-name { font-size: 0.88rem; font-weight: 600; }
    .skill-dots { display: flex; gap: 5px; flex-shrink: 0; }
    .dot { width: 20px; height: 7px; border-radius: 4px; background: var(--border); }
    .dot.active { background: var(--primary); }

    /* Badges & Tags */
    .badge { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 0.74rem; font-weight: 700; }
    .badge-blue { background: #e6f6f4; color: var(--primary-dark); }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #fff1ea; color: var(--accent-dark); }

    /* Job Listings */
    .job-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; background: white; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .job-card:last-child { margin-bottom: 0; }
    .job-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px rgba(28,35,33,0.15); border-color: var(--primary-light); }
    .job-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .job-title { font-weight: 700; font-size: 1rem; }
    .company-link { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; font-size: 0.92rem; }
    .company-link:hover { text-decoration: underline; }

    /* Modal */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(28,35,33,0.55); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(2px); }
    .modal-content { background: white; border-radius: var(--radius); max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; position: relative; }
    .close-btn { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: none; background: #f1efe9; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: #e7e2da; }

    /* Visual Resume Styling (Screen & Print) */
    .visual-cv { background: white; border: 1px solid var(--border); padding: 36px; border-radius: var(--radius); color: var(--text); }
    .cv-header { border-bottom: 2px solid var(--primary); padding-bottom: 18px; margin-bottom: 22px; }
    .cv-name { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--primary-dark); letter-spacing: 0.02em; }
    .cv-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 28px; }
    @media (max-width: 600px) { .cv-grid { grid-template-columns: 1fr; } }
    .cv-section-title { font-family: var(--font-display); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary-dark); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 14px; }

    /* Print Styles */
    @media print {
      body { background: white; padding: 0; }
      header, .no-print, .progress-container { display: none !important; }
      .card, .visual-cv { border: none !important; box-shadow: none !important; padding: 0 !important; }
      .visual-cv { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="no-print">
      <a href="#" class="logo" onclick="resetApp()">
        <span class="logo-mark">🚀</span>
        <span class="logo-text">JobStart<span class="accent-dot">.</span></span>
      </a>
      <div class="subtitle">Discover your career fit in a few taps — no typing required</div>
    </header>

    <div id="app"></div>
  </div>

  <script>
    /* ==========================================================================
       DATA MODELS: QUESTIONS (30 Multiple Choice), JOBS & COMPANIES
       ========================================================================== */

    const QUESTIONS = [
      // WORK PREFERENCES (1 - 5)
      {
        cat: "Preferences",
        q: "What is your preferred everyday work arrangement?",
        opts: [
          { txt: "100% Onsite (I like physical office work)", pref: { setup: "Onsite" } },
          { txt: "Hybrid (Mix of office and home)", pref: { setup: "Hybrid" } },
          { txt: "100% Remote / Work from Home", pref: { setup: "Remote" } },
          { txt: "Flexible / Open to any arrangement", pref: { setup: "Open" } }
        ]
      },
      {
        cat: "Preferences",
        q: "Are you open to relocating or traveling for work within the Philippines?",
        opts: [
          { txt: "Willing to relocate anywhere in PH", pref: { relocate: "Anywhere" } },
          { txt: "Only within my region or Metro Manila", pref: { relocate: "Regional" } },
          { txt: "Strictly near my current location only", pref: { relocate: "Local" } },
          { txt: "Open to overseas travel / work", pref: { relocate: "Overseas" } }
        ]
      },
      {
        cat: "Preferences",
        q: "What is your target monthly starting salary expectations?",
        opts: [
          { txt: "₱15,000 – ₱18,000 / month", pref: { salary: "₱15k-₱18k" } },
          { txt: "₱18,000 – ₱25,000 / month", pref: { salary: "₱18k-₱25k" } },
          { txt: "₱25,000 – ₱35,000 / month", pref: { salary: "₱25k-₱35k" } },
          { txt: "₱35,000+ / month", pref: { salary: "₱35k+" } }
        ]
      },
      {
        cat: "Preferences",
        q: "What shift or work schedule do you prefer?",
        opts: [
          { txt: "Regular Day Shift (8 AM – 5 PM)", pref: { shift: "Day" } },
          { txt: "Night Shift / Graveyard (BPO / Global Support)", pref: { shift: "Night" } },
          { txt: "Flexible / Shifting Rotations", pref: { shift: "Flexible" } },
          { txt: "Project-based / Freelance hours", pref: { shift: "Project" } }
        ]
      },
      {
        cat: "Preferences",
        q: "What type of workplace environment energizes you most?",
        opts: [
          { txt: "Fast-paced, high energy (Call center / Corporate)", scores: { customerService: 1, communication: 1 } },
          { txt: "Quiet, detail-oriented space (Tech / Tech Support)", scores: { tech: 1, numeracy: 1 } },
          { txt: "Creative, collaborative team studio", scores: { creative: 1, leadership: 1 } },
          { txt: "Hands-on, active site or workshop", scores: { trade: 1 } }
        ]
      },

      // SKILL PROFILE QUESTIONS (6 - 13)
      {
        cat: "Communication",
        q: "How comfortable are you speaking and writing in English?",
        opts: [
          { txt: "Basic understanding; prefer local languages", scores: { communication: 1 } },
          { txt: "Conversational; can handle routine conversations", scores: { communication: 3 } },
          { txt: "Fluent; confident in professional speaking & emails", scores: { communication: 4 } },
          { txt: "Expert; can present to international audiences", scores: { communication: 5 } }
        ]
      },
      {
        cat: "Technology",
        q: "How would you rate your proficiency with computers & digital software?",
        opts: [
          { txt: "Basic (Social media, browsing, simple phone apps)", scores: { tech: 1 } },
          { txt: "Intermediate (MS Word, Excel, Google Docs)", scores: { tech: 3 } },
          { txt: "Advanced (Canva, IT troubleshooting, basic CRM/code)", scores: { tech: 4 } },
          { txt: "Expert (Software programming, database, system admin)", scores: { tech: 5 } }
        ]
      },
      {
        cat: "Customer Support",
        q: "How do you handle difficult or frustrated people in service situations?",
        opts: [
          { txt: "I get stressed and prefer not dealing with angry people", scores: { customerService: 1 } },
          { txt: "I remain polite and pass them to a supervisor", scores: { customerService: 2 } },
          { txt: "I listen patiently, de-escalate, and offer solutions", scores: { customerService: 4 } },
          { txt: "I excel under pressure and turn dissatisfied clients into loyal fans", scores: { customerService: 5 } }
        ]
      },
      {
        cat: "Sales & Persuasion",
        q: "How do you feel about persuading people or selling products/services?",
        opts: [
          { txt: "Uncomfortable with selling or pushing products", scores: { sales: 1 } },
          { txt: "Okay with answering product inquiries if requested", scores: { sales: 2 } },
          { txt: "Good at explaining benefits and closing direct deals", scores: { sales: 4 } },
          { txt: "Thrive on pitch targets, commissions, and negotiation", scores: { sales: 5 } }
        ]
      },
      {
        cat: "Technical / Skilled Trade",
        q: "How experienced are you with tools, equipment, or hands-on hardware repairs?",
        opts: [
          { txt: "No experience with technical tools", scores: { trade: 1 } },
          { txt: "Basic household DIY repairs and tool usage", scores: { trade: 2 } },
          { txt: "Trained in specialized tools, hardware, or electrical work", scores: { trade: 4 } },
          { txt: "Certified technician / specialized skilled trade pro", scores: { trade: 5 } }
        ]
      },
      {
        cat: "Creative & Design",
        q: "What is your experience level with visual design, content creation, or writing?",
        opts: [
          { txt: "No creative design background", scores: { creative: 1 } },
          { txt: "Make quick social media posts using pre-made templates", scores: { creative: 2 } },
          { txt: "Create custom layouts, edit videos, or draft marketing copy", scores: { creative: 4 } },
          { txt: "Proficient in Adobe Suite, UI/UX, or professional media", scores: { creative: 5 } }
        ]
      },
      {
        cat: "Leadership & Teamwork",
        q: "When working on group projects or tasks, what is your typical role?",
        opts: [
          { txt: "Individual contributor; prefer clear assigned tasks", scores: { leadership: 1 } },
          { txt: "Reliable team player; assist wherever needed", scores: { leadership: 2 } },
          { txt: "Task coordinator; keep team organized and on track", scores: { leadership: 4 } },
          { txt: "Natural leader; take initiative, delegate, and guide strategy", scores: { leadership: 5 } }
        ]
      },
      {
        cat: "Numeracy & Analysis",
        q: "How comfortable are you handling numbers, calculations, and data analysis?",
        opts: [
          { txt: "Prefer avoiding heavy math or calculations", scores: { numeracy: 1 } },
          { txt: "Can manage basic budgeting and spreadsheets", scores: { numeracy: 3 } },
          { txt: "Comfortable with formulas, statistics, and financial reports", scores: { numeracy: 4 } },
          { txt: "Advanced data analysis, financial models, or statistics", scores: { numeracy: 5 } }
        ]
      },

      // SITUATIONAL SCENARIOS (14 - 22)
      {
        cat: "Scenario",
        q: "A customer calls complaining about a delayed shipment. What is your first reaction?",
        opts: [
          { txt: "Empathize, check shipment status, and offer a clear update", scores: { customerService: 2, communication: 1 } },
          { txt: "Transfer call immediately to the shipping department", scores: { customerService: 1 } },
          { txt: "Explain shipping rules and policy strictly", scores: { communication: 1 } },
          { txt: "Apologize and issue a discount voucher right away", scores: { customerService: 2 } }
        ]
      },
      {
        cat: "Scenario",
        q: "Your team’s main computer network goes down right before a deadline. What do you do?",
        opts: [
          { txt: "Wait for the IT admin to fix it", scores: { tech: 0 } },
          { txt: "Troubleshoot router/connections and check diagnostic steps", scores: { tech: 2, trade: 1 } },
          { txt: "Notify stakeholders and switch team to mobile offline workflow", scores: { leadership: 2 } },
          { txt: "Use personal data to keep working on urgent items", scores: { leadership: 1 } }
        ]
      },
      {
        cat: "Scenario",
        q: "You notice a small error in a financial report or inventory log. What is your action?",
        opts: [
          { txt: "Ignore it if it seems tiny", scores: {} },
          { txt: "Correct it quietly if within my access", scores: { numeracy: 1 } },
          { txt: "Flag the discrepancy to supervisors and recalculate full sheet", scores: { numeracy: 2, leadership: 1 } },
          { txt: "Create a revised log with audit notes", scores: { numeracy: 2, tech: 1 } }
        ]
      },
      {
        cat: "Scenario",
        q: "You are asked to design a quick banner for a store promo. How do you start?",
        opts: [
          { txt: "Use Canva or Photoshop to build an eye-catching visual", scores: { creative: 2 } },
          { txt: "Search Google for text ideas and copy a basic template", scores: { creative: 1 } },
          { txt: "Ask someone else who is better at drawing", scores: {} },
          { txt: "Focus on writing strong clear discount headline text", scores: { communication: 1, creative: 1 } }
        ]
      },
      {
        cat: "Scenario",
        q: "A prospective client says your price is too high compared to competitors.",
        opts: [
          { txt: "Offer an immediate lower price", scores: { sales: 1 } },
          { txt: "Highlight unique value, quality, and flexible options", scores: { sales: 2, communication: 1 } },
          { txt: "Thank them and end the conversation", scores: {} },
          { txt: "Ask what competitor features they prefer to negotiate", scores: { sales: 2 } }
        ]
      },
      {
        cat: "Scenario",
        q: "A physical office device (printer, POS terminal, wiring) malfunctions during operations.",
        opts: [
          { txt: "Inspect cables, test power supply, or clear paper jam", scores: { trade: 2, tech: 1 } },
          { txt: "Put an 'Out of Order' sign and report to maintenance", scores: { customerService: 1 } },
          { txt: "Look up technical manual or YouTube troubleshooting steps", scores: { tech: 1, trade: 1 } },
          { txt: "Ask a co-worker to take over", scores: {} }
        ]
      },
      {
        cat: "Scenario",
        q: "You have 5 urgent tasks due at the end of the day. How do you handle them?",
        opts: [
          { txt: "Work on the easiest tasks first to get momentum", scores: { leadership: 1 } },
          { txt: "Prioritize by urgency/impact and execute step by step", scores: { leadership: 2, numeracy: 1 } },
          { txt: "Try to multitask all 5 at the same time", scores: {} },
          { txt: "Delegate 2 tasks to available teammates", scores: { leadership: 2 } }
        ]
      },
      {
        cat: "Scenario",
        q: "You are assigned to explain a complex tool process to a new team member.",
        opts: [
          { txt: "Write a clear, step-by-step visual guide or standard document", scores: { communication: 2, creative: 1 } },
          { txt: "Give a quick verbal explanation and let them try", scores: { communication: 1 } },
          { txt: "Do the task for them while they watch", scores: { customerService: 1 } },
          { txt: "Send them online manual links to read independently", scores: { tech: 1 } }
        ]
      },
      {
        cat: "Scenario",
        q: "Your manager requests a weekly summary of project milestones.",
        opts: [
          { txt: "Send a quick bulleted email message", scores: { communication: 1 } },
          { txt: "Build a visual presentation deck with charts and timeline", scores: { creative: 2, numeracy: 1 } },
          { txt: "Create a clean spreadsheet tracker with completion percentages", scores: { tech: 1, numeracy: 2 } },
          { txt: "Schedule a brief 5-minute verbal check-in call", scores: { communication: 1 } }
        ]
      },

      // BACKGROUND & GOALS (23 - 30)
      {
        cat: "Background",
        q: "What is your highest level of completed education / training?",
        opts: [
          { txt: "High School / K-12 Graduate", pref: { edu: "High School" } },
          { txt: "TESDA NC II / Technical Vocational Diploma", pref: { edu: "TESDA/Vocational" } },
          { txt: "College Graduate / Bachelor's Degree", pref: { edu: "College Degree" } },
          { txt: "Undergraduate / Career Shifter", pref: { edu: "Undergraduate" } }
        ]
      },
      {
        cat: "Tools",
        q: "Which digital platform or tool are you most comfortable using daily?",
        opts: [
          { txt: "Google Workspace / MS Office Apps", scores: { tech: 1 } },
          { txt: "Graphic design / Video tools (Canva, CapCut, Adobe)", scores: { creative: 2 } },
          { txt: "Customer ticketing or CRM software (Zendesk, Salesforce)", scores: { customerService: 2 } },
          { txt: "Hardware tools, POS systems, or machinery", scores: { trade: 2 } }
        ]
      },
      {
        cat: "Fluency",
        q: "What language style are you most effective at using at work?",
        opts: [
          { txt: "Taglish / Conversational Filipino (Great for local retail/admin)", scores: { communication: 1 } },
          { txt: "Clear Business English (Great for BPO / Corporate)", scores: { communication: 2 } },
          { txt: "Multilingual / Regional dialects (Bisaya, Ilocano, etc.)", scores: { communication: 1, customerService: 1 } },
          { txt: "Technical & Code syntax / Technical documentation", scores: { tech: 2 } }
        ]
      },
      {
        cat: "Focus",
        q: "Which fast-learning skill course would you prioritize taking today?",
        opts: [
          { txt: "English Pronunciation & Spoken Accent Training", scores: { communication: 2 } },
          { txt: "Web Development / Software Testing / Coding Basics", scores: { tech: 2 } },
          { txt: "Social Media Marketing & Content Creation", scores: { creative: 2 } },
          { txt: "Bookkeeping, Excel Formulas & Data Analytics", scores: { numeracy: 2 } }
        ]
      },
      {
        cat: "Strengths",
        q: "What do co-workers or classmates compliment you for most?",
        opts: [
          { txt: "Friendly, helpful attitude & empathy", scores: { customerService: 2 } },
          { txt: "Fast worker who solves computer or equipment issues", scores: { tech: 1, trade: 1 } },
          { txt: "Creative ideas and stylish visual designs", scores: { creative: 2 } },
          { txt: "Organized, good with figures, and detail-oriented", scores: { numeracy: 2 } }
        ]
      },
      {
        cat: "Work Motivation",
        q: "What factor matters most to you in choosing your next job?",
        opts: [
          { txt: "High salary & performance incentives", pref: { factor: "Salary" } },
          { txt: "Career growth, promotions & mentorship", pref: { factor: "Growth" } },
          { txt: "Work-life balance & convenient location/setup", pref: { factor: "Balance" } },
          { txt: "Job stability & company benefits (HMO, allowance)", pref: { factor: "Benefits" } }
        ]
      },
      {
        cat: "Team Size",
        q: "What team environment size do you thrive in best?",
        opts: [
          { txt: "Large team / BPO account floor (50+ people)", scores: { customerService: 1 } },
          { txt: "Small tightly-knit office or tech squad (5–15 people)", scores: { tech: 1, leadership: 1 } },
          { txt: "1-on-1 direct support to business owner / client", scores: { communication: 1 } },
          { txt: "Solo independent worker / self-managed tasks", scores: { trade: 1 } }
        ]
      },
      {
        cat: "Ambition",
        q: "Where do you see yourself in 3 years of career progress?",
        opts: [
          { txt: "Team Lead, Supervisor, or People Manager", scores: { leadership: 2 } },
          { txt: "Senior Specialist or Technical Expert", scores: { tech: 1, trade: 1 } },
          { txt: "Freelancer / Business Owner", scores: { sales: 1, creative: 1 } },
          { txt: "Stable corporate career with steady growth", scores: { customerService: 1, numeracy: 1 } }
        ]
      }
    ];

    const CAREER_PROFILES = [
      {
        id: "bpo",
        title: "BPO & Customer Experience Specialist",
        salary: "₱18,000 – ₱32,000 / month",
        nextStep: "Practice mock call spoken English scripts and improve typing speed to 45+ WPM.",
        weights: { customerService: 0.4, communication: 0.4, tech: 0.2 },
        companies: ["Concentrix", "Teleperformance", "Alorica"]
      },
      {
        id: "tech",
        title: "IT Support & Junior Web Developer",
        salary: "₱22,000 – ₱45,000 / month",
        nextStep: "Complete freeCodeCamp HTML/CSS/JS or Google IT Support Professional certificate.",
        weights: { tech: 0.5, numeracy: 0.3, creative: 0.2 },
        companies: ["Globe Telecom", "Accenture", "Canva Philippines"]
      },
      {
        id: "sales",
        title: "Sales & Business Development Representative",
        salary: "₱20,000 – ₱40,000 / month + Commissions",
        nextStep: "Study client objection handling techniques and basic CRM software usage.",
        weights: { sales: 0.5, communication: 0.3, customerService: 0.2 },
        companies: ["SM Investments", "Ayala Land", "GCash / Mynt"]
      },
      {
        id: "creative",
        title: "Digital Media & Creative Design Associate",
        salary: "₱18,000 – ₱35,000 / month",
        nextStep: "Build a 5-item digital portfolio on Behance or Canva featuring social media designs.",
        weights: { creative: 0.6, communication: 0.2, tech: 0.2 },
        companies: ["Canva Philippines", "Abs-Cbn", "GMA Network"]
      },
      {
        id: "admin",
        title: "Administrative & Virtual Operations Assistant",
        salary: "₱18,000 – ₱30,000 / month",
        nextStep: "Master Google Sheets formulas, calendar management, and professional email writing.",
        weights: { numeracy: 0.3, communication: 0.3, tech: 0.2, customerService: 0.2 },
        companies: ["SM Investments", "Jollibee Foods Corp", "BDO Unibank"]
      }
    ];

    const JOBS = [
      {
        id: 101,
        title: "Customer Support Associate",
        company: "Concentrix",
        location: "Quezon City / Hybrid",
        salary: "₱22,000 - ₱28,000",
        type: "Full-time",
        reqSkill: "communication",
        setup: "Hybrid"
      },
      {
        id: 102,
        title: "Junior IT Helpdesk Specialist",
        company: "Globe Telecom",
        location: "Taguig City / Onsite",
        salary: "₱25,000 - ₱32,000",
        type: "Full-time",
        reqSkill: "tech",
        setup: "Onsite"
      },
      {
        id: 103,
        title: "Junior Graphic Designer",
        company: "Canva Philippines",
        location: "Makati / Remote",
        salary: "₱24,000 - ₱35,000",
        type: "Full-time",
        reqSkill: "creative",
        setup: "Remote"
      },
      {
        id: 104,
        title: "Account Executive / Sales Rep",
        company: "Ayala Land",
        location: "Mandaluyong / Onsite",
        salary: "₱20,000 - ₱30,000 + Comm",
        type: "Full-time",
        reqSkill: "sales",
        setup: "Onsite"
      },
      {
        id: 105,
        title: "Data Entry & Admin Specialist",
        company: "BDO Unibank",
        location: "Pasig City / Onsite",
        salary: "₱18,000 - ₱23,000",
        type: "Full-time",
        reqSkill: "numeracy",
        setup: "Onsite"
      }
    ];

    const COMPANIES = {
      "Concentrix": {
        industry: "Business Process Outsourcing (BPO)",
        size: "10,000+ employees in PH",
        benefits: ["Comprehensive HMO + 2 Dependents", "Night Differential Pay", "SSS, PhilHealth, Pag-IBIG", "13th Month Pay & Performance Bonuses"],
        description: "Concentrix is a leading global provider of customer experience (CX) solutions and technology.",
        link: "https://www.google.com/search?q=Concentrix+Philippines+Careers"
      },
      "Globe Telecom": {
        industry: "Telecommunications & Technology",
        size: "8,000+ employees",
        benefits: ["HMO Medical Coverage", "Employee Mobile Allowance", "13th & 14th Month Pay", "Hybrid Work Options"],
        description: "Globe Telecom is a major telecommunications provider in the Philippines driving digital connectivity.",
        link: "https://www.google.com/search?q=Globe+Telecom+Careers"
      },
      "Canva Philippines": {
        industry: "Visual Communications & Tech",
        size: "700+ employees in Manila Hub",
        benefits: ["Free In-office Meals & Snacks", "Generous HMO Coverage", "Flexible WFH Setup", "Learning & Wellness Allowance"],
        description: "Canva is an online visual communications platform on a mission to empower everyone to design.",
        link: "https://www.google.com/search?q=Canva+Philippines+Careers"
      },
      "Ayala Land": {
        industry: "Real Estate & Property Development",
        size: "5,000+ employees",
        benefits: ["Sales Commission Incentives", "HMO + Dental Insurance", "13th Month Pay", "Group Life Insurance"],
        description: "Ayala Land is the largest property developer in the Philippines.",
        link: "https://www.google.com/search?q=Ayala+Land+Careers"
      },
      "BDO Unibank": {
        industry: "Banking & Financial Services",
        size: "30,000+ employees nationwide",
        benefits: ["Low-interest Employee Loans", "HMO Healthcare", "Retirement Plan", "13th Month + Mid-year Bonuses"],
        description: "BDO Unibank is the largest bank in the Philippines providing full banking services.",
        link: "https://www.google.com/search?q=BDO+Unibank+Careers"
      }
    };

    /* ==========================================================================
       APPLICATION STATE MANAGEMENT
       ========================================================================== */

    let state = {
      view: "home", // home | quiz | results | visualResume
      currentQ: 0,
      xp: 0,
      answers: {},
      skills: {
        communication: 1,
        tech: 1,
        customerService: 1,
        sales: 1,
        trade: 1,
        creative: 1,
        leadership: 1,
        numeracy: 1
      },
      preferences: {
        setup: "Open",
        relocate: "Regional",
        salary: "₱18k-₱25k",
        shift: "Day",
        edu: "College Degree"
      },
      appliedJobs: {},
      selectedCompanyModal: null
    };

    /* ==========================================================================
       CORE CALCULATIONS & UTILITIES
       ========================================================================== */

    function answerQuestion(optIndex) {
      const q = QUESTIONS[state.currentQ];
      const opt = q.opts[optIndex];

      state.answers[state.currentQ] = optIndex;
      state.xp += 10;

      // Apply Skill Scores
      if (opt.scores) {
        for (let sk in opt.scores) {
          state.skills[sk] = Math.min(5, state.skills[sk] + opt.scores[sk]);
        }
      }

      // Apply Preferences
      if (opt.pref) {
        state.preferences = { ...state.preferences, ...opt.pref };
      }

      if (state.currentQ < QUESTIONS.length - 1) {
        state.currentQ++;
        render();
      } else {
        state.view = "results";
        render();
      }
    }

    function prevQuestion() {
      if (state.currentQ > 0) {
        state.currentQ--;
        render();
      }
    }

    function resetApp() {
      state = {
        view: "home",
        currentQ: 0,
        xp: 0,
        answers: {},
        skills: { communication: 1, tech: 1, customerService: 1, sales: 1, trade: 1, creative: 1, leadership: 1, numeracy: 1 },
        preferences: { setup: "Open", relocate: "Regional", salary: "₱18k-₱25k", shift: "Day", edu: "College Degree" },
        appliedJobs: {},
        selectedCompanyModal: null
      };
      render();
    }

    function calculateTopFit() {
      let bestProfile = CAREER_PROFILES[0];
      let highestScore = 0;

      CAREER_PROFILES.forEach(prof => {
        let score = 0;
        for (let sk in prof.weights) {
          score += (state.skills[sk] || 1) * prof.weights[sk];
        }
        if (score > highestScore) {
          highestScore = score;
          bestProfile = prof;
        }
      });

      return bestProfile;
    }

    function getSkillLevel(score) {
      if (score >= 4.5) return "Expert / Mastery";
      if (score >= 3.5) return "Intermediate-Advanced";
      if (score >= 2.5) return "Intermediate";
      if (score >= 1.5) return "Beginner-Intermediate";
      return "Baguhan / Novice";
    }

    function getStrengthsAndGaps() {
      const sorted = Object.entries(state.skills).sort((a,b) => b[1] - a[1]);
      const strengths = sorted.slice(0, 3).map(item => item[0]);
      const gaps = sorted.slice(-2).map(item => item[0]);
      return { strengths, gaps };
    }

    function calcJobMatch(job) {
      const reqVal = state.skills[job.reqSkill] || 1;
      let match = Math.round((reqVal / 5) * 100);
      if (job.setup === state.preferences.setup) match += 10;
      return Math.min(98, Math.max(55, match));
    }

    function toggleApplyJob(jobId) {
      state.appliedJobs[jobId] = !state.appliedJobs[jobId];
      render();
    }

    function openCompanyModal(companyName) {
      state.selectedCompanyModal = COMPANIES[companyName] ? { name: companyName, ...COMPANIES[companyName] } : null;
      render();
    }

    function closeCompanyModal() {
      state.selectedCompanyModal = null;
      render();
    }

    function copyTextResume() {
      const best = calculateTopFit();
      const text = `================================================
JOBSTART CAREER PROFILE RESUME
================================================
Target Sector: ${best.title}
Target Salary: ${state.preferences.salary}
Work Setup Preference: ${state.preferences.setup}

SKILL LEVELS:
- Communication: ${state.skills.communication}/5
- Technology: ${state.skills.tech}/5
- Customer Service: ${state.skills.customerService}/5
- Sales: ${state.skills.sales}/5
- Creative: ${state.skills.creative}/5
- Numeracy: ${state.skills.numeracy}/5

Education: ${state.preferences.edu}
Experience Level: Entry / Fresh Graduate
Status: Verified JobStart Profile
================================================`;

      navigator.clipboard.writeText(text);
      alert("LinkedIn-Ready Plain Text Resume copied to clipboard!");
    }

    /* ==========================================================================
       RENDER VIEWS
       ========================================================================== */

    function render() {
      const app = document.getElementById("app");
      let html = "";

      // 1. HOME VIEW
      if (state.view === "home") {
        html = `
          <div class="card hero">
            <div class="hero-eyebrow">Career & Skill Discovery</div>
            <h1>Find your ideal career — one tap at a time</h1>
            <p>Answer 30 quick multiple-choice questions. No typing needed. We'll surface your top strengths, a realistic salary range, and job openings in the Philippines that actually fit you.</p>
            <button class="btn" onclick="state.view='quiz'; render();">🚀 Start the quiz</button>
            <div class="hero-meta">
              <span>⏱️ ~5 minutes</span>
              <span>✅ 30 questions</span>
              <span>🎯 Personalized matches</span>
            </div>
          </div>
        `;
      }

      // 2. QUIZ VIEW
      else if (state.view === "quiz") {
        const q = QUESTIONS[state.currentQ];
        const progressPct = Math.round(((state.currentQ + 1) / QUESTIONS.length) * 100);

        html = `
          <div class="progress-container">
            <div class="progress-info">
              <span>Question ${state.currentQ + 1} of ${QUESTIONS.length}</span>
              <span class="xp-badge">⚡ ${state.xp} XP</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <div class="card">
            <div class="q-category">${q.cat}</div>
            <div class="q-title">${q.q}</div>

            <div class="options-grid">
              ${q.opts.map((opt, idx) => `
                <button class="option-btn ${state.answers[state.currentQ] === idx ? 'selected' : ''}" onclick="answerQuestion(${idx})">
                  <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                  <span class="option-txt">${opt.txt}</span>
                  <span class="option-arrow">➔</span>
                </button>
              `).join("")}
            </div>

            <div class="quiz-footer">
              <button class="btn btn-secondary" onclick="prevQuestion()" ${state.currentQ === 0 ? 'disabled' : ''}>← Back</button>
              <span class="quiz-hint">Tap an option to continue</span>
            </div>
          </div>
        `;
      }

      // 3. RESULTS VIEW
      else if (state.view === "results") {
        const best = calculateTopFit();
        const { strengths, gaps } = getStrengthsAndGaps();

        html = `
          <div class="card hero-result">
            <div style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.9; font-weight: 700;">Your best match</div>
            <h2 style="font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; margin: 6px 0;">${best.title}</h2>
            <p style="margin-bottom: 14px; opacity: 0.95;">Estimated entry salary: <strong>${best.salary}</strong></p>
            <div style="background: rgba(255,255,255,0.16); padding: 14px; border-radius: var(--radius-sm); font-size: 0.9rem; line-height: 1.5;">
              💡 <strong>Next step:</strong> ${best.nextStep}
            </div>
          </div>

          <div class="results-grid">
            <!-- Skill Scoring Profile -->
            <div class="card">
              <h3 style="margin-bottom: 16px;">📊 Your Skill Profile</h3>
              ${Object.entries(state.skills).map(([key, val]) => `
                <div class="skill-row">
                  <span class="skill-name" style="text-transform: capitalize;">${key}</span>
                  <div class="skill-dots">
                    ${[1,2,3,4,5].map(d => `<div class="dot ${d <= val ? 'active' : ''}"></div>`).join("")}
                  </div>
                </div>
              `).join("")}
              <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border);" />
              <div>
                <p style="font-size: 0.85rem; margin-bottom: 4px;">Overall Level: <span class="badge badge-blue">${getSkillLevel(Object.values(state.skills).reduce((a,b)=>a+b,0)/8)}</span></p>
                <p style="font-size: 0.85rem;">Top Strengths: <strong style="text-transform: capitalize;">${strengths.join(", ")}</strong></p>
              </div>
            </div>

            <!-- Job Matches -->
            <div class="card">
              <h3 style="margin-bottom: 16px;">💼 Jobs matched to you</h3>
              ${JOBS.map(job => {
                const matchPct = calcJobMatch(job);
                const isApplied = state.appliedJobs[job.id];
                return `
                  <div class="job-card">
                    <div class="job-header">
                      <div>
                        <div class="job-title">${job.title}</div>
                        <span class="company-link" onclick="openCompanyModal('${job.company}')">${job.company}</span>
                      </div>
                      <span class="badge badge-green">${matchPct}% match</span>
                    </div>
                    <div style="font-size: 0.83rem; color: var(--text-muted); margin-bottom: 14px;">
                      📍 ${job.location} &nbsp;·&nbsp; 💰 ${job.salary}
                    </div>
                    <button class="btn ${isApplied ? 'btn-secondary' : 'btn-outline'}" style="width:100%; padding: 9px 12px; font-size: 0.85rem;" onclick="toggleApplyJob(${job.id})">
                      ${isApplied ? '✓ Application submitted (demo)' : '⚡ 1-click apply (demo)'}
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <!-- Resume Export Options -->
          <div class="card" style="text-align: center;">
            <h3>📄 Turn this into a resume</h3>
            <p style="color: var(--text-muted); margin-bottom: 18px;">Export your skills and preferences as a ready-to-use resume.</p>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
              <button class="btn" onclick="copyTextResume()">📋 Copy plain-text resume</button>
              <button class="btn btn-secondary" onclick="state.view='visualResume'; render();">🖼️ View printable resume</button>
            </div>
          </div>
        `;
      }

      // 4. VISUAL PRINTABLE RESUME VIEW
      else if (state.view === "visualResume") {
        const best = calculateTopFit();
        const { strengths, gaps } = getStrengthsAndGaps();

        html = `
          <div class="no-print" style="margin-bottom: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
            <button class="btn btn-secondary" onclick="state.view='results'; render();">← Back to dashboard</button>
            <button class="btn" onclick="window.print();">🖨️ Print / save as PDF</button>
          </div>

          <div class="card visual-cv">
            <div class="cv-header">
              <div class="cv-name">JobStart Applicant Profile</div>
              <div style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;">Target industry: <strong>${best.title}</strong> &nbsp;·&nbsp; Preferred setup: ${state.preferences.setup}</div>
            </div>

            <div class="cv-grid">
              <div>
                <h4 class="cv-section-title">Skill Evaluation</h4>
                ${Object.entries(state.skills).map(([sk, val]) => `
                  <div style="font-size: 0.85rem; margin-bottom: 10px;">
                    <div style="text-transform: capitalize; font-weight: 600; margin-bottom: 3px;">${sk}</div>
                    <div class="skill-dots">
                      ${[1,2,3,4,5].map(d => `<div class="dot ${d <= val ? 'active' : ''}"></div>`).join("")}
                    </div>
                  </div>
                `).join("")}
              </div>

              <div>
                <h4 class="cv-section-title">Profile Summary</h4>
                <p style="font-size: 0.9rem; margin-bottom: 16px;">
                  Highly motivated job seeker with a strong foundation in <strong>${strengths.join(", ")}</strong>. Target starting salary range is <strong>${state.preferences.salary}</strong>, with a preference for <strong>${state.preferences.setup}</strong> work.
                </p>

                <h4 class="cv-section-title">Education & Preferences</h4>
                <ul style="font-size: 0.9rem; margin-left: 18px; margin-bottom: 16px; line-height: 1.7;">
                  <li>Education level: ${state.preferences.edu}</li>
                  <li>Shift availability: ${state.preferences.shift}</li>
                  <li>Relocation willingness: ${state.preferences.relocate}</li>
                </ul>

                <h4 class="cv-section-title">Recommended Action Plan</h4>
                <p style="font-size: 0.85rem; background: var(--bg); padding: 12px; border-radius: var(--radius-sm); line-height: 1.6;">
                  ${best.nextStep} Focus skill expansion on improving <strong>${gaps.join(" & ")}</strong>.
                </p>
              </div>
            </div>
          </div>
        `;
      }

      // 5. COMPANY DETAILS MODAL OVERLAY
      if (state.selectedCompanyModal) {
        const comp = state.selectedCompanyModal;
        html += `
          <div class="modal-overlay" onclick="closeCompanyModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeCompanyModal()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.3rem; color: var(--primary-dark); margin-bottom: 4px;">${comp.name}</h2>
              <div style="font-size: 0.83rem; color: var(--text-muted); margin-bottom: 14px;">${comp.industry} &nbsp;·&nbsp; ${comp.size}</div>
              <p style="font-size: 0.93rem; margin-bottom: 18px; color: var(--text);">${comp.description}</p>

              <h4 style="font-size: 0.85rem; margin-bottom: 10px;">Standard employee benefits</h4>
              <ul style="margin-left: 20px; font-size: 0.88rem; margin-bottom: 22px; line-height: 1.7; color: var(--text);">
                ${comp.benefits.map(b => `<li>${b}</li>`).join("")}
              </ul>

              <div style="display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
                <span style="font-size: 0.74rem; color: var(--text-muted);">* Demo company profile overview</span>
                <a href="${comp.link}" target="_blank" class="btn" style="text-decoration:none;">Search openings ↗</a>
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = html;
    }

    // Initialize App
    render();
  </script>
