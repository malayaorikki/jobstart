<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobStart</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230b5c55'/%3E%3Cstop offset='100%25' stop-color='%232dd4bf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='40' font-family='Arial, sans-serif' font-size='24' font-weight='800' letter-spacing='-1' fill='white' text-anchor='middle'%3EJS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #0b5c55;
      --primary-light: #2dd4bf;
      --accent: var(--primary);
      --accent-dark: var(--primary-dark);
      --indigo: var(--primary);
      --bg: #f8faf8;
      --card-bg: #ffffff;
      --text: #1c2321;
      --text-muted: #6b7280;
      --border: #e7e2da;
      --success: #16a34a;
      --radius: 14px;
      --radius-sm: 9px;
      --font-display: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
    }
    body { font-family: var(--font-body); background: radial-gradient(circle at 50% -10%, rgba(20,184,166,.10), transparent 34%), var(--bg); color: var(--text); line-height: 1.55; padding: 24px 16px 60px; overflow-x: hidden; }
    .container { max-width: 900px; margin: 0 auto; transition: max-width 0.2s ease; }
    /* Widen the canvas on larger screens so dashboard-style views (like the
       job seeker profile) have room for a real multi-column layout instead
       of one narrow mobile-width column stretched down the page. */
    @media (min-width: 1000px) { .container { max-width: 1000px; } }
    @media (min-width: 1240px) { .container.wide { max-width: 1200px; } }

    h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.01em; margin: 0; }
    h3 { font-size: 1.15rem; font-weight: 700; }

    a:focus-visible, button:focus-visible, .option-btn:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 2px;
    }

    /* Header & Navigation */
    header { display: flex; flex-direction: row; align-items: center; justify-content: space-between; text-align: left; gap: 16px; margin-bottom: 28px; padding: 4px 2px; flex-wrap: wrap; row-gap: 8px; }
    @media (max-width: 420px) {
      header { gap: 10px; }
      .live-clock { font-size: 0.78rem; }
    }
    .logo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; font-style: normal; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 9px; letter-spacing: -0.04em; flex-shrink: 0; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary-dark), var(--primary-light)); color: white; font-family: var(--font-display); font-size: .74rem; font-weight: 800; letter-spacing: -0.03em; box-shadow: 0 5px 12px rgba(15,118,110,.18); }
    .logo-text .accent-dot { color: var(--accent); }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; }
    .live-clock { color: var(--text); font-size: 0.84rem; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
    .live-clock strong { color: var(--text); font-weight: 700; }

    /* Cards */
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 26px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(28,35,33,0.04), 0 8px 24px -12px rgba(28,35,33,0.08); margin-bottom: 20px; }

    /* Progress & XP Bar — "runway" motif */
    .progress-container { margin-bottom: 20px; }
    .progress-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .progress-bar-bg { position: relative; width: 100%; height: 10px; background: var(--border); border-radius: 20px; overflow: visible; }
    .progress-bar-fill { position: relative; height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); transition: width 0.35s ease; }
    .progress-bar-fill::after { content: ""; position: absolute; right: -1px; top: 50%; width: 12px; height: 12px; transform: translateY(-50%); background: var(--card-bg); border: 2px solid var(--primary); border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
    .xp-badge { background: #effaf9; color: var(--accent-dark); padding: 3px 10px; border-radius: 20px; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.01em; }

    /* Hero / Home View */
    .hero { position: relative; overflow: hidden; text-align: center; padding: 58px 24px 52px; background: linear-gradient(145deg, #ffffff 0%, #f7fffd 100%); border-color: #dceeea; }
    .hero::before, .hero::after { content: ""; position: absolute; border-radius: 999px; pointer-events: none; }
    .hero::before { width: 220px; height: 220px; background: rgba(45,212,191,.09); top: -125px; left: -90px; }
    .hero::after { width: 180px; height: 180px; background: rgba(15,118,110,.08); right: -80px; bottom: -105px; }
    .hero > * { position: relative; z-index: 1; }
    .hero-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.075em; text-transform: uppercase; color: var(--primary-dark); margin-bottom: 16px; }
    .hero-eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(15,118,110,.12); }
    .hero h1 { font-size: clamp(2.15rem, 5vw, 3rem); font-weight: 800; margin-bottom: 15px; line-height: 1.1; letter-spacing: -0.045em; }
    .hero p { color: var(--text-muted); font-size: 1rem; max-width: 590px; margin: 0 auto 30px auto; }
    .hero-meta { display: flex; justify-content: center; gap: 20px; margin-top: 22px; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); }
    .hero-meta span { display: inline-flex; align-items: center; gap: 6px; }

    /* "See what JobStart can tell you" preview section — sits right under the hero,
       pairing a short pitch + feature pills on the left with a mocked-up example
       career-match card on the right so people see the shape of their results
       before they've answered a single question. */
    .preview-section { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: center; padding: 30px 28px; }
    @media (min-width: 860px) { .preview-section { grid-template-columns: 1.05fr 0.95fr; padding: 34px; } }
    .preview-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.075em; text-transform: uppercase; color: var(--primary-dark); margin-bottom: 14px; }
    .preview-eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(15,118,110,.12); }
    .preview-copy h2 { font-size: clamp(1.5rem, 3vw, 1.9rem); font-weight: 800; line-height: 1.18; letter-spacing: -0.03em; margin-bottom: 14px; }
    .preview-copy p { color: var(--text-muted); font-size: 0.94rem; max-width: 480px; margin-bottom: 20px; }
    .preview-pills { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 18px; }
    .preview-pill { border: 1.5px solid var(--border); background: white; padding: 8px 16px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .preview-link { display: inline-flex; align-items: center; gap: 6px; color: var(--primary-dark); font-weight: 700; font-size: 0.9rem; text-decoration: none; }
    .preview-link:hover { text-decoration: underline; text-underline-offset: 3px; }

    .match-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 8px 28px -14px rgba(28,35,33,0.16); }
    .match-card-eyebrow { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
    .match-card-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
    .match-card-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
    .match-ring { position: relative; width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--primary) 0% 92%, #e6f6f4 92% 100%); }
    .match-ring::before { content: ""; position: absolute; inset: 5px; background: white; border-radius: 50%; }
    .match-ring span { position: relative; font-family: var(--font-display); font-weight: 800; font-size: 0.86rem; color: var(--primary-dark); }
    .match-card-salary { color: var(--primary-dark); font-weight: 700; font-size: 0.98rem; margin-bottom: 18px; }
    .match-skill-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .match-skill-name { font-size: 0.84rem; font-weight: 600; width: 108px; flex-shrink: 0; }
    .match-skill-track { flex: 1; height: 7px; background: var(--border); border-radius: 20px; overflow: hidden; }
    .match-skill-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); }
    .match-skill-val { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); width: 24px; text-align: right; flex-shrink: 0; }
    .match-card-note { font-size: 0.78rem; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; }

    /* Job-matches dashboard cards reuse the .match-card look above, with a
       clickable/hover treatment so they still read as list items. Sized down
       from the base .match-card (which the homepage example card still uses
       at full size) so a grid of these doesn't feel oversized. */
    .job-cards-grid .match-card { margin-bottom: 0; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; padding: 18px; }
    .job-cards-grid .match-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -12px rgba(28,35,33,0.18); border-color: var(--primary-light); }
    .job-cards-grid .match-card-top { margin-bottom: 12px; }
    .job-cards-grid .match-card-salary { margin-bottom: 12px; }
    .job-cards-grid .match-skill-row { margin-bottom: 8px; }
    .job-cards-grid .match-card-note { margin-top: 12px; padding-top: 10px; }
    .job-cards-grid .match-ring { width: 46px; height: 46px; }
    .job-match-card .match-card-title { font-size: 1.05rem; margin-bottom: 4px; }
    .job-match-card .company-link { font-size: 0.86rem; }

    /* Secondary audiences: available without interrupting the primary job-seeker journey. */
    .audience-links { display:flex; justify-content:center; align-items:center; gap:8px 18px; flex-wrap:wrap; margin: -4px 0 20px; padding: 10px 14px; font-size:0.84rem; color:var(--text-muted); }
    .audience-links .audience-label { font-weight:600; color:var(--text-muted); }
    .audience-link { color:var(--text); text-decoration:none; font-weight:700; border-bottom:1px solid transparent; transition:color .15s ease,border-color .15s ease; }
    .audience-link:hover { color:var(--primary-dark); border-color:var(--primary-light); }
    .audience-link.employer-link:hover { color:var(--accent-dark); border-color:var(--accent); }
    .audience-link.training-link:hover { color:var(--primary-dark); border-color:var(--primary-light); }
    .secondary-audience { display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:20px; }
    @media (min-width:700px) { .secondary-audience { grid-template-columns:1fr 1fr; } }
    .secondary-audience-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .secondary-audience-card .audience-copy { min-width:0; }
    .secondary-audience-card .audience-title { font-family:var(--font-display); font-weight:700; margin-bottom:3px; }
    .secondary-audience-card .audience-desc { color:var(--text-muted); font-size:.82rem; }
    .secondary-audience-card .btn { flex-shrink:0; }

    /* Homepage sections */
    .section-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
    .section-subtitle { font-size: 0.86rem; color: var(--text-muted); margin-bottom: 18px; }

    .stats-bar { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
    .stat-item { text-align: center; padding: 0 26px; }
    .stat-item + .stat-item { border-left: 1px solid var(--border); }
    .stat-number { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); line-height: 1.1; }
    .stat-label { font-size: 0.76rem; color: var(--text-muted); margin-top: 4px; }

    .steps-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 700px) { .steps-grid { grid-template-columns: repeat(3, 1fr); } }
    .step-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px; background: var(--card-bg); }
    .step-num { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; margin-bottom: 14px; }
    .step-title { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; margin-bottom: 6px; }
    .step-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.55; }

    .paths-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 700px) { .paths-grid { grid-template-columns: repeat(2, 1fr); } }
    .path-card { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; background: white; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; text-align: left; }
    .path-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px rgba(28,35,33,0.15); border-color: var(--primary-light); }
    .path-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 3px; }
    .path-salary { font-size: 0.8rem; color: var(--text-muted); }

    .companies-strip { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .company-pill { border: 1px solid var(--border); background: white; padding: 9px 18px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.15s ease; }
    .company-pill:hover { border-color: var(--primary-light); background: #f6fbfa; color: var(--primary-dark); }

    .btn { font-family: var(--font-body); background: var(--primary); color: white; border: none; padding: 13px 26px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #f1efe9; color: var(--text); }
    .btn-secondary:hover { background: #e7e2da; }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); padding: 11.5px 26px; }
    .btn-outline:hover { background: #effaf9; }
    .btn-danger { background: transparent; border: 1.5px solid #c0392b; color: #c0392b; padding: 11.5px 26px; }
    .btn-danger:hover { background: #c0392b; color: white; }
    .btn-danger.confirming { background: #c0392b; color: white; border-color: #c0392b; }
    .btn-danger.confirming:hover { background: #a93226; }
    .btn-sm { padding: 8px 16px; font-size: 0.8rem; }

    /* Quiz Options */
    .q-category { text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
    .q-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; margin-bottom: 4px; line-height: 1.35; }
    .q-title-alt { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .option-btn { width: 100%; text-align: left; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: white; cursor: pointer; transition: all 0.15s ease; font-family: var(--font-body); font-size: 0.94rem; font-weight: 500; color: var(--text); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    @media (hover: hover) and (pointer: fine) {
      .option-btn:hover { border-color: var(--primary-light); background: #f6fbfa; }
      .option-btn:hover .option-letter { background: var(--primary-light); color: white; }
    }
    .option-btn:active { border-color: var(--primary-light); background: #f6fbfa; }
    .option-btn.selected { border-color: var(--primary); background: #effaf9; box-shadow: inset 0 0 0 1px var(--primary); }
    .option-btn.multi .option-letter { border-radius: 7px; }
    .option-letter { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
    .option-btn.selected .option-letter { background: var(--primary); color: white; }
    .option-txt-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .option-txt { flex: 1; }
    .option-alt { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; }
    .option-arrow { color: var(--text-muted); flex-shrink: 0; }

    .quiz-footer { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .quiz-hint { font-size: 0.82rem; color: var(--text-muted); }

    /* Results Dashboard Grid */
    .results-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .results-grid { grid-template-columns: 1fr 1fr; } }

    .hero-result { background: linear-gradient(135deg, var(--primary-dark), var(--primary) 60%, var(--primary-light)); color: white; }

    /* "Your Career Path" profile card — the top banner of the job-seeker
       results dashboard. Light mint card with an eyebrow label, big title,
       a match-percentage ring in the corner, salary/hiring-now stats, a
       bordered "next step" callout, and two primary actions. */
    .career-card { position: relative; overflow: hidden; padding: 32px 30px; background: linear-gradient(160deg, #eafbf7 0%, #f8fffb 55%, #ffffff 100%); border-color: #dceeea; }
    .career-card::before { content: ""; position: absolute; width: 230px; height: 230px; border-radius: 999px; background: rgba(45,212,191,.08); top: -120px; right: -70px; pointer-events: none; }
    .career-card > * { position: relative; z-index: 1; }
    .career-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 22px; flex-wrap: wrap; margin-bottom: 24px; }
    .career-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.075em; text-transform: uppercase; color: var(--primary-dark); margin-bottom: 10px; }
    .career-eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(15,118,110,.12); flex-shrink: 0; }
    .career-title { font-size: clamp(1.55rem, 3.2vw, 2.05rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.16; margin-bottom: 12px; }
    .career-desc { color: var(--text-muted); font-size: 0.94rem; max-width: 580px; }
    .career-desc strong { color: var(--text); font-weight: 700; }
    .career-ring { position: relative; width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .career-ring::before { content: ""; position: absolute; inset: 6px; background: white; border-radius: 50%; }
    .career-ring span { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: var(--primary-dark); }
    .career-meta-row { display: flex; gap: 40px; flex-wrap: wrap; margin-bottom: 22px; }
    .career-meta-label { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
    .career-meta-value { font-weight: 700; font-size: 0.98rem; color: var(--text); }
    .career-nextstep { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; font-size: 0.9rem; color: var(--text); margin-bottom: 22px; }
    .career-nextstep strong { color: var(--text); }
    .career-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .career-stats-row { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border); }
    .career-stat-num { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--primary-dark); line-height: 1.1; }
    .career-stat-label { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

    /* Job Seeker Profile — desktop dashboard layout.
       Sidebar (identity + skills + preferences + resume actions) stays put
       on the left; the main column (job matches + skill-gap courses) scrolls
       independently on the right so nothing has to be hunted for. */
    .profile-dashboard { display: grid; grid-template-columns: 1fr; gap: 22px; align-items: start; }
    @media (min-width: 1000px) { .profile-dashboard { grid-template-columns: 320px 1fr; gap: 24px; } }
    .profile-sidebar { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    @media (min-width: 1000px) { .profile-sidebar { position: sticky; top: 24px; } }
    .profile-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    .profile-id-card { display: flex; align-items: center; gap: 14px; }
    .profile-avatar { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; flex-shrink: 0; }
    .profile-id-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
    .profile-id-role { font-size: 0.82rem; opacity: 0.9; }
    /* Small pill that names the current portal (Company/Training) — the only place
       role color appears in the hero now that the hero itself is neutral/teal. */
    .portal-role-tag { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; vertical-align: middle; }
    .portal-role-tag.company { background: #effaf9; color: var(--accent-dark); }
    .portal-role-tag.training { background: #effaf9; color: var(--primary-dark); }

    .sidebar-section-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .pref-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .pref-chip { display: inline-flex; align-items: center; gap: 6px; background: #f6fbfa; border: 1px solid var(--border); color: var(--text); padding: 6px 11px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .pref-chip .pref-chip-label { color: var(--text-muted); font-weight: 500; }

    /* Pre-quiz preference picker — pill-style single-select groups shown on
       the "Before you begin" intro panel, ahead of the 30 interest questions. */
    .pref-picker { text-align: left; margin-bottom: 24px; padding-top: 4px; border-top: 1px solid var(--border); }
    .pref-picker-intro { font-size: 0.85rem; color: var(--text-muted); margin: 14px 0 18px; }
    .pref-picker-label { font-size: 0.82rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .pref-picker-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .pref-pick-btn { padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 20px; background: white; font-family: var(--font-body); font-size: 0.83rem; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.15s ease; }
    .pref-pick-btn:hover { border-color: var(--primary-light); background: #f6fbfa; }
    .pref-pick-btn.selected { border-color: var(--primary); background: var(--primary); color: white; }

    .quick-stats-row { display: flex; gap: 14px; flex-wrap: wrap; }
    .quick-stat { flex: 1; min-width: 130px; background: rgba(255,255,255,0.14); border-radius: var(--radius-sm); padding: 12px 14px; }
    .quick-stat-num { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
    .quick-stat-label { font-size: 0.74rem; opacity: 0.9; margin-top: 2px; }

    .jobs-list-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .jobs-list-header h3 { margin-bottom: 0; }
    .job-cards-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 1400px) { .job-cards-grid { grid-template-columns: 1fr 1fr; } }
    .courses-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 1400px) { .courses-grid { grid-template-columns: 1fr 1fr 1fr; } }
    .courses-grid .list-row { margin-bottom: 0; }
    /* Skill-gap course cards reuse the job .match-card look, in the training
       portal's indigo accent, so "Close your skill gaps" reads as a sibling
       grid to "Jobs matched to you" rather than a plain list. */
    .courses-grid .match-card { margin-bottom: 0; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .courses-grid .match-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -12px rgba(28,35,33,0.18); border-color: #a5b4fc; }
    .course-match-card .match-card-title { font-size: 1.02rem; margin-bottom: 4px; }
    .course-provider-link { color: var(--primary-dark); font-weight: 600; font-size: 0.86rem; cursor: default; }
    .course-match-ring { background: #effaf9 !important; }
    .course-match-ring span { font-size: 1.1rem; }
    .course-skill-fill { background: linear-gradient(90deg, #6366f1, #a5b4fc) !important; }
    .course-match-card .match-card-salary { color: var(--primary-dark); }
    .job-cards-grid .job-card { margin-bottom: 0; }

    /* Skill Meter */
    .skill-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
    .skill-name { font-size: 0.88rem; font-weight: 600; }
    .skill-dots { display: flex; gap: 5px; flex-shrink: 0; }
    .dot { width: 20px; height: 7px; border-radius: 4px; background: var(--border); }
    .dot.active { background: var(--primary); }

    /* Badges & Tags */
    .badge { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 0.74rem; font-weight: 700; }
    .badge-blue { background: #e6f6f4; color: var(--primary-dark); }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #effaf9; color: var(--accent-dark); }

    /* Job Listings */
    .job-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; background: white; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .job-card:last-child { margin-bottom: 0; }
    .job-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px rgba(28,35,33,0.15); border-color: var(--primary-light); }
    .job-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .job-title { font-weight: 700; font-size: 1rem; }
    .company-link { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; font-size: 0.92rem; }
    .company-link:hover { text-decoration: underline; }

    /* Modal */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(28,35,33,0.55); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(2px); }
    .modal-content { background: white; border-radius: 20px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; box-shadow: 0 24px 60px -20px rgba(28,35,33,0.28); }

    /* Detail panel — clean label/value rows used inside modals (job, course, company details) */
    .detail-panel { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 18px; margin: 18px 0; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 0; font-size: 0.87rem; }
    .detail-row + .detail-row { border-top: 1px solid var(--border); }
    .detail-row .detail-label { color: var(--text-muted); font-weight: 600; }
    .detail-row .detail-value { font-weight: 700; color: var(--text); text-align: right; }
    .close-btn { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: none; background: #f1efe9; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    @media (pointer: coarse) {
      .close-btn::after, .row-icon-btn::after, .entry-remove::after {
        content: ""; position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%);
      }
      .row-icon-btn, .entry-remove { position: relative; }
    }

    /* Minimalist row-level edit/delete icon buttons — for the small set of
       actions where the poster manages their own listing (job posts, course
       offers). Icon-only, muted by default, colored only on hover so they
       don't compete with the row's primary content. */
    .row-icon-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .row-icon-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); font-size: 0.85rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s ease, color 0.15s ease; }
    .row-icon-btn:hover { background: #f1efe9; color: var(--text); }
    .row-icon-btn.danger:hover { background: #fdecec; color: #c0392b; }
    .row-icon-btn.confirming { width: auto; padding: 0 10px; border-radius: 13px; background: #fdecec; color: #c0392b; font-size: 0.76rem; font-weight: 700; }
    .row-icon-btn.confirming:hover { background: #fbdada; }
    .close-btn:hover { background: #e7e2da; }

    /* Visual Resume Styling (Screen & Print) */
    .visual-cv { background: white; border: 1px solid var(--border); padding: 36px; border-radius: var(--radius); color: var(--text); }
    .cv-header { border-bottom: 2px solid var(--primary); padding-bottom: 18px; margin-bottom: 22px; }
    .cv-name { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--primary-dark); letter-spacing: 0.02em; }
    .cv-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 28px; }
    @media (max-width: 600px) { .cv-grid { grid-template-columns: 1fr; } }
    .cv-section-title { font-family: var(--font-display); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary-dark); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 14px; }

    /* Resume Builder Form */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-input, .form-textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 1rem; color: var(--text); background: white;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
    .form-input.has-error, .form-textarea.has-error { border-color: #dc2626; }
    .form-input.has-error:focus, .form-textarea.has-error:focus { box-shadow: 0 0 0 3px rgba(220,38,38,0.15); }
    .field-error { color: #dc2626; font-size: 0.78rem; margin-top: 5px; }
    .field-hint { color: var(--text-muted); font-size: 0.78rem; margin-top: 5px; }
    /* JobStart's teal is the one consistent brand color across every portal — forms,
       badges, chips, and bars all use the default teal styling everywhere. Orange
       (Companies) and indigo (Training) are reserved for small, contained role
       markers only: the portal-role-tag pill, the sidebar's active-nav state, and
       the portal-picker icons — see those rules below. */
    .form-textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .section-hint { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; margin-top: -4px; }

    .entry-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px; background: var(--bg); position: relative; }
    .entry-remove { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
    .entry-remove:hover { background: #fee2e2; color: #dc2626; }
    .add-entry-btn { width: 100%; padding: 11px; border: 1.5px dashed var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--primary); font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: all 0.15s ease; font-family: var(--font-body); }
    .add-entry-btn:hover { background: #effaf9; border-color: var(--primary-light); }

    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tag-chip { display: inline-flex; align-items: center; gap: 6px; background: #effaf9; color: var(--primary-dark); padding: 5px 10px 5px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; }
    .tag-chip button { background: none; border: none; color: var(--primary-dark); cursor: pointer; font-size: 0.9rem; line-height: 1; opacity: 0.6; padding: 0; }
    .tag-chip button:hover { opacity: 1; }
    .tag-input-row { display: flex; gap: 8px; }
    .tag-input-row .form-input { flex: 1; }

    /* Portal Chooser */
    .portal-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    @media (min-width: 700px) { .portal-grid { grid-template-columns: repeat(3, 1fr); } }
    .portal-card { text-align: left; border: 1.5px solid var(--border); border-radius: var(--radius); padding: 24px 22px; background: white; cursor: pointer; transition: all 0.15s ease; display: flex; flex-direction: column; gap: 12px; }
    .portal-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px -12px rgba(28,35,33,0.18); border-color: var(--primary-light); }
    /* Only the hover border is color-coded here — a light preview of the portal's role
       color as you consider it. Everything else on the card (icon, arrows) is neutral
       teal so the badge and this hover are the only two colored touchpoints in the app. */
    .portal-card.company:hover { border-color: var(--accent); }
    .portal-card.training:hover { border-color: var(--primary-dark); }
    .portal-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; background: #effaf9; }
    .portal-title { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; }
    .portal-desc { font-size: 0.85rem; color: var(--text-muted); }
    .portal-steps { list-style: none; font-size: 0.82rem; color: var(--text); display: flex; flex-direction: column; gap: 5px; margin: 2px 0 4px; }
    .portal-steps li { display: flex; align-items: flex-start; gap: 7px; }
    .portal-steps li::before { content: "→"; color: var(--primary); font-weight: 700; flex-shrink: 0; }
    .portal-card .btn { align-self: flex-start; margin-top: auto; }
    .portal-steps { margin-bottom: 0; }

    /* Dashboard sub-nav (used inside Company / Training portals) */
    .dash-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .dash-eyebrow { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--primary); }
    .dash-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
    .dash-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .dash-tab { padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--border); background: white; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; font-family: var(--font-body); transition: all 0.15s ease; }
    .dash-tab:hover { border-color: var(--primary-light); color: var(--text); }
    .dash-tab.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* Company Portal — sidebar nav, kept identical in shape to the job-seeker
       profile-sidebar so the whole app feels like one consistent product.
       Every company sub-view (job posts, applications,
       post-a-job) renders inside this same shell, so switching between them
       is one click from an always-visible menu instead of a "← Back" chain. */
    .company-hero { background: linear-gradient(115deg, #0b5c55 0%, #0f766e 45%, #2dd4bf 120%); border: none; color: #ffffff; box-shadow: 0 10px 30px -14px rgba(11,92,85,0.45); }
    .company-hero .profile-avatar { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35); color: #ffffff; }
    .company-hero .portal-role-tag.company { background: rgba(255,255,255,0.2); color: #ffffff; }
    .company-hero .profile-id-role { color: rgba(255,255,255,0.92); }
    .company-hero .quick-stat { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); }
    .company-hero .quick-stat-num { color: #ffffff; }
    .company-hero .quick-stat-label { opacity: 0.88; color: #ffffff; }
    .company-nav { display: flex; flex-direction: column; gap: 6px; }
    .company-nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid transparent;
      background: transparent; color: var(--text); font-family: var(--font-body);
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .company-nav-btn .nav-icon { font-size: 1rem; flex-shrink: 0; }
    .company-nav-btn .nav-count { margin-left: auto; font-size: 0.74rem; font-weight: 700; color: var(--text-muted); background: var(--bg); border-radius: 20px; padding: 2px 9px; }
    .company-nav-btn:hover { background: var(--bg); color: var(--text); }
    .company-nav-btn.active { background: #effaf9; border-color: var(--primary); color: var(--primary-dark); }
    .company-nav-btn.active .nav-count { background: white; color: var(--primary-dark); }
    .company-nav-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    /* Action buttons stay JobStart teal in every portal — orange only marks the role
       (nav active state above, portal-role-tag, portal-picker icon), not the actions. */
    .company-btn { background: var(--primary); }
    .company-btn:hover { background: var(--primary-dark); }
    .company-btn-outline { border-color: var(--primary); color: var(--primary); }
    .company-btn-outline:hover { background: #effaf9; }

    /* Training Providers Portal — same sidebar-nav shell as the company
       portal, in its own indigo accent so it's visually distinct at a glance
       while still feeling like one consistent app. */
    .training-hero { background: linear-gradient(115deg, #0b5c55 0%, #0f766e 45%, #2dd4bf 120%); border: none; color: #ffffff; box-shadow: 0 10px 30px -14px rgba(11,92,85,0.45); }
    .training-hero .profile-avatar { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35); color: #ffffff; }
    .training-hero .portal-role-tag.training { background: rgba(255,255,255,0.2); color: #ffffff; }
    .training-hero .profile-id-role { color: rgba(255,255,255,0.92); }
    .training-hero .quick-stat { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); }
    .training-hero .quick-stat-num { color: #ffffff; }
    .training-hero .quick-stat-label { opacity: 0.88; color: #ffffff; }
    .training-nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid transparent;
      background: transparent; color: var(--text); font-family: var(--font-body);
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .training-nav-btn .nav-icon { font-size: 1rem; flex-shrink: 0; }
    .training-nav-btn .nav-count { margin-left: auto; font-size: 0.74rem; font-weight: 700; color: var(--text-muted); background: var(--bg); border-radius: 20px; padding: 2px 9px; }
    .training-nav-btn:hover { background: var(--bg); color: var(--text); }
    .training-nav-btn.active { background: #effaf9; border-color: var(--primary); color: var(--primary-dark); }
    .training-nav-btn.active .nav-count { background: white; color: var(--primary-dark); }
    .training-btn { background: var(--primary); }
    .training-btn:hover { background: var(--primary-dark); }

    /* Generic list rows (candidates, applications, courses) */
    .list-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; background: white; transition: all 0.15s ease; }
    .list-row:last-child { margin-bottom: 0; }
    .list-row:hover { border-color: var(--primary-light); box-shadow: 0 8px 20px -10px rgba(28,35,33,0.15); }
    .list-row-locked { opacity: 0.75; }
    .list-row-locked:hover { border-color: var(--border) !important; box-shadow: none !important; }
    .list-row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .list-row-title { font-weight: 700; font-size: 0.98rem; }
    .list-row-meta { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
    .badge-purple { background: #effaf9; color: var(--primary-dark); }
    .badge-gray { background: #f1efe9; color: var(--text-muted); }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .status-dropdown { position: relative; display: inline-block; }
    .status-select { padding: 6px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; color: var(--text); background: white; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    /* Full-width variant used when a status-style dropdown replaces a form <select> */
    .status-select-block { display: flex; width: 100%; justify-content: space-between; box-sizing: border-box; }
    .status-select:not(.status-select-locked):hover { border-color: var(--primary-light); }
    .status-select:focus { outline: none; border-color: var(--primary-light); }
    .status-select svg { color: var(--text-muted); }
    .status-dropdown-list { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 100%; background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: 0 8px 20px -8px rgba(28,35,33,0.18); padding: 4px; }
    .status-dropdown-list-up { top: auto; bottom: calc(100% + 6px); box-shadow: 0 -8px 20px -8px rgba(28,35,33,0.18); }
    .status-dropdown-item { padding: 7px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; color: var(--text); white-space: nowrap; cursor: pointer; }
    .status-dropdown-item:hover { background: var(--bg); }
    .status-dropdown-item.is-active { background: var(--primary); color: white; font-weight: 600; }
    .status-select-locked { cursor: default; color: var(--text-muted); background: var(--bg); border-color: var(--border); }
    .skill-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

    .empty-state { text-align: center; padding: 30px 18px; color: var(--text-muted); font-size: 0.88rem; }
    .gap-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .gap-bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 20px; overflow: hidden; }
    .gap-bar-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
    .gap-bar-label { font-size: 0.84rem; font-weight: 600; width: 130px; flex-shrink: 0; text-transform: capitalize; }
    .gap-bar-val { font-size: 0.78rem; color: var(--text-muted); width: 60px; text-align: right; flex-shrink: 0; }

    /* Gamification — XP toast, level ring, achievement grid. Reuses the
       same tokens/radii/shadows as the rest of the app (card, badge,
       progress-bar-fill) so nothing here introduces a new visual style. */
    .xp-toast-stack { position: fixed; top: 18px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    @media (max-width: 640px) { .xp-toast-stack { left: 12px; right: 12px; top: 12px; } }
    .xp-toast { display: flex; align-items: center; gap: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; box-shadow: 0 10px 30px -10px rgba(28,35,33,0.28); min-width: 240px; max-width: 340px; opacity: 0; transform: translateY(-10px) scale(0.98); transition: opacity 0.25s ease, transform 0.25s ease; }
    .xp-toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .xp-toast-icon { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; background: linear-gradient(135deg, var(--primary-dark), var(--primary-light)); box-shadow: 0 5px 12px rgba(15,118,110,.18); }
    .xp-toast-title { font-family: var(--font-display); font-weight: 700; font-size: 0.86rem; color: var(--text); }
    .xp-toast-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 1px; }

    .level-card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .level-ring { position: relative; width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .level-ring::before { content: ""; position: absolute; inset: 4px; background: var(--card-bg); border-radius: 50%; }
    .level-ring span { position: relative; font-family: var(--font-display); font-weight: 800; font-size: 0.92rem; color: var(--primary-dark); }
    .level-name { font-family: var(--font-display); font-weight: 700; font-size: 0.98rem; }
    .level-xp-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .achievement-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin-top: 14px; }
    .achievement-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); cursor: default; }
    .achievement-item.earned { background: #effaf9; border-color: #bfe8e2; }
    .achievement-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; background: var(--border); filter: grayscale(1); opacity: 0.55; }
    .achievement-item.earned .achievement-icon { background: linear-gradient(135deg, var(--primary-dark), var(--primary-light)); filter: none; opacity: 1; box-shadow: 0 4px 10px rgba(15,118,110,.2); }
    .achievement-label { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); line-height: 1.25; }
    .achievement-item.earned .achievement-label { color: var(--text); }

    /* Custom hover tooltip — replaces the native title attribute so locked
       achievements can tell the user exactly what to do next (with a live
       progress count), and earned ones confirm the XP they banked. */
    .achievement-tooltip { position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%) translateY(4px); width: 176px; background: #1c2321; color: #fff; padding: 10px 12px; border-radius: 9px; font-size: 0.74rem; font-weight: 500; line-height: 1.4; text-align: left; box-shadow: 0 10px 24px -8px rgba(0,0,0,.35); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease; z-index: 20; }
    .achievement-tooltip::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #1c2321; }
    .achievement-item:hover .achievement-tooltip, .achievement-item:focus-visible .achievement-tooltip, .achievement-item.tapped .achievement-tooltip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .achievement-tooltip-title { font-weight: 800; font-family: var(--font-display); font-size: 0.78rem; margin-bottom: 3px; color: #fff; }
    .achievement-tooltip-next { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.16); color: var(--primary-light); font-weight: 700; }

    /* Print Styles */
    @media print {
      body { background: white; padding: 0; }
      header, .no-print, .progress-container, .xp-toast-stack { display: none !important; }
      .card, .visual-cv { border: none !important; box-shadow: none !important; padding: 0 !important; }
      .visual-cv { width: 100%; }
    }
  </style>
