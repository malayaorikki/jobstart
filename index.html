                      }).join("")}
                    </div>
                  </div>
                `;
              })()}

              <div class="card">
                <div class="sidebar-section-title">Your Skill Profile</div>
                ${Object.entries(state.skills).map(([key, val]) => `
                  <div class="skill-row">
                    <span class="skill-name" style="text-transform: capitalize;">${SKILL_LABELS[key] || key}</span>
                    <div class="skill-dots">
                      ${[1,2,3,4,5].map(d => `<div class="dot ${d <= val ? 'active' : ''}"></div>`).join("")}
                    </div>
                  </div>
                `).join("")}
                <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border);" />
                <p style="font-size: 0.85rem; margin-bottom: 6px;">Overall Level: <span class="badge badge-blue">${getSkillLevel(Object.values(state.skills).reduce((a,b)=>a+b,0)/8)}</span></p>
                <p style="font-size: 0.85rem;">Top Strengths: <strong>${strengths.map(s => SKILL_LABELS[s] || s).join(", ")}</strong></p>
              </div>
            </div>

            <!-- MAIN: job matches + skill-gap courses -->
            <div class="profile-main">
              <!-- Your Applications — full history, including withdrawn attempts and any
                   reapplications, mirroring how the company sees your applicant record. -->
              ${(() => {
                const myApplications = myApps
                  .map(app => ({ job: JOBS.find(j => j.id === app.jobId), app }))
                  .filter(x => x.job)
                  .sort((a, b) => b.app.appliedAt - a.app.appliedAt);
                if (!myApplications.length) return "";
                return `
                  <div class="card">
                    <div class="jobs-list-header">
                      <h3 style="margin-bottom: 4px;">Your Applications</h3>
                      <span class="section-subtitle" style="margin-bottom:0;">${myApplications.length} application${myApplications.length === 1 ? "" : "s"} · newest first</span>
                    </div>
                    ${myApplications.map(({ job, app }) => {
                      const meta = STATUS_META[app.status];
                      const isWithdrawn = app.status === "withdrawn";
                      const showAcceptOffer = app.status === "hired" && !app.offerAccepted;
                      return `
                        <div class="list-row ${isWithdrawn ? "list-row-locked" : ""}" ${isWithdrawn ? `title="This application was withdrawn and can no longer be opened."` : `onclick="openJobModal(${job.id})" style="cursor:pointer;"`}>
                          <div class="list-row-top">
                            <div>
                              <div class="list-row-title">${job.title}</div>
                              <div class="list-row-meta">${job.company} &nbsp;·&nbsp; Applied ${new Date(app.appliedAt).toLocaleDateString()} at ${new Date(app.appliedAt).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}</div>
                            </div>
                            ${showAcceptOffer
                              ? `<button class="btn btn-sm" style="flex-shrink:0;" onclick="event.stopPropagation(); acceptOffer(${job.id})">Accept offer</button>`
                              : `<span class="badge ${meta.badge}">${getApplicantStatusLabel(app)}</span>`
                            }
                          </div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                `;
              })()}

              <div class="card" id="jobsMatchedSection">
                <div class="jobs-list-header">
                  <h3>Jobs matched to you</h3>
                  <span class="section-subtitle" style="margin-bottom:0;">${pathJobs.length} open role${pathJobs.length === 1 ? "" : "s"} in ${best.title}, ranked by fit</span>
                </div>
                ${pathJobs.length === 0 ? `
                  <div class="empty-state" style="text-align:center; padding: 28px 16px; color: var(--text-muted);">
                    <p style="font-weight:600; color: var(--text); margin-bottom: 6px;">No open jobs right now in ${best.title}.</p>
                    <p style="font-size:0.88rem;">We don't have current listings under this career path — check back soon, as new roles are added regularly.</p>
                  </div>
                ` : `
                <div class="job-cards-grid">
                  ${pathJobs.map(job => {
                    const matchPct = calcJobMatch(job);
                    // Read the applicant's real, current pipeline status for this job — not just
                    // a boolean "applied" flag — so the button/badge never gets stuck showing
                    // "Applied" after the employer has moved it along (or the person withdrew).
                    const myApp = getMyApplication(job.id);
                    const meta = myApp ? STATUS_META[myApp.status] : null;
                    let actionHtml;
                    if (!myApp || myApp.status === "withdrawn") {
                      actionHtml = "";
                    } else if (myApp.status === "hired" && !myApp.offerAccepted) {
                      // Candidate can confirm the offer right from the matches grid.
                      actionHtml = `<button class="btn btn-sm" style="flex:0 0 120px; height:30px; padding:0 10px; box-sizing:border-box; font-size:0.85rem; white-space:nowrap;" onclick="event.stopPropagation(); acceptOffer(${job.id})">Accept offer</button>`;
                    } else {
                      // Status-only badge — withdrawing an application happens from the
                      // job details modal (click into the card), not from this matches grid.
                      actionHtml = `<span class="badge ${meta.badge}" style="display:inline-flex; align-items:center; justify-content:center; text-align:center; flex:0 0 120px; height:30px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-sizing:border-box; font-size:0.85rem;">${getApplicantStatusLabel(myApp)}</span>`;
                    }
                    return `
                      <div class="match-card job-match-card" onclick="openJobModal(${job.id})">
                        <div class="match-card-eyebrow">${job.type} &middot; ${job.setup}</div>
                        <div class="match-card-top">
                          <div>
                            <div class="match-card-title">${job.title}</div>
                            <span class="company-link" onclick="event.stopPropagation(); openCompanyModal('${job.company.replace(/'/g, "\\'")}')">${job.company}</span>
                          </div>
                          <div class="match-ring" style="background: conic-gradient(var(--primary) 0% ${matchPct}%, #e6f6f4 ${matchPct}% 100%);"><span>${matchPct}%</span></div>
                        </div>
                        <div class="match-card-salary">${job.salary}</div>
                        ${job.reqSkills.map((r, i) => {
                          const required = r.level || 1;
                          const pct = required * 20;
                          const isLast = i === job.reqSkills.length - 1;
                          return `
                            <div class="match-skill-row" style="${isLast ? "margin-bottom:0;" : ""}">
                              <span class="match-skill-name">${SKILL_LABELS[r.skill] || r.skill}</span>
                              <div class="match-skill-track"><div class="match-skill-fill" style="width:${pct}%"></div></div>
                              <span class="match-skill-val">${pct}</span>
                            </div>
                          `;
                        }).join("")}
                        <div class="match-card-note" style="display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:30px;">
                          <span style="flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;">${job.location.split('/')[0].trim()}</span>
                          ${actionHtml || `<span class="preview-link" style="font-size:0.82rem; flex:0 0 auto; white-space:nowrap; display:inline-flex; align-items:center; height:30px;">View &amp; apply <span aria-hidden="true">→</span></span>`}
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
                `}
              </div>

              <!-- Courses to close skill gaps — driven by what the JOBS in this career
                   path actually require, not just the user's weakest skills overall.
                   Skills below a "credible" threshold (4/5) are framed as gaps to close;
                   skills already at/above that threshold are still shown, framed as
                   further improvement, so the section never comes up empty. -->
              ${(() => {
                const jobReqSkills = [...new Set(pathJobs.flatMap(j => j.reqSkills.map(r => r.skill)))];
                const bySkillLevelAsc = (a, b) => (state.skills[a] || 1) - (state.skills[b] || 1);
                const weakJobSkills = jobReqSkills.filter(s => (state.skills[s] || 1) < 4).sort(bySkillLevelAsc);
                const strongJobSkills = jobReqSkills.filter(s => (state.skills[s] || 1) >= 4).sort(bySkillLevelAsc);

                let title, headerHtml, targetSkills;

                if (pathJobs.length === 0) {
                  // No open jobs in this path to draw required skills from — fall back
                  // to the jobseeker's overall weakest skills so the section still helps.
                  title = "Close your skill gaps";
                  targetSkills = gaps;
                  headerHtml = `<p class="section-hint">No open jobs in ${best.title} to base this on yet, so here are courses for your lowest-scoring skills overall: <strong style="text-transform:capitalize;">${gaps.map(g => SKILL_LABELS[g] || g).join(", ")}</strong>.</p>`;
                } else if (weakJobSkills.length > 0) {
                  title = "Close your skill gaps";
                  targetSkills = [...weakJobSkills, ...strongJobSkills];
                  headerHtml = `<p class="section-hint">Courses from training providers on JobStart, matched to the skills jobs in ${best.title} require and where your score is still low: <strong style="text-transform:capitalize;">${weakJobSkills.map(g => SKILL_LABELS[g] || g).join(", ")}</strong>.</p>`;
                } else {
                  title = "Keep building your skills";
                  targetSkills = strongJobSkills;
                  headerHtml = `<p class="section-hint">You already meet the skill level jobs in ${best.title} look for. Try these to strengthen <strong style="text-transform:capitalize;">${strongJobSkills.map(g => SKILL_LABELS[g] || g).join(", ")}</strong> even further and stay competitive.</p>`;
                }

                const matches = COURSES.filter(c => !c.closed && targetSkills.includes(c.skill))
                  .sort((a, b) => targetSkills.indexOf(a.skill) - targetSkills.indexOf(b.skill));
                const bodyHtml = matches.length ? matches : COURSES.filter(c => !c.closed).slice(0, 3);

                const LEVEL_PCT = { "Beginner": 34, "Intermediate": 67, "Advanced": 100 };
                return `
              <div class="card">
                <h3 style="margin-bottom: 4px;">${title}</h3>
                ${headerHtml}
                <div class="courses-grid">
                  ${bodyHtml.map(c => {
                      const levelPct = LEVEL_PCT[c.level] || 50;
                      const enrolled = !!state.enrolledCourseIds[c.id];
                      return `
                      <div class="match-card course-match-card" onclick="openCourseModal('${c.id}')">
                        <div class="match-card-eyebrow">${c.level} &middot; ${c.duration}</div>
                        <div class="match-card-top">
                          <div>
                            <div class="match-card-title">${c.title}</div>
                            <span class="company-link course-provider-link">${c.provider}</span>
                          </div>
                          <div class="match-ring course-match-ring"><span>🎓</span></div>
                        </div>
                        <div class="match-card-salary">${c.price}</div>
                        <div class="match-skill-row" style="margin-bottom:0;">
                          <span class="match-skill-name">${SKILL_LABELS[c.skill] || c.skill}</span>
                          <div class="match-skill-track"><div class="match-skill-fill course-skill-fill" style="width:${levelPct}%"></div></div>
                          <span class="match-skill-val">${c.level[0]}</span>
                        </div>
                        <div class="match-card-note" style="display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:30px;">
                          <span style="flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;">${c.enrolled || 0} enrolled</span>
                          ${enrolled
                            ? `<span class="badge badge-green" style="display:inline-flex; align-items:center; justify-content:center; text-align:center; flex:0 0 120px; height:30px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-sizing:border-box; font-size:0.85rem;">Enrolled</span>`
                            : `<span class="preview-link" style="font-size:0.82rem; flex:0 0 auto; white-space:nowrap; display:inline-flex; align-items:center; height:30px;">View &amp; enroll <span aria-hidden="true">→</span></span>`
                          }
                        </div>
                      </div>
                    `;
                    }).join("")}
                </div>
              </div>
                `;
              })()}
            </div>
          </div>
        `;
      }

      // 4. VISUAL PRINTABLE RESUME VIEW
      else if (state.view === "visualResume") {
        ensureResumeDefaults();
        const r = state.resume;

        html = `
          <div class="no-print" style="margin-bottom: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
            <button class="btn btn-secondary" onclick="state.view='results'; render();">← Back to dashboard</button>
            <div style="display:flex; gap:10px;">
              <button class="btn btn-secondary" onclick="openResumeBuilder()">Edit</button>
              <button class="btn" onclick="window.print();">Print / save as PDF</button>
            </div>
          </div>

          <div class="card visual-cv">
            <div class="cv-header">
              <div class="cv-name">${r.name || "Your Name"}</div>
              <div style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;">
                ${[r.email, r.phone, r.location].filter(Boolean).join("  ·  ") || "Add your contact details"}
              </div>
            </div>

            <div class="cv-grid">
              <div>
                <h4 class="cv-section-title">Skills</h4>
                <div class="tag-list" style="margin-bottom:20px;">
                  ${r.skills.map(s => `<span class="tag-chip" style="cursor:default;">${s}</span>`).join("") || `<span style="font-size:0.85rem; color:var(--text-muted);">None added yet</span>`}
                </div>

                <h4 class="cv-section-title">Education</h4>
                <p style="font-size: 0.88rem; margin-bottom: 20px;">
                  ${(r.education.level || r.education.school || r.education.year)
                    ? [r.education.level, r.education.school, r.education.year].filter(Boolean).join(" — ")
                    : `<span style="color:var(--text-muted);">None added yet</span>`}
                </p>

                <h4 class="cv-section-title">Certifications</h4>
                ${r.certifications.length ? r.certifications.map(c => `
                  <div style="font-size:0.85rem; margin-bottom:10px;">
                    <div style="font-weight:600;">${c.name || "Certification"}</div>
                    <div style="color:var(--text-muted);">${[c.issuer, c.year].filter(Boolean).join(" · ")}</div>
                  </div>
                `).join("") : `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">None added yet</p>`}
              </div>

              <div>
                <h4 class="cv-section-title">Career Objective</h4>
                <p style="font-size: 0.9rem; margin-bottom: 20px;">${r.objective}</p>

                <h4 class="cv-section-title">Work Experience</h4>
                ${r.experience.length ? r.experience.map(e => `
                  <div style="font-size:0.88rem; margin-bottom:14px;">
                    <div style="font-weight:700;">${e.title || "Job Title"}</div>
                    <div style="color:var(--text-muted); margin-bottom:4px;">${[e.company, e.duration].filter(Boolean).join(" · ")}</div>
                    <div>${e.desc || ""}</div>
                  </div>
                `).join("") : `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">No work experience added yet — that's okay for fresh graduates.</p>`}

                <h4 class="cv-section-title">Projects</h4>
                ${r.projects.length ? r.projects.map(p => `
                  <div style="font-size:0.88rem; margin-bottom:12px;">
                    <div style="font-weight:700;">${p.title || "Project"}</div>
                    <div>${p.desc || ""}</div>
                  </div>
                `).join("") : `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">None added yet</p>`}
              </div>
            </div>
          </div>
        `;
      }

      // 5. RESUME BUILDER — every field editable before applying
      else if (state.view === "resumeBuilder") {
        ensureResumeDefaults();
        const r = state.resume;

        html = `
          <div class="no-print" style="margin-bottom: 16px;">
            <button class="btn btn-secondary" onclick="finishResumeBuilder('save')">← Back</button>
          </div>

          <div class="card">
            <h3 style="margin-bottom: 4px;">Build your resume</h3>
            <p class="section-hint">Everything here is editable. Update it any time — before applying, or later.</p>

            <h4 class="cv-section-title" style="margin-top:8px;">Name & Contact Information</h4>
            <form autocomplete="off" onsubmit="return false;">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Full name</label>
                  <input type="text" id="resumeName" name="resumeName_nofill" autocomplete="off" class="form-input" placeholder="Juan Dela Cruz" value="${r.name}" oninput="state.resume.name=this.value" onchange="state.resume.name=this.value">
                </div>
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" id="resumeEmail" name="resumeEmail_nofill" autocomplete="off" class="form-input" placeholder="juan.delacruz@email.com" value="${r.email}" oninput="state.resume.email=this.value" onchange="state.resume.email=this.value">
                </div>
                <div class="form-group">
                  <label class="form-label">Phone</label>
                  <input type="tel" id="resumePhone" name="resumePhone_nofill" autocomplete="off" class="form-input" placeholder="0917 123 4567" value="${r.phone}" oninput="state.resume.phone=this.value" onchange="state.resume.phone=this.value">
                </div>
                <div class="form-group">
                  <label class="form-label">Location</label>
                  <input type="text" id="resumeLocation" name="resumeLocation_nofill" autocomplete="off" class="form-input" placeholder="Taguig City, Philippines" value="${r.location}" oninput="state.resume.location=this.value" onchange="state.resume.location=this.value">
                </div>
              </div>
            </form>

            <h4 class="cv-section-title">Career Objective</h4>
            <div class="form-group">
              <textarea class="form-textarea" oninput="state.resume.objective=this.value">${r.objective}</textarea>
            </div>

            <h4 class="cv-section-title">Skills</h4>
            <div class="tag-list">
              ${r.skills.map((s, idx) => `<span class="tag-chip">${s}<button onclick="removeTag('skills', ${idx})" aria-label="Remove ${s}">×</button></span>`).join("") || ""}
            </div>
            <div class="tag-input-row" style="margin-bottom:20px;">
              <input type="text" id="newSkillInput" class="form-input" placeholder="Add a skill, e.g. Bookkeeping" onkeydown="if(event.key==='Enter'){event.preventDefault(); addTag('skills','newSkillInput');}">
              <button class="btn btn-secondary" onclick="addTag('skills','newSkillInput')">+ Add</button>
            </div>
          </div>

          <div class="card">
            <h4 class="cv-section-title" style="margin-top:0;">Education</h4>
            <p class="section-hint">Add your education background — this isn't pulled from your assessment, so fill it in yourself.</p>
            <div class="form-group">
              <label class="form-label">Education level / degree</label>
              <input type="text" class="form-input" placeholder="e.g. College Graduate — BS in Information Technology" value="${r.education.level}" oninput="state.resume.education.level=this.value">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">School</label>
                <input type="text" class="form-input" placeholder="e.g. XYZ University" value="${r.education.school}" oninput="state.resume.education.school=this.value">

              <div class="form-group">
                <label class="form-label">Year graduated</label>
                <input type="text" class="form-input" placeholder="e.g. 2025" value="${r.education.year}" oninput="state.resume.education.year=this.value">
              </div>
            </div>
          </div>

          <div class="card">
            <h4 class="cv-section-title" style="margin-top:0;">Work Experience</h4>
            <p class="section-hint">Add past jobs, internships, or on-the-job training. Fresh graduate? Feel free to leave this empty.</p>
            ${r.experience.map((e, idx) => `
              <div class="entry-card">
                <button class="entry-remove" onclick="removeExperience(${idx})" aria-label="Remove experience">×</button>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Job title</label>
                    <input type="text" class="form-input" placeholder="Customer Service Associate" value="${e.title}" oninput="state.resume.experience[${idx}].title=this.value">

                  <div class="form-group">

                    <input type="text" class="form-input" placeholder="ABC Company" value="${e.company}" oninput="state.resume.experience[${idx}].company=this.value">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Duration</label>
                  <input type="text" class="form-input" placeholder="Jun 2023 – Present" value="${e.duration}" oninput="state.resume.experience[${idx}].duration=this.value">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label">Description</label>
                  <textarea class="form-textarea" placeholder="What did you do and achieve in this role?" oninput="state.resume.experience[${idx}].desc=this.value">${e.desc}</textarea>
                </div>
              </div>
            `).join("")}
            <button class="add-entry-btn" onclick="addExperience()">+ Add work experience</button>
          </div>

          <div class="card">
            <h4 class="cv-section-title" style="margin-top:0;">Certifications</h4>
            <p class="section-hint">TESDA certificates, online courses, seminars — anything relevant.</p>
            ${r.certifications.map((c, idx) => `
              <div class="entry-card">
                <button class="entry-remove" onclick="removeCertification(${idx})" aria-label="Remove certification">×</button>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Certification name</label>
                    <input type="text" class="form-input" placeholder="TESDA NC II — Computer Systems Servicing" value="${c.name}" oninput="state.resume.certifications[${idx}].name=this.value">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Issuer</label>
                    <input type="text" class="form-input" placeholder="TESDA" value="${c.issuer}" oninput="state.resume.certifications[${idx}].issuer=this.value">
                  </div>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label">Year</label>
                  <input type="text" class="form-input" placeholder="2025" value="${c.year}" oninput="state.resume.certifications[${idx}].year=this.value">
                </div>
              </div>
            `).join("")}
            <button class="add-entry-btn" onclick="addCertification()">+ Add certification</button>
          </div>

          <div class="card">
            <h4 class="cv-section-title" style="margin-top:0;">Projects</h4>
            <p class="section-hint">School projects, freelance gigs, or personal work you're proud of.</p>
            ${r.projects.map((p, idx) => `
              <div class="entry-card">
                <button class="entry-remove" onclick="removeProject(${idx})" aria-label="Remove project">×</button>
                <div class="form-group">
                  <label class="form-label">Project title</label>
                  <input type="text" class="form-input" placeholder="School Enrollment System" value="${p.title}" oninput="state.resume.projects[${idx}].title=this.value">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label">Description</label>
                  <textarea class="form-textarea" placeholder="What was it, and what was your role?" oninput="state.resume.projects[${idx}].desc=this.value">${p.desc}</textarea>
                </div>
              </div>
            `).join("")}
            <button class="add-entry-btn" onclick="addProject()">+ Add project</button>

                  <h3>Providers on JobStart</h3>
                  <span class="section-subtitle" style="margin-bottom:0;">${names.length} provider${names.length === 1 ? "" : "s"}</span>
                </div>
                ${names.length ? names.map(name => {
                  const courses = COURSES.filter(c => c.provider === name);
                  const courseIds = courses.map(c => c.id);
                  const enrollCount = ENROLLMENTS.filter(e => courseIds.includes(e.courseId)).length;
                  const isPendingDelete = state.pendingDeleteProviderName === name;
                  return `
                    <div class="list-row">
                      <div class="list-row-top">
                        <div>
                          <div class="list-row-title">${name}</div>
                          <div class="list-row-meta">${courses.length} course${courses.length === 1 ? "" : "s"} &nbsp;·&nbsp; ${enrollCount} enrollment${enrollCount === 1 ? "" : "s"}</div>
                        </div>
                      </div>
                      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
                        ${courses.length ? `<button class="btn btn-secondary btn-sm" onclick="state.trainingCourseSearch='${name.replace(/'/g, "\\'")}'; state.view='trainingHome'; render();">View courses</button>` : ""}
                        <button class="btn btn-danger btn-sm" onclick="deleteProvider('${name.replace(/'/g, "\\'")}')">${isPendingDelete ? "Click again to confirm delete" : "Delete provider"}</button>
                      </div>
                    </div>
                  `;
                }).join("") : `<div class="empty-state">No providers yet. Offer a course to add one.</div>`}
              </div>
            </div>
          </div>
        `;
      }

      // 7c. TRAINING PROVIDERS PORTAL — skill gap insights
      else if (state.view === "trainingGaps") {
        const gaps = computeSkillGapReport();
        html = `
          ${renderTrainingHero()}

          <div class="profile-dashboard">
            <div class="profile-sidebar">
              ${renderTrainingNav("trainingGaps")}
            </div>
            <div class="profile-main">
              <div class="card">
                <h3 style="margin-bottom: 4px;">Skill gaps across jobseekers</h3>
                <p class="section-hint">Lower average score = bigger opportunity for a course that closes that gap.</p>
                ${gaps.map(g => `
                  <div class="gap-bar-row">
                    <span class="gap-bar-label">${SKILL_LABELS[g.key] || g.key}</span>
                    <div class="gap-bar-track"><div class="gap-bar-fill" style="width:${(g.avg/5)*100}%"></div></div>
                    <span class="gap-bar-val">${g.avg.toFixed(1)} / 5</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      }

      // 7c. TRAINING PROVIDERS PORTAL — offer a course
      else if (state.view === "trainingOfferCourse") {
        const d = state.courseDraft;
        const errs = state.courseDraftErrors || {};
        html = `
          ${renderTrainingHero()}

          <div class="profile-dashboard">
            <div class="profile-sidebar">
              ${renderTrainingNav("trainingOfferCourse")}
            </div>
            <div class="profile-main">
              <div class="card">
                <h3 style="margin-bottom: 4px;">${d.editId ? "Edit course" : "Offer a course or certification"}</h3>
                <p class="section-hint">${d.editId ? "Update the details below — changes apply immediately." : "This will show up as a recommendation to jobseekers whose assessment reveals this exact gap."}</p>

                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Provider / organization name *</label>
                    <input type="text" class="form-input ${errs.provider ? 'has-error' : ''}" placeholder="e.g. TESDA Online Program" value="${d.provider}" oninput="state.courseDraft.provider=this.value; if(state.courseDraftErrors) delete state.courseDraftErrors.provider;">
                    ${errs.provider ? `<div class="field-error">${errs.provider}</div>` : ""}
                  </div>
                  <div class="form-group">
                    <label class="form-label">Course title *</label>
                    <input type="text" class="form-input ${errs.title ? 'has-error' : ''}" placeholder="e.g. Excel for Business Fundamentals" value="${d.title}" oninput="state.courseDraft.title=this.value; if(state.courseDraftErrors) delete state.courseDraftErrors.title;">
                    ${errs.title ? `<div class="field-error">${errs.title}</div>` : ""}
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Duration</label>
                    <input type="text" class="form-input" placeholder="e.g. 4 weeks" value="${d.duration}" oninput="state.courseDraft.duration=this.value">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Price</label>
                    <input type="text" class="form-input ${errs.price ? 'has-error' : ''}" placeholder="e.g. 1500 or Free" value="${d.price}" oninput="state.courseDraft.price=this.value; if(state.courseDraftErrors) delete state.courseDraftErrors.price;">
                    ${errs.price ? `<div class="field-error">${errs.price}</div>` : `<div class="field-hint">Plain number only — we'll add the ₱. Use 0 or "Free" for no cost.</div>`}
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Skill gap this course closes</label>
                    ${renderFieldDropdown(
                      "courseSkill",
                      SKILL_LABELS[d.skill] || d.skill,
                      Object.entries(SKILL_LABELS),
                      "state.courseDraft.skill='%VALUE%'"
                    )}
                  </div>
                  <div class="form-group">
                    <label class="form-label">Level</label>
                    ${renderFieldDropdown(
                      "courseLevel",
                      d.level,
                      ["Beginner","Intermediate","Advanced"].map(t => [t, t]),
                      "state.courseDraft.level='%VALUE%'"
                    )}
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Short description</label>
                  <textarea class="form-textarea" placeholder="A couple of sentences on what learners will cover and what they'll walk away with." oninput="state.courseDraft.description=this.value">${d.description}</textarea>
                </div>

                <button class="btn training-btn" style="width:100%; margin-top:8px;" onclick="submitCourseOffer()">${d.editId ? "Save changes" : "Publish course"}</button>
                ${d.editId ? `
                  <div style="text-align:center; margin-top:14px;">
                    <span onclick="deleteCourse('${d.editId}')" style="font-size:0.8rem; font-weight:600; cursor:pointer; color:${state.pendingDeleteCourseId === d.editId ? "#c0392b" : "var(--text-muted)"}; text-decoration:underline; text-underline-offset:2px;">
                      ${state.pendingDeleteCourseId === d.editId ? "Click again to confirm delete" : "Delete this course"}
                    </span>
                  </div>
                ` : ""}
              </div>
            </div>
          </div>
        `;
      }

      // 7b. JOB DETAILS MODAL — jobseeker reviews a role before applying, or manages an existing application;
      // shows an employer-facing view instead when opened from the Companies portal.
      if (state.selectedJobModal) {
        const job = state.selectedJobModal;
        const isCompanyView = state.portal === "company";

        if (isCompanyView) {
          html += `
            <div class="modal-overlay" onclick="closeJobModal()">
              <div class="modal-content" onclick="event.stopPropagation()">
                <button class="close-btn" onclick="closeJobModal()" aria-label="Close">×</button>
                <h2 style="font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 6px; padding-right: 30px;">${job.title}</h2>
                <div style="font-size: 0.87rem; color: var(--text-muted);">${job.company}${job.closed ? ` &nbsp;·&nbsp; <span class="badge badge-red">Closed to applicants</span>` : ""}</div>

                <div class="detail-panel">
                  <div class="detail-row"><span class="detail-label">Location</span><span class="detail-value">${job.location}</span></div>
                  <div class="detail-row"><span class="detail-label">Salary</span><span class="detail-value">${job.salary}</span></div>
                  <div class="detail-row"><span class="detail-label">Career path</span><span class="detail-value">${(CAREER_PROFILES.find(p => p.id === job.careerPath) || {}).title || "—"}</span></div>
                  <div class="detail-row"><span class="detail-label">Employment type</span><span class="detail-value">${job.type}</span></div>
                  <div class="detail-row"><span class="detail-label">Work setup</span><span class="detail-value">${job.setup}</span></div>
                  <div class="detail-row"><span class="detail-label">Key skills</span><span style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">${job.reqSkills.map(r => `<span class="badge badge-blue">${SKILL_LABELS[r.skill] || r.skill} (Lv.${r.level})</span>`).join("")}</span></div>
                </div>
                ${job.description ? `<p style="font-size:0.89rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6;">${job.description}</p>` : ""}

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <button class="btn btn-secondary btn-sm" onclick="closeJobModal(); state.view='companyApplications'; viewApplicationsForJob(${job.id})">View applicants</button>
                  <button class="btn btn-secondary btn-sm" onclick="closeJobModal(); openPostJobForm(${job.id})">Edit job</button>
                  ${job.closed
                    ? `<button class="btn btn-secondary btn-sm" onclick="toggleJobClosed(${job.id})">Reopen job</button>`
                    : `<button class="btn btn-danger btn-sm" onclick="toggleJobClosed(${job.id})">Close application</button>`
                  }
                </div>
              </div>
            </div>
          `;
        } else {
        const matchPct = calcJobMatch(job);
        const myApp = getMyApplication(job.id);
        const meta = myApp ? STATUS_META[myApp.status] : null;
        const canWithdrawFromModal = myApp && WITHDRAWABLE_STATUSES.includes(myApp.status);
        let modalActionHtml;
        if (!myApp || myApp.status === "withdrawn") {
          if (!isApplyEnrollUnlocked()) {
            modalActionHtml = `
              <div style="width:100%; box-sizing:border-box; text-align:center; padding:13px 16px; border-radius:var(--radius-sm); background:var(--bg); border:1px solid var(--border); font-size:0.85rem; color:var(--text-muted);">
                🔒 Reach <strong>Level ${APPLY_ENROLL_UNLOCK_LEVEL} (${LEVEL_NAMES[APPLY_ENROLL_UNLOCK_LEVEL - 1]})</strong> to apply — ${xpNeededForApplyEnrollUnlock()} more XP to go. In the meantime, why not try <strong>building your resume</strong> instead?
              </div>
            `;
          } else {
            modalActionHtml = `<button class="btn" style="width:100%; box-sizing:border-box;" onclick="startApply(${job.id})">${myApp ? "Re-apply" : "Apply"} with my resume</button>`;
          }
        } else if (myApp.status === "hired" && !myApp.offerAccepted) {
          modalActionHtml = `
            <div style="text-align:center; padding:13px 16px; border-radius:var(--radius-sm); background:#effaf9; border:1px solid #cdece7; font-size:0.85rem; color:var(--primary-dark); margin-bottom:10px;">
              🎉 <strong>${job.company}</strong> wants to hire you for this role!
            </div>
            <button class="btn" style="width:100%; box-sizing:border-box;" onclick="acceptOffer(${job.id})">Accept offer</button>
          `;
        } else {
          modalActionHtml = `
            <span class="badge ${meta.badge}" style="display:block; text-align:center; width:100%; padding:13px 26px; box-sizing:border-box; font-size:0.95rem;">${getApplicantStatusLabel(myApp)}</span>
            ${canWithdrawFromModal ? `<button class="btn btn-secondary" style="width:100%; box-sizing:border-box; margin-top:10px;" onclick="withdrawApplication(${job.id}); closeJobModal();">Withdraw application</button>` : ""}
          `;
        }
        html += `
          <div class="modal-overlay" onclick="closeJobModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeJobModal()" aria-label="Close">×</button>
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding-right: 36px;">
                <div>
                  <h2 style="font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 6px;">${job.title}</h2>
                  <span class="company-link" onclick="closeJobModal(); openCompanyModal('${job.company.replace(/'/g, "\\'")}')" style="font-size: 0.92rem;">${job.company}</span>
                </div>
                <div class="match-ring" style="background: conic-gradient(var(--primary) 0% ${matchPct}%, #e6f6f4 ${matchPct}% 100%); flex-shrink:0;"><span>${matchPct}%</span></div>
              </div>

              <div class="detail-panel">
                <div class="detail-row"><span class="detail-label">Location</span><span class="detail-value">${job.location}</span></div>
                <div class="detail-row"><span class="detail-label">Salary</span><span class="detail-value">${job.salary}</span></div>
                <div class="detail-row"><span class="detail-label">Employment type</span><span class="detail-value">${job.type}</span></div>
                <div class="detail-row"><span class="detail-label">Work setup</span><span class="detail-value">${job.setup}</span></div>
                <div class="detail-row"><span class="detail-label">Key skills</span><span style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">${job.reqSkills.map(r => `<span class="badge badge-blue">${SKILL_LABELS[r.skill] || r.skill} (Lv.${r.level})</span>`).join("")}</span></div>
              </div>
              ${job.description ? `<p style="font-size:0.89rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6;">${job.description}</p>` : ""}

              ${modalActionHtml}
            </div>
          </div>
        `;
        }
      }

      // 7c. COURSE DETAILS MODAL — jobseeker reviews a course before enrolling, and can cancel anytime
      if (state.selectedCourseModal) {
        const c = state.selectedCourseModal;
        const isEnrolled = !!state.enrolledCourseIds[c.id];
        const isProviderView = state.portal === "training";
        html += `
          <div class="modal-overlay" onclick="closeCourseModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeCourseModal()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.25rem; color: var(--primary-dark); margin-bottom: 4px;">${c.title}</h2>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">${c.provider}${c.closed ? ` &nbsp;·&nbsp; <span class="badge badge-red">Not currently offered</span>` : ""}</div>

              <div style="background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 18px;">
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Skill focus</span><span class="badge badge-purple">${SKILL_LABELS[c.skill] || c.skill}</span></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Level</span><strong>${c.level}</strong></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Duration</span><strong>${c.duration}</strong></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Price</span><strong>${c.price}</strong></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Enrolled via JobStart</span><strong>${c.enrolled || 0}</strong></div>
              </div>
              ${c.description ? `<p style="font-size:0.88rem; color: var(--text); margin-bottom: 18px;">${c.description}</p>` : ""}

              ${isProviderView ? `
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <button class="btn btn-secondary btn-sm" onclick="closeCourseModal(); viewEnrolleesForCourse('${c.id}')">View enrollees</button>
                  <button class="btn btn-secondary btn-sm" onclick="closeCourseModal(); openOfferCourseForm('${c.id}')">Edit course</button>
                  ${c.closed
                    ? `<button class="btn btn-secondary btn-sm" onclick="toggleCourseClosed('${c.id}')">Reopen course</button>`
                    : `<button class="btn btn-danger btn-sm" onclick="toggleCourseClosed('${c.id}')">Close course</button>`
                  }
                </div>
              ` : isEnrolled
                  ? `<button class="btn btn-secondary" style="width:100%; box-sizing:border-box;" onclick="cancelEnrollment('${c.id}')">Cancel enrollment</button>`
                  : (!isApplyEnrollUnlocked()
                      ? `<div style="width:100%; box-sizing:border-box; text-align:center; padding:13px 16px; border-radius:var(--radius-sm); background:var(--bg); border:1px solid var(--border); font-size:0.85rem; color:var(--text-muted);">
                           🔒 Reach <strong>Level ${APPLY_ENROLL_UNLOCK_LEVEL} (${LEVEL_NAMES[APPLY_ENROLL_UNLOCK_LEVEL - 1]})</strong> to enroll — ${xpNeededForApplyEnrollUnlock()} more XP to go. In the meantime, why not try <strong>building your resume</strong> instead?
                         </div>`
                      : `<button class="btn" style="width:100%;" onclick="enrollInCourse('${c.id}')">Enroll in this course</button>`)
              }
            </div>
          </div>
        `;
      }

      // 8. COMPANY DETAILS MODAL OVERLAY
      if (state.selectedCompanyModal) {
        const comp = state.selectedCompanyModal;
        html += `
          <div class="modal-overlay" onclick="closeCompanyModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeCompanyModal()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.3rem; color: var(--primary-dark); margin-bottom: 4px;">${comp.name}</h2>
              <div style="font-size: 0.83rem; color: var(--text-muted); margin-bottom: 14px;">${comp.industry} &nbsp;·&nbsp; ${comp.size}</div>
              <p style="font-size: 0.93rem; margin-bottom: 18px; color: var(--text);">${comp.description}</p>

              <h4 style="font-size: 0.85rem; margin-bottom: 10px;">Standard employee benefits</h4>
              <ul style="margin-left: 20px; font-size: 0.88rem; margin-bottom: 22px; line-height: 1.7; color: var(--text);">
                ${comp.benefits.map(b => `<li>${b}</li>`).join("")}
              </ul>

              <div style="display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
                <span style="font-size: 0.74rem; color: var(--text-muted);">* Demo company profile overview</span>
                <a href="${comp.link}" target="_blank" class="btn" style="text-decoration:none;">Search openings ↗</a>
              </div>
            </div>
          </div>
        `;
      }

      // 9. APPLICATION REVIEW MODAL — review & edit resume before submitting
      if (state.applyReviewJob) {
        ensureResumeDefaults();
        const job = state.applyReviewJob;
        const r = state.resume;
        html += `
          <div class="modal-overlay" onclick="cancelApply()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="cancelApply()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.25rem; color: var(--primary-dark); margin-bottom: 4px;">Review your application</h2>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">${job.title} at <strong>${job.company}</strong></div>

              <div style="background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 16px;">
                <div style="font-weight:700; font-family: var(--font-display);">${r.name || "Your Name"}</div>
                <div style="font-size:0.83rem; color:var(--text-muted); margin-bottom:10px;">${[r.email, r.phone, r.location].filter(Boolean).join("  ·  ") || "Add your contact details"}</div>
                <p style="font-size:0.85rem; margin-bottom:10px;">${r.objective}</p>
                <div class="tag-list" style="margin-bottom:6px;">
                  ${r.skills.slice(0, 6).map(s => `<span class="tag-chip" style="cursor:default;">${s}</span>`).join("")}
                </div>
                <div style="font-size:0.8rem; color:var(--text-muted);">
                  ${r.experience.length} work experience entr${r.experience.length === 1 ? "y" : "ies"} · ${r.certifications.length} certification${r.certifications.length === 1 ? "" : "s"} · ${r.projects.length} project${r.projects.length === 1 ? "" : "s"}
                </div>
              </div>

              <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:18px;">You can edit your resume before submitting.</p>

              <div style="display:flex; justify-content: space-between; align-items:center; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="editResumeFromReview()">Edit resume</button>
                <button class="btn" onclick="confirmApply()">Submit application</button>
              </div>
            </div>
          </div>
        `;
      }

      // 10. OFFER ACCEPTED CELEBRATION MODAL — shown right after the candidate
      // confirms a "hired" offer, congratulating them and recapping the job.
      if (state.offerAcceptedModal) {
        const job = state.offerAcceptedModal;
        html += `
          <div class="modal-overlay" onclick="closeOfferAcceptedModal()">
            <div class="modal-content" onclick="event.stopPropagation()" style="text-align:center;">
              <button class="close-btn" onclick="closeOfferAcceptedModal()" aria-label="Close">×</button>
              <div style="font-size: 2.6rem; line-height:1; margin-bottom: 10px;">🎉</div>
              <div class="hero-eyebrow" style="justify-content:center; width:100%;">Congratulations</div>
              <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 8px;">You got the job!</h2>
              <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 22px;">
                You accepted the offer for <strong style="color:var(--text);">${job.title}</strong> at <strong style="color:var(--text);">${job.company}</strong>. Welcome aboard!
              </p>

              <div class="detail-panel" style="text-align:left;">
                <div class="detail-row"><span class="detail-label">Role</span><span class="detail-value">${job.title}</span></div>
                <div class="detail-row"><span class="detail-label">Company</span><span class="detail-value">${job.company}</span></div>
                <div class="detail-row"><span class="detail-label">Location</span><span class="detail-value">${job.location}</span></div>
                <div class="detail-row"><span class="detail-label">Salary</span><span class="detail-value">${job.salary}</span></div>
                <div class="detail-row"><span class="detail-label">Employment type</span><span class="detail-value">${job.type}</span></div>
                <div class="detail-row"><span class="detail-label">Work setup</span><span class="detail-value">${job.setup}</span></div>
              </div>

              <button class="btn" style="width:100%; box-sizing:border-box; margin-top:20px;" onclick="closeOfferAcceptedModal()">Let's go 🚀</button>
            </div>
          </div>
        `;
      }

      app.innerHTML = html;
    }

    // Live date/time shown in the header — runs on its own timer, independent
    // of render(), so it keeps ticking without re-rendering the whole app.
    function updateLiveClock() {
      const el = document.getElementById("liveClock");
      if (!el) return;
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      const timeStr = now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      el.innerHTML = `${dateStr} &nbsp;·&nbsp; <strong style="color: var(--text-muted); font-weight: 600;">${timeStr}</strong>`;
    }
    updateLiveClock();
    setInterval(updateLiveClock, 1000);

    document.addEventListener("click", () => {
      let changed = false;
      if (state.openStatusDropdown !== null && state.openStatusDropdown !== undefined) {
        state.openStatusDropdown = null;
        changed = true;
      }
      if (state.openFieldDropdown !== null && state.openFieldDropdown !== undefined) {
        state.openFieldDropdown = null;
        changed = true;
      }
      if (changed) render();

      document.querySelectorAll(".achievement-item.tapped").forEach(el => el.classList.remove("tapped"));
    });

    // Initialize App
    render();
  </script>
</body>
</html>
