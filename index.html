<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobStart | Find Your Career Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #0b5c55;
      --primary-light: #14b8a6;
      --accent: #fb7a57;
      --accent-dark: #ea5f3c;
      --bg: #faf8f5;
      --card-bg: #ffffff;
      --text: #1c2321;
      --text-muted: #6b7280;
      --border: #e7e2da;
      --success: #16a34a;
      --radius: 14px;
      --radius-sm: 9px;
      --font-display: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-font-smoothing: antialiased;
      /* Lock the type scale to what's authored below — without this, mobile
         browsers (Android Chrome especially) silently "boost" font sizes in
         narrow columns, which is exactly what makes a page look like a
         different, inconsistent scale from device to device. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body { font-family: var(--font-body); background-color: var(--bg); color: var(--text); line-height: 1.55; padding: 24px 16px 60px; }
    .container { max-width: 900px; margin: 0 auto; transition: max-width 0.2s ease; }
    /* Widen the canvas on larger screens so dashboard-style views (like the
       job seeker profile) have room for a real multi-column layout instead
       of one narrow mobile-width column stretched down the page. */
    @media (min-width: 1000px) { .container { max-width: 1000px; } }
    @media (min-width: 1240px) { .container.wide { max-width: 1200px; } }

    h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.01em; }

    a:focus-visible, button:focus-visible, .option-btn:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 2px;
    }

    /* Header & Navigation */
    header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; padding-top: 4px; }
    .logo { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; font-style: italic; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; letter-spacing: -0.02em; }
    .logo-text .accent-dot { color: var(--accent); }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; }

    /* Cards */
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 26px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(28,35,33,0.04), 0 8px 24px -12px rgba(28,35,33,0.08); margin-bottom: 20px; }

    /* Progress & XP Bar — "runway" motif */
    .progress-container { margin-bottom: 20px; }
    .progress-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .progress-bar-bg { position: relative; width: 100%; height: 10px; background: var(--border); border-radius: 20px; overflow: visible; }
    .progress-bar-fill { position: relative; height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); transition: width 0.35s ease; }
    .progress-bar-fill::after { content: "🚀"; position: absolute; right: -10px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15)); }
    .xp-badge { background: #fff1ea; color: var(--accent-dark); padding: 3px 10px; border-radius: 20px; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.01em; }

    /* Hero / Home View */
    .hero { text-align: center; padding: 48px 24px; }
    .hero-eyebrow { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); margin-bottom: 14px; }
    .hero h1 { font-size: 2.15rem; font-weight: 700; margin-bottom: 14px; line-height: 1.2; }
    .hero p { color: var(--text-muted); font-size: 1rem; max-width: 520px; margin: 0 auto 28px auto; }
    .hero-meta { display: flex; justify-content: center; gap: 20px; margin-top: 22px; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); }
    .hero-meta span { display: inline-flex; align-items: center; gap: 6px; }

    /* Homepage sections */
    .section-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
    .section-subtitle { font-size: 0.86rem; color: var(--text-muted); margin-bottom: 18px; }

    .stats-bar { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
    .stat-item { text-align: center; padding: 0 26px; }
    .stat-item + .stat-item { border-left: 1px solid var(--border); }
    .stat-number { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); line-height: 1.1; }
    .stat-label { font-size: 0.76rem; color: var(--text-muted); margin-top: 4px; }

    .steps-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 700px) { .steps-grid { grid-template-columns: repeat(3, 1fr); } }
    .step-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px; background: var(--card-bg); }
    .step-num { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; margin-bottom: 14px; }
    .step-title { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; margin-bottom: 6px; }
    .step-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.55; }

    .paths-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 700px) { .paths-grid { grid-template-columns: repeat(2, 1fr); } }
    .path-card { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; background: white; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; text-align: left; }
    .path-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px rgba(28,35,33,0.15); border-color: var(--primary-light); }
    .path-icon { width: 38px; height: 38px; border-radius: 10px; background: #effaf9; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; }
    .path-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 3px; }
    .path-salary { font-size: 0.8rem; color: var(--text-muted); }

    .companies-strip { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .company-pill { border: 1px solid var(--border); background: white; padding: 9px 18px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.15s ease; }
    .company-pill:hover { border-color: var(--primary-light); background: #f6fbfa; color: var(--primary-dark); }

    .btn { font-family: var(--font-body); background: var(--primary); color: white; border: none; padding: 13px 26px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #f1efe9; color: var(--text); }
    .btn-secondary:hover { background: #e7e2da; }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); padding: 11.5px 26px; }
    .btn-outline:hover { background: #effaf9; }

    /* Quiz Options */
    .q-category { text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
    .q-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; line-height: 1.35; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .option-btn { width: 100%; text-align: left; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: white; cursor: pointer; transition: all 0.15s ease; font-family: var(--font-body); font-size: 0.94rem; font-weight: 500; color: var(--text); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .option-btn:hover { border-color: var(--primary-light); background: #f6fbfa; }
    .option-btn.selected { border-color: var(--primary); background: #effaf9; box-shadow: inset 0 0 0 1px var(--primary); }
    .option-letter { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
    .option-btn.selected .option-letter { background: var(--primary); color: white; }
    .option-btn:hover .option-letter { background: var(--primary-light); color: white; }
    .option-txt { flex: 1; }
    .option-arrow { color: var(--text-muted); flex-shrink: 0; }

    .quiz-footer { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .quiz-hint { font-size: 0.82rem; color: var(--text-muted); }

    /* Results Dashboard Grid */
    .results-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .results-grid { grid-template-columns: 1fr 1fr; } }

    .hero-result { background: linear-gradient(135deg, var(--primary-dark), var(--primary) 60%, var(--primary-light)); color: white; }

    /* Job Seeker Profile — desktop dashboard layout.
       Sidebar (identity + skills + preferences + resume actions) stays put
       on the left; the main column (job matches + skill-gap courses) scrolls
       independently on the right so nothing has to be hunted for. */
    .profile-dashboard { display: grid; grid-template-columns: 1fr; gap: 22px; align-items: start; }
    @media (min-width: 1000px) { .profile-dashboard { grid-template-columns: 320px 1fr; gap: 24px; } }
    .profile-sidebar { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    @media (min-width: 1000px) { .profile-sidebar { position: sticky; top: 24px; } }
    .profile-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    .profile-id-card { display: flex; align-items: center; gap: 14px; }
    .profile-avatar { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; flex-shrink: 0; }
    .profile-id-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
    .profile-id-role { font-size: 0.82rem; opacity: 0.9; }

    .sidebar-section-title { font-family: var(--font-display); font-size: 0.98rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .pref-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .pref-chip { display: inline-flex; align-items: center; gap: 6px; background: #f6fbfa; border: 1px solid var(--border); color: var(--text); padding: 6px 11px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .pref-chip .pref-chip-label { color: var(--text-muted); font-weight: 500; }

    .quick-stats-row { display: flex; gap: 14px; flex-wrap: wrap; }
    .quick-stat { flex: 1; min-width: 130px; background: rgba(255,255,255,0.14); border-radius: var(--radius-sm); padding: 12px 14px; }
    .quick-stat-num { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
    .quick-stat-label { font-size: 0.74rem; opacity: 0.9; margin-top: 2px; }

    .jobs-list-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .jobs-list-header h3 { margin-bottom: 0; }
    .job-cards-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 1400px) { .job-cards-grid { grid-template-columns: 1fr 1fr; } }
    .courses-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 1400px) { .courses-grid { grid-template-columns: 1fr 1fr 1fr; } }
    .courses-grid .list-row { margin-bottom: 0; }
    .job-cards-grid .job-card { margin-bottom: 0; }

    /* Skill Meter */
    .skill-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
    .skill-name { font-size: 0.88rem; font-weight: 600; }
    .skill-dots { display: flex; gap: 5px; flex-shrink: 0; }
    .dot { width: 20px; height: 7px; border-radius: 4px; background: var(--border); }
    .dot.active { background: var(--primary); }

    /* Badges & Tags */
    .badge { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 0.74rem; font-weight: 700; }
    .badge-blue { background: #e6f6f4; color: var(--primary-dark); }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #fff1ea; color: var(--accent-dark); }

    /* Job Listings */
    .job-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; background: white; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .job-card:last-child { margin-bottom: 0; }
    .job-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px rgba(28,35,33,0.15); border-color: var(--primary-light); }
    .job-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .job-title { font-weight: 700; font-size: 1rem; }
    .company-link { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; font-size: 0.92rem; }
    .company-link:hover { text-decoration: underline; }

    /* Modal */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(28,35,33,0.55); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(2px); }
    .modal-content { background: white; border-radius: var(--radius); max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; position: relative; }
    .close-btn { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: none; background: #f1efe9; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: #e7e2da; }

    /* Visual Resume Styling (Screen & Print) */
    .visual-cv { background: white; border: 1px solid var(--border); padding: 36px; border-radius: var(--radius); color: var(--text); }
    .cv-header { border-bottom: 2px solid var(--primary); padding-bottom: 18px; margin-bottom: 22px; }
    .cv-name { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--primary-dark); letter-spacing: 0.02em; }
    .cv-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 28px; }
    @media (max-width: 600px) { .cv-grid { grid-template-columns: 1fr; } }
    .cv-section-title { font-family: var(--font-display); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary-dark); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 14px; }

    /* Resume Builder Form */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-input, .form-textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 1rem; color: var(--text); background: white;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
    .form-textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .section-hint { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; margin-top: -4px; }

    .entry-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px; background: var(--bg); position: relative; }
    .entry-remove { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
    .entry-remove:hover { background: #fee2e2; color: #dc2626; }
    .add-entry-btn { width: 100%; padding: 11px; border: 1.5px dashed var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--primary); font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: all 0.15s ease; font-family: var(--font-body); }
    .add-entry-btn:hover { background: #effaf9; border-color: var(--primary-light); }

    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tag-chip { display: inline-flex; align-items: center; gap: 6px; background: #effaf9; color: var(--primary-dark); padding: 5px 10px 5px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; }
    .tag-chip button { background: none; border: none; color: var(--primary-dark); cursor: pointer; font-size: 0.9rem; line-height: 1; opacity: 0.6; padding: 0; }
    .tag-chip button:hover { opacity: 1; }
    .tag-input-row { display: flex; gap: 8px; }
    .tag-input-row .form-input { flex: 1; }

    /* Portal Chooser */
    .portal-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    @media (min-width: 700px) { .portal-grid { grid-template-columns: repeat(3, 1fr); } }
    .portal-card { text-align: left; border: 1.5px solid var(--border); border-radius: var(--radius); padding: 24px 22px; background: white; cursor: pointer; transition: all 0.15s ease; display: flex; flex-direction: column; gap: 12px; }
    .portal-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px -12px rgba(28,35,33,0.18); border-color: var(--primary-light); }
    .portal-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .portal-card.seeker .portal-icon { background: #effaf9; }
    .portal-card.company .portal-icon { background: #fff1ea; }
    .portal-card.training .portal-icon { background: #eef2ff; }
    .portal-title { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; }
    .portal-desc { font-size: 0.85rem; color: var(--text-muted); }
    .portal-steps { list-style: none; font-size: 0.82rem; color: var(--text); display: flex; flex-direction: column; gap: 5px; margin: 2px 0 4px; }
    .portal-steps li { display: flex; align-items: flex-start; gap: 7px; }
    .portal-steps li::before { content: "→"; color: var(--primary); font-weight: 700; flex-shrink: 0; }
    .portal-card .btn { align-self: flex-start; margin-top: auto; }
    .portal-steps { margin-bottom: 0; }

    /* Dashboard sub-nav (used inside Company / Training portals) */
    .dash-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .dash-eyebrow { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--primary); }
    .dash-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
    .dash-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .dash-tab { padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--border); background: white; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; font-family: var(--font-body); transition: all 0.15s ease; }
    .dash-tab:hover { border-color: var(--primary-light); color: var(--text); }
    .dash-tab.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* Company Portal — sidebar nav, kept identical in shape to the job-seeker
       profile-sidebar so the whole app feels like one consistent product.
       Every company sub-view (job posts, applications, candidate search,
       post-a-job) renders inside this same shell, so switching between them
       is one click from an always-visible menu instead of a "← Back" chain. */
    .company-hero { background: linear-gradient(135deg, var(--accent-dark), var(--accent) 65%, #ffb199); color: white; }
    .company-nav { display: flex; flex-direction: column; gap: 6px; }
    .company-nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid transparent;
      background: transparent; color: var(--text); font-family: var(--font-body);
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .company-nav-btn .nav-icon { font-size: 1rem; flex-shrink: 0; }
    .company-nav-btn .nav-count { margin-left: auto; font-size: 0.74rem; font-weight: 700; color: var(--text-muted); background: var(--bg); border-radius: 20px; padding: 2px 9px; }
    .company-nav-btn:hover { background: #fff4ef; color: var(--accent-dark); }
    .company-nav-btn.active { background: #fff1ea; border-color: var(--accent); color: var(--accent-dark); }
    .company-nav-btn.active .nav-count { background: white; color: var(--accent-dark); }
    .company-nav-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .company-btn { background: var(--accent); }
    .company-btn:hover { background: var(--accent-dark); }
    .company-btn-outline { border-color: var(--accent); color: var(--accent-dark); }
    .company-btn-outline:hover { background: #fff4ef; }

    /* Training Providers Portal — same sidebar-nav shell as the company
       portal, in its own indigo accent so it's visually distinct at a glance
       while still feeling like one consistent app. */
    .training-hero { background: linear-gradient(135deg, #3730a3, #4338ca 60%, #6366f1); color: white; }
    .training-nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid transparent;
      background: transparent; color: var(--text); font-family: var(--font-body);
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .training-nav-btn .nav-icon { font-size: 1rem; flex-shrink: 0; }
    .training-nav-btn .nav-count { margin-left: auto; font-size: 0.74rem; font-weight: 700; color: var(--text-muted); background: var(--bg); border-radius: 20px; padding: 2px 9px; }
    .training-nav-btn:hover { background: #eef2ff; color: #4338ca; }
    .training-nav-btn.active { background: #eef2ff; border-color: #4338ca; color: #4338ca; }
    .training-nav-btn.active .nav-count { background: white; color: #4338ca; }
    .training-btn { background: #4338ca; }
    .training-btn:hover { background: #3730a3; }

    /* Generic list rows (candidates, applications, courses) */
    .list-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; background: white; transition: all 0.15s ease; }
    .list-row:last-child { margin-bottom: 0; }
    .list-row:hover { border-color: var(--primary-light); box-shadow: 0 8px 20px -10px rgba(28,35,33,0.15); }
    .list-row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .list-row-title { font-weight: 700; font-size: 0.98rem; }
    .list-row-meta { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
    .badge-purple { background: #eef2ff; color: #4338ca; }
    .badge-gray { background: #f1efe9; color: var(--text-muted); }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .status-select { padding: 8px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 1rem; font-weight: 600; color: var(--text); background: white; cursor: pointer; }
    .status-select:focus { outline: none; border-color: var(--primary-light); }
    .skill-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

    .empty-state { text-align: center; padding: 30px 18px; color: var(--text-muted); font-size: 0.88rem; }
    .gap-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .gap-bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 20px; overflow: hidden; }
    .gap-bar-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
    .gap-bar-label { font-size: 0.84rem; font-weight: 600; width: 130px; flex-shrink: 0; text-transform: capitalize; }
    .gap-bar-val { font-size: 0.78rem; color: var(--text-muted); width: 60px; text-align: right; flex-shrink: 0; }

    /* Print Styles */
    @media print {
      body { background: white; padding: 0; }
      header, .no-print, .progress-container { display: none !important; }
      .card, .visual-cv { border: none !important; box-shadow: none !important; padding: 0 !important; }
      .visual-cv { width: 100%; }
    }
  </style>

      { id: "c1", name: "Mika Santos", bestFitTitle: "BPO & Customer Experience Specialist",
        skills: { ...EMPTY_SKILLS, communication: 5, customerService: 5, tech: 2 },
        preferences: { setup: "Hybrid", relocate: "Regional", salary: "₱18k-₱25k", edu: "College Degree" } },
      { id: "c2", name: "Carlo Reyes", bestFitTitle: "IT Support & Junior Web Developer",
        skills: { ...EMPTY_SKILLS, tech: 5, numeracy: 4, creative: 2 },
        preferences: { setup: "Remote", relocate: "Anywhere", salary: "₱25k-₱35k", edu: "TESDA/Vocational" } },
      { id: "c3", name: "Angel Cruz", bestFitTitle: "Digital Media & Creative Design Associate",
        skills: { ...EMPTY_SKILLS, creative: 5, communication: 3, tech: 2 },
        preferences: { setup: "Remote", relocate: "Local", salary: "₱18k-₱25k", edu: "College Degree" } },
      { id: "c4", name: "Paolo Villanueva", bestFitTitle: "Sales & Business Development Representative",
        skills: { ...EMPTY_SKILLS, sales: 5, communication: 4, leadership: 3 },
        preferences: { setup: "Onsite", relocate: "Anywhere", salary: "₱25k-₱35k", edu: "College Degree" } },
      { id: "c5", name: "Jhoanna Dizon", bestFitTitle: "Administrative & Virtual Operations Assistant",
        skills: { ...EMPTY_SKILLS, numeracy: 5, tech: 3, communication: 3 },
        preferences: { setup: "Hybrid", relocate: "Regional", salary: "₱18k-₱25k", edu: "Undergraduate" } }
    ];

    /* Mock courses offered by training providers — seeded, plus whatever new
       providers add through the Training Providers portal. */
    let COURSES = [
      { id: "tc1", provider: "TESDA Online Program", title: "Spoken English & Call Handling Essentials", skill: "communication", level: "Beginner", duration: "4 weeks", price: "Free", enrolled: 0 },
      { id: "tc2", provider: "Google IT Support (Coursera)", title: "IT Support Professional Certificate", skill: "tech", level: "Beginner", duration: "3 months", price: "₱2,500", enrolled: 0 },
      { id: "tc3", provider: "Canva Design School", title: "Social Media Graphic Design Fundamentals", skill: "creative", level: "Beginner", duration: "2 weeks", price: "Free", enrolled: 0 },
      { id: "tc4", provider: "SalesEdge PH", title: "Consultative Selling & Objection Handling", skill: "sales", level: "Intermediate", duration: "3 weeks", price: "₱1,800", enrolled: 0 },
      { id: "tc5", provider: "TESDA Online Program", title: "Bookkeeping & Excel for Business", skill: "numeracy", level: "Beginner", duration: "5 weeks", price: "Free", enrolled: 0 },
      { id: "tc6", provider: "Leaders in Training PH", title: "First-Time Team Lead Bootcamp", skill: "leadership", level: "Intermediate", duration: "6 weeks", price: "₱3,200", enrolled: 0 }
    ];

    /* Applications a company receives are pushed here when a jobseeker applies. */
    let APPLICATIONS = [];

    /* Application status pipeline — single source of truth for labels, badge colors,
       and ordering. "applied" is the default status the moment someone applies;
       every other status is set explicitly by the employer (or, for "withdrawn",
       by the applicant). Keeping this as one map means the status shown to the
       applicant and the status shown to the employer can never drift apart. */
    const APPLICATION_STATUSES = ["applied", "under_review", "shortlisted", "interview", "hired", "rejected", "withdrawn"];
    const STATUS_META = {
      applied:      { label: "Applied",         badge: "badge-gray"   },
      under_review: { label: "Under Review",    badge: "badge-blue"   },
      shortlisted:  { label: "Shortlisted",     badge: "badge-purple" },
      interview:    { label: "Interview",       badge: "badge-amber"  },
      hired:        { label: "Hired/Accepted",  badge: "badge-green"  },
      rejected:     { label: "Rejected",        badge: "badge-red"    },
      withdrawn:    { label: "Withdrawn",       badge: "badge-gray"   }
    };
    // Statuses an applicant can still withdraw from — once hired/rejected/withdrawn, it's final.
    const WITHDRAWABLE_STATUSES = ["applied", "under_review", "shortlisted", "interview"];

    function getMyApplication(jobId) {
      return APPLICATIONS.find(a => a.jobId === jobId && a.candidateId === "me") || null;
    }

    /* Course enrollments, pushed when a jobseeker enrolls from their results page. */
    let ENROLLMENTS = [];

    /* ==========================================================================
       APPLICATION STATE MANAGEMENT
       ========================================================================== */

    let state = {
      portal: null, // null | "seeker" | "company" | "training"
      view: "portal", // portal | home | quiz | results | resumeBuilder | visualResume | companyHome | companyPostJob | companyCandidates | companyApplications | trainingHome | trainingGaps | trainingOfferCourse
      currentQ: 0,
      xp: 0,
      answers: {},
      skills: {
        communication: 1,
        tech: 1,
        customerService: 1,
        sales: 1,
        trade: 1,
        creative: 1,
        leadership: 1,
        numeracy: 1
      },
      preferences: {
        setup: "Open",
        relocate: "Regional",
        salary: "₱18k-₱25k",
        shift: "Day",
        edu: "College Degree"
      },
      appliedJobs: {},
      selectedCompanyModal: null,
      selectedCourseModal: null, // course currently open in the course-details modal
      resume: null,           // built lazily via ensureResumeDefaults()
      applyReviewJob: null,   // job currently being reviewed for application
      pendingApplyJobId: null, // job id waiting on a resume edit before submitting

      // --- Companies portal ---
      jobDraft: { company: "", title: "", location: "", salary: "", type: "Full-time", reqSkill: "communication", setup: "Onsite" },
      candidateQuery: "",
      selectedCandidate: null,
      selectedApplicationsJobId: null,

      // --- Training Providers portal ---
      courseDraft: { provider: "", title: "", skill: "communication", level: "Beginner", duration: "", price: "" },

      // --- Cross-portal tracking ---
      enrolledCourseIds: {}
    };

    /* ==========================================================================
       CORE CALCULATIONS & UTILITIES
       ========================================================================== */

    function answerQuestion(optIndex) {
      const q = QUESTIONS[state.currentQ];
      const opt = q.opts[optIndex];

      state.answers[state.currentQ] = optIndex;
      state.xp += 10;

      // Apply Skill Scores
      if (opt.scores) {
        for (let sk in opt.scores) {
          state.skills[sk] = Math.min(5, state.skills[sk] + opt.scores[sk]);
        }
      }

      // Apply Preferences
      if (opt.pref) {
        state.preferences = { ...state.preferences, ...opt.pref };
      }

      if (state.currentQ < QUESTIONS.length - 1) {
        state.currentQ++;
      }
      render();
    }

    // Called from the "Submit Quiz" button that appears once the final
    // question has been answered — takes the user to their results/profile.
    function submitQuiz() {
      state.view = "results";
      upsertMyCandidateProfile();
      render();
    }

    // Publishes/refreshes "your" profile into the shared candidate pool so the
    // Companies portal can discover and search for you, just like a real candidate.
    function upsertMyCandidateProfile() {
      const best = calculateTopFit();
      const mine = {
        id: "me",
        name: (state.resume && state.resume.name) ? state.resume.name : "You (just completed the assessment)",
        bestFitTitle: best.title,
        skills: { ...state.skills },
        preferences: { ...state.preferences }
      };
      const idx = CANDIDATE_POOL.findIndex(c => c.id === "me");
      if (idx >= 0) CANDIDATE_POOL[idx] = mine; else CANDIDATE_POOL.push(mine);
    }

    function prevQuestion() {
      if (state.currentQ > 0) {
        state.currentQ--;
        render();
      }
    }

    function resetApp() {
      // Clean up records tied to "you" from the shared cross-portal pools
      CANDIDATE_POOL = CANDIDATE_POOL.filter(c => c.id !== "me");
      APPLICATIONS = APPLICATIONS.filter(a => a.candidateId !== "me");

      state = {
        portal: null,
        view: "portal",
        currentQ: 0,
        xp: 0,
        answers: {},
        skills: { communication: 1, tech: 1, customerService: 1, sales: 1, trade: 1, creative: 1, leadership: 1, numeracy: 1 },
        preferences: { setup: "Open", relocate: "Regional", salary: "₱18k-₱25k", shift: "Day", edu: "College Degree" },
        appliedJobs: {},
        selectedCompanyModal: null,
        selectedCourseModal: null,
        resume: null,
        applyReviewJob: null,
        pendingApplyJobId: null,
        jobDraft: { company: "", title: "", location: "", salary: "", type: "Full-time", reqSkill: "communication", setup: "Onsite" },
        candidateQuery: "",
        selectedCandidate: null,
        selectedApplicationsJobId: null,
        courseDraft: { provider: "", title: "", skill: "communication", level: "Beginner", duration: "", price: "" },
        enrolledCourseIds: {}
      };
      render();
    }

    /* ==========================================================================
       PORTAL NAVIGATION — Job Seekers / Companies / Training Providers
       ========================================================================== */

    function goPortalChooser() {
      state.portal = null;
      state.view = "portal";
      render();
    }

    function goToPortal(portal) {
      state.portal = portal;
      if (portal === "seeker") {
        // If this user has already completed the quiz, take them straight back
        // to their profile/results page instead of the job-seeker landing page.
        const hasProfile = CANDIDATE_POOL.some(c => c.id === "me");
        state.view = hasProfile ? "results" : "home";
      }
      else if (portal === "company") state.view = "companyHome";
      else if (portal === "training") state.view = "trainingHome";
      render();
    }

    function calculateTopFit() {
      let bestProfile = CAREER_PROFILES[0];
      let highestScore = 0;

      CAREER_PROFILES.forEach(prof => {
        let score = 0;
        for (let sk in prof.weights) {
          score += (state.skills[sk] || 1) * prof.weights[sk];
        }
        if (score > highestScore) {
          highestScore = score;
          bestProfile = prof;
        }
      });

      return bestProfile;
    }

    function getTopCareerMatches(n) {
      return CAREER_PROFILES.map(prof => {
        let score = 0;
        for (let sk in prof.weights) {
          score += (state.skills[sk] || 1) * prof.weights[sk];
        }
        return { profile: prof, score };
      }).sort((a, b) => b.score - a.score).slice(0, n).map(item => item.profile);
    }

    function getSkillLevel(score) {
      if (score >= 4.5) return "Expert / Mastery";
      if (score >= 3.5) return "Intermediate-Advanced";
      if (score >= 2.5) return "Intermediate";
      if (score >= 1.5) return "Beginner-Intermediate";
      return "Baguhan / Novice";
    }

    function getStrengthsAndGaps() {
      const sorted = Object.entries(state.skills).sort((a,b) => b[1] - a[1]);
      const strengths = sorted.slice(0, 3).map(item => item[0]);
      const gaps = sorted.slice(-2).map(item => item[0]);
      return { strengths, gaps };
    }

    function calcJobMatch(job) {
      const reqVal = state.skills[job.reqSkill] || 1;
      let match = Math.round((reqVal / 5) * 100);
      if (job.setup === state.preferences.setup) match += 10;
      return Math.min(98, Math.max(55, match));
    }

    // Withdraw an in-progress application. Only allowed while the application
    // is still in a withdrawable state (not already hired/rejected/withdrawn).
    function withdrawApplication(jobId) {
      const app = getMyApplication(jobId);
      if (app && WITHDRAWABLE_STATUSES.includes(app.status)) {
        app.status = "withdrawn";
      }
      state.appliedJobs[jobId] = false;
      render();
    }

    function openCompanyModal(companyName) {
      state.selectedCompanyModal = COMPANIES[companyName] ? { name: companyName, ...COMPANIES[companyName] } : null;
      render();
    }

    function closeCompanyModal() {
      state.selectedCompanyModal = null;
      render();
    }

    function copyTextResume() {
      ensureResumeDefaults();
      const r = state.resume;
      const expText = r.experience.length
        ? r.experience.map(e => `- ${e.title || "Role"} at ${e.company || "Company"} (${e.duration || "Dates"})\n  ${e.desc || ""}`).join("\n")
        : "- None added yet";
      const certText = r.certifications.length
        ? r.certifications.map(c => `- ${c.name || "Certification"} — ${c.issuer || "Issuer"} (${c.year || "Year"})`).join("\n")
        : "- None added yet";
      const projText = r.projects.length
        ? r.projects.map(p => `- ${p.title || "Project"}: ${p.desc || ""}`).join("\n")
        : "- None added yet";

      const text = `================================================
JOBSTART CAREER PROFILE RESUME
================================================
${r.name || "Your Name"}
${[r.email, r.phone, r.location].filter(Boolean).join(" | ")}

CAREER OBJECTIVE
${r.objective}

SKILLS
${r.skills.join(", ")}

EDUCATION
${r.education}

WORK EXPERIENCE
${expText}

CERTIFICATIONS
${certText}

PROJECTS
${projText}

RECOMMENDED JOB ROLES
${r.recommendedRoles.join(", ")}

STRENGTHS IDENTIFIED BY ASSESSMENT
${r.strengths.join(", ")}
================================================`;

      navigator.clipboard.writeText(text);
      alert("Plain-text resume copied to clipboard!");
    }

    /* ==========================================================================
       RESUME BUILDER — defaults, editing helpers, and the apply-with-review flow
       ========================================================================== */

    function buildDefaultResume() {
      const best = calculateTopFit();
      const { strengths } = getStrengthsAndGaps();
      const topSkills = Object.entries(state.skills)
        .filter(([, val]) => val >= 3)
        .sort((a, b) => b[1] - a[1])
        .map(([key]) => key.charAt(0).toUpperCase() + key.slice(1));
      const roles = getTopCareerMatches(3).map(p => p.title);

      return {
        name: "",
        email: "",
        phone: "",
        location: "",
        objective: `Entry-level jobseeker pursuing a career in ${best.title}, bringing strengths in ${strengths.join(", ")}. Seeking a ${state.preferences.setup.toLowerCase()} role around ${state.preferences.salary} where I can grow professionally.`,
        skills: topSkills.length ? topSkills : ["Communication"],
        education: state.preferences.edu,
        experience: [],
        certifications: [],
        projects: [],
        recommendedRoles: roles,
        strengths: strengths.map(s => s.charAt(0).toUpperCase() + s.slice(1))
      };
    }

    function ensureResumeDefaults() {
      if (!state.resume) state.resume = buildDefaultResume();
    }

    function openResumeBuilder() {
      ensureResumeDefaults();
      state.view = "resumeBuilder";
      render();
    }

    // Generic tag helpers (skills, recommendedRoles, strengths)
    function addTag(field, inputId) {
      const input = document.getElementById(inputId);
      const val = input.value.trim();
      if (!val) return;
      state.resume[field].push(val);
      input.value = "";
      render();
    }

    function removeTag(field, idx) {
      state.resume[field].splice(idx, 1);
      render();
    }

    // Work experience
    function addExperience() {
      state.resume.experience.push({ title: "", company: "", duration: "", desc: "" });
      render();
    }
    function removeExperience(idx) {
      state.resume.experience.splice(idx, 1);
      render();
    }

    // Certifications
    function addCertification() {
      state.resume.certifications.push({ name: "", issuer: "", year: "" });
      render();
    }
    function removeCertification(idx) {
      state.resume.certifications.splice(idx, 1);
      render();
    }

    // Projects
    function addProject() {
      state.resume.projects.push({ title: "", desc: "" });
      render();
    }
    function removeProject(idx) {
      state.resume.projects.splice(idx, 1);
      render();
    }

    function finishResumeBuilder(target) {
      if (target === "preview") {
        state.view = "visualResume";
        render();
        return;
      }
      // "save" — return to where the person came from
      upsertMyCandidateProfile();
      if (state.pendingApplyJobId) {
        const job = JOBS.find(j => j.id === state.pendingApplyJobId);
        state.applyReviewJob = job || null;
      }
      state.view = "results";
      render();
    }

    // Apply-with-resume-review flow
    function startApply(jobId) {
      ensureResumeDefaults();
      state.pendingApplyJobId = jobId;
      state.applyReviewJob = JOBS.find(j => j.id === jobId) || null;
      render();
    }

    function editResumeFromReview() {
      state.applyReviewJob = null;
      state.view = "resumeBuilder";
      render();
    }

    function cancelApply() {
      state.applyReviewJob = null;
      state.pendingApplyJobId = null;
      render();
    }

    function confirmApply() {
      if (state.pendingApplyJobId) {
        state.appliedJobs[state.pendingApplyJobId] = true;
        const job = JOBS.find(j => j.id === state.pendingApplyJobId);
        ensureResumeDefaults();
        upsertMyCandidateProfile();
        // Re-applying after a withdrawal reactivates the existing application
        // record (reset to "applied") instead of creating a duplicate row.
        const existing = getMyApplication(state.pendingApplyJobId);
        if (existing) {
          existing.status = "applied";
          existing.appliedAt = Date.now();
          existing.candidateName = state.resume.name || "Anonymous Applicant";
          existing.candidateSkills = { ...state.skills };
          existing.objective = state.resume.objective;
        } else {
          APPLICATIONS.push({
            id: "app_" + Date.now(),
            jobId: state.pendingApplyJobId,
            jobTitle: job ? job.title : "Job",
            company: job ? job.company : "",
            candidateId: "me",
            candidateName: state.resume.name || "Anonymous Applicant",
            candidateSkills: { ...state.skills },
            objective: state.resume.objective,
            status: "applied",
            appliedAt: Date.now()
          });
        }
      }
      state.applyReviewJob = null;
      state.pendingApplyJobId = null;
      render();
    }

    // Opens the course-details modal so a jobseeker can review a course before enrolling.
    function openCourseModal(courseId) {
      const course = COURSES.find(c => c.id === courseId);
      state.selectedCourseModal = course || null;
      render();
    }

    function closeCourseModal() {
      state.selectedCourseModal = null;
      render();
    }

    // Jobseeker enrolls in a training-provider course, normally from the course-details modal.
    function enrollInCourse(courseId) {
      if (state.enrolledCourseIds[courseId]) return;
      const course = COURSES.find(c => c.id === courseId);
      if (!course) return;
      course.enrolled = (course.enrolled || 0) + 1;
      state.enrolledCourseIds[courseId] = true;
      ensureResumeDefaults();
      ENROLLMENTS.push({
        id: "enr_" + Date.now(),
        candidateId: "me",
        courseId,
        courseTitle: course.title,
        provider: course.provider,
        learnerName: state.resume.name || "Anonymous Learner",
        enrolledAt: Date.now()
      });
      render();
    }

    // Jobseeker cancels an existing enrollment — allowed at any time.
    function cancelEnrollment(courseId) {
      if (!state.enrolledCourseIds[courseId]) return;
      const course = COURSES.find(c => c.id === courseId);
      if (course) course.enrolled = Math.max(0, (course.enrolled || 0) - 1);
      delete state.enrolledCourseIds[courseId];
      ENROLLMENTS = ENROLLMENTS.filter(e => !(e.courseId === courseId && e.candidateId === "me"));
      render();
    }

    /* ==========================================================================
       COMPANIES PORTAL — post jobs, search candidates, review applications, hire
       ========================================================================== */

    // Shared sidebar nav for every company-portal screen, so a company can
    // jump straight between "Job posts", "Applications" and "Search
    // candidates" without threading back through a home screen first.
    function renderCompanyNav(activeView) {
      const myJobs = getCompanyPostedJobs();
      const myJobIds = myJobs.map(j => j.id);
      const appCount = APPLICATIONS.filter(a => myJobIds.includes(a.jobId)).length;
      const items = [
        { view: "companyHome", icon: "💼", label: "Job posts", count: myJobs.length },
        { view: "companyApplications", icon: "📥", label: "Applications", count: appCount },
        { view: "companyCandidates", icon: "🔍", label: "Search candidates", count: null }
      ];
      return `
        <div class="card no-print">
          <div class="sidebar-section-title">🏢 Company Portal</div>
          <div class="company-nav">
            ${items.map(it => `
              <button class="company-nav-btn ${activeView === it.view ? "active" : ""}"
                onclick="${it.view === 'companyApplications' ? 'backToApplicationsOverview(); ' : ''}state.view='${it.view}'; render();">
                <span class="nav-icon">${it.icon}</span>
                <span>${it.label}</span>
                ${it.count !== null ? `<span class="nav-count">${it.count}</span>` : ""}
              </button>
            `).join("")}
          </div>
          <hr class="company-nav-divider" />
          <button class="btn company-btn" style="width:100%;" onclick="openPostJobForm()">+ Post a job</button>
        </div>
      `;
    }

    // Shared hero/stats banner for every company-portal screen — pulled out
    // of the "Job posts" view so it renders identically no matter which tab
    // is active, instead of vanishing when you switch tabs.
    function renderCompanyHero() {
      const myJobs = getCompanyPostedJobs();
      const myJobIds = myJobs.map(j => j.id);
      const myApps = APPLICATIONS.filter(a => myJobIds.includes(a.jobId));
      const companyName = myJobs.length ? myJobs[myJobs.length - 1].company : "Your Company";
      const initials = companyName.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join("");
      return `
        <div class="card company-hero">
          <div class="profile-id-card" style="margin-bottom: 20px;">
            <div class="profile-avatar">${initials || "🏢"}</div>
            <div>
              <div class="profile-id-name">${companyName}</div>
              <div class="profile-id-role">Companies Portal · Hiring dashboard</div>
            </div>
          </div>
          <div class="quick-stats-row">
            <div class="quick-stat"><div class="quick-stat-num">${myJobs.length}</div><div class="quick-stat-label">Jobs posted</div></div>
            <div class="quick-stat"><div class="quick-stat-num">${myApps.length}</div><div class="quick-stat-label">Applications received</div></div>
            <div class="quick-stat"><div class="quick-stat-num">${myApps.filter(a => a.status === 'hired').length}</div><div class="quick-stat-label">Hired</div></div>
            <div class="quick-stat"><div class="quick-stat-num">${CANDIDATE_POOL.length}</div><div class="quick-stat-label">Searchable candidates</div></div>
          </div>
        </div>
      `;
    }

    function openPostJobForm() {
      state.view = "companyPostJob";
      render();
    }

    function submitJobPost() {
      const d = state.jobDraft;
      if (!d.company.trim() || !d.title.trim()) {
        alert("Please add at least a company name and job title.");
        return;
      }
      const newJob = {
        id: Date.now(),
        title: d.title.trim(),
        company: d.company.trim(),
        location: d.location.trim() || "Philippines",
        salary: d.salary.trim() || "Negotiable",
        type: d.type,
        reqSkill: d.reqSkill,
        setup: d.setup,
        companyPosted: true
      };
      JOBS.push(newJob);
      if (!COMPANIES[newJob.company]) {
        COMPANIES[newJob.company] = {
          industry: "Employer on JobStart",
          size: "Growing team",
          benefits: ["Details shared during interview"],
          description: `${newJob.company} is hiring through JobStart.`,
          link: "https://www.google.com/search?q=" + encodeURIComponent(newJob.company + " Careers")
        };
      }
      state.jobDraft = { company: d.company, title: "", location: "", salary: "", type: "Full-time", reqSkill: "communication", setup: "Onsite" };
      state.view = "companyHome";
      render();
    }

    function getCompanyPostedJobs() {
      return JOBS.filter(j => j.companyPosted);
    }

    function searchCandidatesList() {
      const q = state.candidateQuery.trim().toLowerCase();
      if (!q) return CANDIDATE_POOL;
      return CANDIDATE_POOL.filter(c => {
        if (c.name.toLowerCase().includes(q) || c.bestFitTitle.toLowerCase().includes(q)) return true;
        return Object.entries(c.skills).some(([sk, val]) => val >= 3 && (SKILL_LABELS[sk] || sk).toLowerCase().includes(q));
      });
    }

    function openCandidateModal(id) {
      state.selectedCandidate = CANDIDATE_POOL.find(c => c.id === id) || null;
      render();
    }

    function closeCandidateModal() {
      state.selectedCandidate = null;
      render();
    }

    function viewApplicationsForJob(jobId) {
      state.selectedApplicationsJobId = jobId;
      render();

    function submitCourseOffer() {
      const d = state.courseDraft;
      if (!d.provider.trim() || !d.title.trim()) {
        alert("Please add at least a provider name and course title.");
        return;
      }
      COURSES.push({
        id: "tc_" + Date.now(),
        provider: d.provider.trim(),
        title: d.title.trim(),
        skill: d.skill,
        level: d.level,
        duration: d.duration.trim() || "Self-paced",
        price: d.price.trim() || "Free",
        enrolled: 0
      });
      state.courseDraft = { provider: d.provider, title: "", skill: "communication", level: "Beginner", duration: "", price: "" };
      state.view = "trainingHome";
      render();
    }

    // Averages every candidate's skill scores to find where the talent pool is
    // weakest — the gaps training providers are best positioned to close.
    function computeSkillGapReport() {
      const pool = CANDIDATE_POOL.length ? CANDIDATE_POOL : [];
      const keys = Object.keys(EMPTY_SKILLS);
      const avgs = keys.map(key => {
        const total = pool.reduce((sum, c) => sum + (c.skills[key] || 1), 0);
        return { key, avg: pool.length ? total / pool.length : 1 };
      });
      return avgs.sort((a, b) => a.avg - b.avg);
    }

                  </div>
                  <div class="form-group">
                    <label class="form-label">Price</label>
                    <input type="text" class="form-input" placeholder="e.g. Free or ₱1,500" value="${d.price}" oninput="state.courseDraft.price=this.value">
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Skill gap this course closes</label>
                    <select class="form-input" onchange="state.courseDraft.skill=this.value">
                      ${Object.entries(SKILL_LABELS).map(([k,v]) => `<option value="${k}" ${d.skill===k?"selected":""}>${v}</option>`).join("")}
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Level</label>
                    <select class="form-input" onchange="state.courseDraft.level=this.value">
                      ${["Beginner","Intermediate","Advanced"].map(t => `<option value="${t}" ${d.level===t?"selected":""}>${t}</option>`).join("")}
                    </select>
                  </div>
                </div>

                <button class="btn training-btn" style="width:100%; margin-top:8px;" onclick="submitCourseOffer()">📚 Publish course</button>
              </div>
            </div>
          </div>
        `;
      }

      // 7c. COURSE DETAILS MODAL — jobseeker reviews a course before enrolling, and can cancel anytime
      if (state.selectedCourseModal) {
        const c = state.selectedCourseModal;
        const isEnrolled = !!state.enrolledCourseIds[c.id];
        html += `
          <div class="modal-overlay" onclick="closeCourseModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeCourseModal()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.25rem; color: var(--primary-dark); margin-bottom: 4px;">${c.title}</h2>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">${c.provider}</div>

              <div style="background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 18px;">
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Skill focus</span><span class="badge badge-purple">${SKILL_LABELS[c.skill] || c.skill}</span></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Level</span><strong>${c.level}</strong></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Duration</span><strong>${c.duration}</strong></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Price</span><strong>${c.price}</strong></div>
                <div style="display:flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem;"><span style="color:var(--text-muted);">Enrolled via JobStart</span><strong>${c.enrolled || 0}</strong></div>
              </div>

              ${isEnrolled
                ? `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                     <span class="badge badge-green">✓ You're enrolled</span>
                     <button class="btn btn-secondary" style="flex:1;" onclick="cancelEnrollment('${c.id}')">Cancel enrollment</button>
                   </div>`
                : `<button class="btn" style="width:100%;" onclick="enrollInCourse('${c.id}')">🎓 Enroll in this course</button>`
              }
            </div>
          </div>
        `;
      }

      // 8. COMPANY DETAILS MODAL OVERLAY
      if (state.selectedCompanyModal) {
        const comp = state.selectedCompanyModal;
        html += `
          <div class="modal-overlay" onclick="closeCompanyModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeCompanyModal()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.3rem; color: var(--primary-dark); margin-bottom: 4px;">${comp.name}</h2>
              <div style="font-size: 0.83rem; color: var(--text-muted); margin-bottom: 14px;">${comp.industry} &nbsp;·&nbsp; ${comp.size}</div>
              <p style="font-size: 0.93rem; margin-bottom: 18px; color: var(--text);">${comp.description}</p>

              <h4 style="font-size: 0.85rem; margin-bottom: 10px;">Standard employee benefits</h4>
              <ul style="margin-left: 20px; font-size: 0.88rem; margin-bottom: 22px; line-height: 1.7; color: var(--text);">
                ${comp.benefits.map(b => `<li>${b}</li>`).join("")}
              </ul>

              <div style="display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
                <span style="font-size: 0.74rem; color: var(--text-muted);">* Demo company profile overview</span>
                <a href="${comp.link}" target="_blank" class="btn" style="text-decoration:none;">Search openings ↗</a>
              </div>
            </div>
          </div>
        `;
      }

      // 9. APPLICATION REVIEW MODAL — review & edit resume before submitting
      if (state.applyReviewJob) {
        ensureResumeDefaults();
        const job = state.applyReviewJob;
        const r = state.resume;
        html += `
          <div class="modal-overlay" onclick="cancelApply()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="cancelApply()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.25rem; color: var(--primary-dark); margin-bottom: 4px;">Review your application</h2>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">${job.title} at <strong>${job.company}</strong></div>

              <div style="background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 16px;">
                <div style="font-weight:700; font-family: var(--font-display);">${r.name || "Your Name"}</div>
                <div style="font-size:0.83rem; color:var(--text-muted); margin-bottom:10px;">${[r.email, r.phone, r.location].filter(Boolean).join("  ·  ") || "Add your contact details"}</div>
                <p style="font-size:0.85rem; margin-bottom:10px;">${r.objective}</p>
                <div class="tag-list" style="margin-bottom:6px;">
                  ${r.skills.slice(0, 6).map(s => `<span class="tag-chip" style="cursor:default;">${s}</span>`).join("")}
                </div>
                <div style="font-size:0.8rem; color:var(--text-muted);">
                  ${r.experience.length} work experience entr${r.experience.length === 1 ? "y" : "ies"} · ${r.certifications.length} certification${r.certifications.length === 1 ? "" : "s"} · ${r.projects.length} project${r.projects.length === 1 ? "" : "s"}
                </div>
              </div>

              <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:18px;">You can edit your resume before submitting.</p>

              <div style="display:flex; justify-content: space-between; align-items:center; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="editResumeFromReview()">✏️ Edit resume</button>
                <button class="btn" onclick="confirmApply()">🚀 Submit application</button>
              </div>
            </div>
          </div>
        `;
      }

      // 10. CANDIDATE PROFILE MODAL — companies viewing a jobseeker's profile
      if (state.selectedCandidate) {
        const c = state.selectedCandidate;
        html += `
          <div class="modal-overlay" onclick="closeCandidateModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeCandidateModal()" aria-label="Close">×</button>
              <h2 style="font-family: var(--font-display); font-size: 1.3rem; color: var(--primary-dark); margin-bottom: 4px;">${c.name}</h2>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">Best fit: <strong>${c.bestFitTitle}</strong></div>

              <h4 style="font-size: 0.85rem; margin-bottom: 10px;">Skill profile</h4>
              ${Object.entries(c.skills).map(([key, val]) => `
                <div class="skill-row">
                  <span class="skill-name" style="text-transform: capitalize;">${SKILL_LABELS[key] || key}</span>
                  <div class="skill-dots">
                    ${[1,2,3,4,5].map(d => `<div class="dot ${d <= val ? 'active' : ''}"></div>`).join("")}
                  </div>
                </div>
              `).join("")}

              <h4 style="font-size: 0.85rem; margin: 18px 0 10px;">Preferences</h4>
              <p style="font-size:0.88rem; margin-bottom: 18px;">
                📍 ${c.preferences.relocate} &nbsp;·&nbsp; 🏠 ${c.preferences.setup} &nbsp;·&nbsp; 💰 ${c.preferences.salary} &nbsp;·&nbsp; 🎓 ${c.preferences.edu}
              </p>

              <span style="font-size: 0.74rem; color: var(--text-muted);">* Full contact details are shared once this candidate applies to your job.</span>
            </div>
          </div>
        `;
      }

      app.innerHTML = html;
    }

    // Initialize App
    render();
  </script>
</body>
</html>
