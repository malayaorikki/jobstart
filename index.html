        progress: s => ({ cur: Object.keys(s.enrolledCourseIds).length, target: 3 }) }
    ];

    // Awards flat XP outside of an achievement (e.g. a per-question tick)
    // and pops a small toast so the gain is visible in the moment.
    function awardXP(amount, label) {
      if (!amount) return;
      state.xp += amount;
      if (label) showXpToast("⚡", `+${amount} XP`, label);
    }

    // Grants one specific achievement by id (if not already earned) and queues
    // its toast. Used both by checkAchievements (state-derived unlocks) and by
    // action handlers that need an achievement tied to a specific click rather
    // than to whatever state happens to be true when checkAchievements next runs.
    function unlockAchievement(id) {
      if (state.badges.includes(id)) return;
      const a = ACHIEVEMENTS.find(x => x.id === id);
      if (!a) return;
      state.badges.push(a.id);
      state.xp += a.xp;
      showXpToast(a.icon, "Achievement unlocked!", a.label);
    }

    // IDs handled by an explicit unlockAchievement() call at the moment of the
    // relevant action, rather than by the generic state-test loop below:
    //  - "started": fires when the quiz is actually opened (Take the Quiz),
    //    not merely once state.answers has an entry.
    //  - "explorer": fires when Submit Quiz is clicked, not the instant the
    //    last question's answer is recorded (which happens before Submit).
    const MANUALLY_TRIGGERED_ACHIEVEMENTS = new Set(["started", "explorer"]);

    // Recomputes which of the remaining, state-derived achievements are
    // currently earned, diffs against what was already recorded, grants their
    // XP bonus, and queues a toast for anything newly unlocked. Safe to call
    // after any state-changing action.
    function checkAchievements() {
      ACHIEVEMENTS.forEach(a => {
        if (MANUALLY_TRIGGERED_ACHIEVEMENTS.has(a.id)) return;
        if (!state.badges.includes(a.id) && a.test(state)) {
          unlockAchievement(a.id);
        }
      });
    }

    // Toast queue — shown one at a time so multiple simultaneous unlocks
    // (e.g. finishing the quiz) don't all flash on top of each other.
    let xpToastQueue = [];
    let xpToastBusy = false;
    function showXpToast(icon, title, sub) {
      xpToastQueue.push({ icon, title, sub });
      if (!xpToastBusy) drainXpToastQueue();
    }
    function drainXpToastQueue() {
      const stack = document.getElementById("xpToastStack");
      if (!stack || !xpToastQueue.length) { xpToastBusy = false; return; }
      xpToastBusy = true;
      const t = xpToastQueue.shift();
      const el = document.createElement("div");
      el.className = "xp-toast";
      el.innerHTML = `<span class="xp-toast-icon">${t.icon}</span><span><span class="xp-toast-title">${t.title}</span><br><span class="xp-toast-sub">${t.sub}</span></span>`;
      stack.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => { el.remove(); drainXpToastQueue(); }, 250);
      }, 2600);
    }

    // Keeps the small XP/level pill in the header in sync on every render —
    // only shown once a person has started earning XP, and only in the
    // job-seeker portal (it has no meaning inside the Company/Training views).
    function updateHeaderXpBadge() {
      const el = document.getElementById("headerXpBadge");
      if (!el) return;
      const show = state.xp > 0 && state.portal === "seeker" && state.view !== "portal";
      el.style.display = show ? "inline-flex" : "none";
      if (show) {
        const info = getLevelInfo(state.xp);
        el.textContent = `Lv ${info.level} · ${state.xp} XP`;
      }
    }

    /* ==========================================================================
       CORE CALCULATIONS & UTILITIES
       ========================================================================== */

    // How strongly each question type's selection counts toward a tagged
    // career field. A forced single choice says more than one checkbox among
    // many, and a rating's own 1-5 value stands in for its weight.
    const MULTI_FIELD_WEIGHT = 2;
    const SINGLE_FIELD_WEIGHT = 4;

    function makeEmptyInterests() {
      const obj = {};
      CAREER_PROFILES.forEach(p => { obj[p.id] = 0; });
      return obj;
    }

    // Starts (or restarts) the interest assessment from the intro panel.
    function startAssessment() {
      state.currentQ = 0;
      render();
    }

    // Sets one preference (setup/salary/shift/edu) from the pill picker on
    // the intro panel. Doesn't touch interest scores — these are separate
    // from the 30-question assessment and just seed state.preferences,
    // which the results sidebar and "Your Preferences" card already read.
    function setPreference(key, value) {
      state.preferences[key] = value;
      render();
    }

    // Records a single-select or rating answer, then auto-advances to the
    // next question (or stays put on the last question so Submit can show).
    function answerQuestion(optIndex) {
      state.answers[state.currentQ] = optIndex;
      if (!state.xpAwardedQ[state.currentQ]) {
        state.xp += QUESTION_XP;
        state.xpAwardedQ[state.currentQ] = true;
      }
      recomputeScores();
      checkAchievements();

      if (state.currentQ < QUESTIONS.length - 1) {
        state.currentQ++;
      }
      render();
    }

    // Toggles one checkbox on a "select all that apply" question. Doesn't
    // auto-advance — the person can pick more than one before continuing.
    function toggleMultiAnswer(optIndex) {
      const current = Array.isArray(state.answers[state.currentQ]) ? state.answers[state.currentQ] : [];
      const idx = current.indexOf(optIndex);
      const next = idx >= 0 ? current.filter(i => i !== optIndex) : [...current, optIndex];
      state.answers[state.currentQ] = next;
      if (next.length && !state.xpAwardedQ[state.currentQ]) {
        state.xp += QUESTION_XP;
        state.xpAwardedQ[state.currentQ] = true;
      }
      recomputeScores();
      checkAchievements();
      render();
    }

    // Moves forward from a multi-select question once at least one box is
    // checked (called by the "Continue" button in the quiz footer).
    function advanceQuiz() {
      if (state.currentQ < QUESTIONS.length - 1) {
        state.currentQ++;
        render();
      }
    }

    // Recomputes state.interests (raw score per career field) from scratch
    // based on every answer currently stored, then derives state.skills from
    // those interests so the rest of the app (job/course matching, the
    // sidebar skill profile) keeps working off the same 8 skill dimensions
    // it always has. Recomputing from scratch (rather than incrementing on
    // each click) means going back and changing an answer, or unchecking a
    // box, is always reflected correctly with no double-counting.
    function recomputeScores() {
      const interests = makeEmptyInterests();

      QUESTIONS.forEach((q, i) => {
        const ans = state.answers[i];
        if (ans === undefined) return;

        if (q.type === "rating") {
          const opt = q.opts[ans];
          if (!opt) return;
          const value = ans + 1; // option index 0-4 -> rating 1-5
          (q.fields || []).forEach(f => { interests[f] = (interests[f] || 0) + value; });
        } else if (q.type === "multi") {
          (Array.isArray(ans) ? ans : []).forEach(optIdx => {
            const opt = q.opts[optIdx];
            if (!opt || !opt.fields) return;
            for (const f in opt.fields) {
              interests[f] = (interests[f] || 0) + MULTI_FIELD_WEIGHT * opt.fields[f];
            }
          });
        } else { // single
          const opt = q.opts[ans];
          if (!opt || !opt.fields) return;
          for (const f in opt.fields) {
            interests[f] = (interests[f] || 0) + SINGLE_FIELD_WEIGHT * opt.fields[f];
          }
        }
      });

      state.interests = interests;

      // Derive the 8 legacy skill dimensions from field interest, using each
      // career profile's own skill weighting so job/course matching and the
      // "Your Skill Profile" sidebar stay meaningful without a separate quiz.
      const skillRaw = { communication: 0, tech: 0, customerService: 0, sales: 0, trade: 0, creative: 0, leadership: 0, numeracy: 0 };
      CAREER_PROFILES.forEach(prof => {
        const val = interests[prof.id] || 0;
        for (const sk in prof.weights) {
          skillRaw[sk] = (skillRaw[sk] || 0) + val * prof.weights[sk];
        }
      });
      const maxRaw = Math.max(1, ...Object.values(skillRaw));
      const skills = {};
      Object.keys(skillRaw).forEach(sk => {
        skills[sk] = Math.max(1, Math.min(5, Math.round(1 + 4 * (skillRaw[sk] / maxRaw))));
      });
      state.skills = skills;
    }

    // Called from the "Submit Quiz" button that appears once the final
    // question has been answered — takes the user to their results/profile.
    function submitQuiz() {
      state.view = "results";
      upsertMyCandidateProfile();
      unlockAchievement("explorer");
      checkAchievements();
      render();
    }

    // Publishes/refreshes "your" profile into the shared candidate pool so the
    // Companies portal can discover and search for you, just like a real candidate.
    function upsertMyCandidateProfile() {
      const best = calculateTopFit();
      const mine = {
        id: "me",
        name: (state.resume && state.resume.name) ? state.resume.name : "You (just completed the assessment)",
        bestFitTitle: best.title,
        skills: { ...state.skills },
        preferences: { ...state.preferences }
      };
      const idx = CANDIDATE_POOL.findIndex(c => c.id === "me");
      if (idx >= 0) CANDIDATE_POOL[idx] = mine; else CANDIDATE_POOL.push(mine);
    }

    // TEMP: dev-only shortcut that skips the quiz entirely and jumps straight
    // to the results/profile view for a SPECIFIC career path. Rather than
    // faking the final interests/skills numbers directly, this picks the
    // most on-path answer for every question — the option (or, for ratings,
    // the top score) that most favors pathId, same as a real quiz-taker
    // aiming for that path would answer — then runs those answers through
    // the exact same recomputeScores() pipeline as a normal quiz submission.
    // That keeps results, state.answers, and going back into the quiz all
    // consistent with a real playthrough. Delete this function along with
    // its button/dropdown in the quiz view (search "TEMP") when you're done
    // testing.
    function skipQuizToPath(pathId) {
      const profile = CAREER_PROFILES.find(p => p.id === pathId);
      if (!profile) return;

      QUESTIONS.forEach((q, i) => {
        if (q.type === "rating") {
          // Question-level fields array — answer at max (5) if it scores
          // toward this path, otherwise leave it at minimum (1) so it
          // doesn't accidentally boost some other field.
          const relevant = (q.fields || []).includes(pathId);
          state.answers[i] = relevant ? q.opts.length - 1 : 0;
        } else if (q.type === "multi") {
          // Check every box that scores any weight toward this path. If
          // none do, fall back to the single lowest-weight box rather than
          // always box 0 — same reasoning as the "single" branch below:
          // always defaulting to index 0 was quietly stacking weight onto
          // whatever field that box happens to favor.
          const matchIdxs = q.opts
            .map((o, idx) => (o.fields && o.fields[pathId]) ? idx : -1)
            .filter(idx => idx >= 0);
          if (matchIdxs.length) {
            state.answers[i] = matchIdxs;
          } else {
            let minIdx = 0, minWeight = Infinity;
            q.opts.forEach((o, idx) => {
              const total = o.fields ? Object.values(o.fields).reduce((a, b) => a + b, 0) : 0;
              if (total < minWeight) { minWeight = total; minIdx = idx; }
            });
            state.answers[i] = [minIdx];
          }
        } else { // single
          // Pick whichever option weights this path highest. If no option
          // mentions this path at all, don't default to index 0 — that
          // silently dumps full weight onto whatever field option 0
          // happens to favor (frequently science/engineering/it), which
          // was quietly out-scoring paths like law, agriculture, sports,
          // and fashion that show up in fewer questions. Instead fall
          // back to whichever option carries the least total weight
          // toward OTHER fields, to do the least collateral damage.
          let bestIdx = -1, bestVal = 0;
          q.opts.forEach((o, idx) => {
            const val = (o.fields && o.fields[pathId]) || 0;
            if (val > bestVal) { bestVal = val; bestIdx = idx; }
          });
          if (bestIdx === -1) {
            let minWeight = Infinity;
            q.opts.forEach((o, idx) => {
              const total = o.fields ? Object.values(o.fields).reduce((a, b) => a + b, 0) : 0;
              if (total < minWeight) { minWeight = total; bestIdx = idx; }
            });
          }
          state.answers[i] = bestIdx;
        }
        // Award the same per-question XP a real quiz-taker would get from
        // answerQuestion()/toggleMultiAnswer() — the direct state.answers
        // assignment above bypasses those handlers, so without this the
        // skip shortcut under-awards XP versus manually answering.
        if (!state.xpAwardedQ[i]) {
          state.xp += QUESTION_XP;
          state.xpAwardedQ[i] = true;
        }
      });

      recomputeScores();

      // The quiz content itself doesn't weight every field evenly — a
      // field like "fashion" only appears in a handful of question
      // options, while others (science, arts, engineering...) show up
      // across many more, so even the most on-path set of answers can
      // still be edged out by incidental collateral weight elsewhere.
      // Since this is a dev-only shortcut meant to jump straight to a
      // specific path for testing, guarantee the requested path actually
      // comes out on top — without touching QUESTIONS itself — by
      // nudging its interest score just above the next-highest one.
      const otherScores = CAREER_PROFILES
        .filter(p => p.id !== pathId)
        .map(p => state.interests[p.id] || 0);
      const maxOther = otherScores.length ? Math.max(...otherScores) : 0;
      state.interests[pathId] = Math.max(state.interests[pathId] || 0, maxOther + 1);

      checkAchievements();
      submitQuiz();
    }

    function prevQuestion() {
      if (state.currentQ > -1) {
        state.currentQ--;
        render();
      }
    }

    function resetApp() {
      // Clean up records tied to "you" from the shared cross-portal pools
      CANDIDATE_POOL = CANDIDATE_POOL.filter(c => c.id !== "me");
      APPLICATIONS = APPLICATIONS.filter(a => a.candidateId !== "me");

      state = {
        portal: null,
        view: "home",
        currentQ: 0,
        xp: 0,
        badges: [],
        answers: {},
        xpAwardedQ: {},
        xpAwardedApply: {},
        xpAwardedEnroll: {},
        interests: makeEmptyInterests(),
        skills: { communication: 1, tech: 1, customerService: 1, sales: 1, trade: 1, creative: 1, leadership: 1, numeracy: 1 },
        preferences: { setup: "Open", relocate: "Regional", shift: "Flexible", edu: "College Degree" },
        appliedJobs: {},
        selectedCompanyModal: null,
        selectedCourseModal: null,
        selectedJobModal: null,
        offerAcceptedModal: null,
        resume: null,
        applyReviewJob: null,
        pendingApplyJobId: null,
        openFieldDropdown: null,
        jobDraft: { company: "", title: "", location: "", salary: "", type: "Full-time", reqSkills: [{ skill: "communication", level: 3 }], careerPath: "", setup: "Onsite", description: "", editId: null },
        jobDraftErrors: {},
        selectedApplicationsJobId: null,
        pendingDeleteJobId: null,
        companyJobSearch: "",
        pendingDeleteCompanyName: null,
        courseDraft: { provider: "", title: "", skill: "communication", level: "Beginner", duration: "", price: "", description: "", editId: null },
        courseDraftErrors: {},
        pendingDeleteCourseId: null,
        selectedApplicationsCourseId: null,
        trainingCourseSearch: "",
        pendingDeleteProviderName: null,
        enrolledCourseIds: {}
      };
      render();
    }

    /* ==========================================================================
       PORTAL NAVIGATION — Job Seekers / Companies / Training Providers
       ========================================================================== */

    function goPortalChooser() {
      state.portal = null;
      state.view = "portal";
      render();
    }

    function goToPortal(portal) {
      state.portal = portal;
      if (portal === "seeker") {
        // If this user has already completed the quiz, take them straight back
        // to their profile/results page instead of the job-seeker landing page.
        const hasProfile = CANDIDATE_POOL.some(c => c.id === "me");
        state.view = hasProfile ? "results" : "home";
      }
      else if (portal === "company") state.view = "companyHome";
      else if (portal === "training") state.view = "trainingHome";
      render();
    }

    // Entry point for every "Discover my career fit" / "Start the quiz" style
    // button on the home page. If the person has already completed the quiz,
    // send them straight to their dashboard instead of making them retake it.
    function startQuizOrGoToDashboard() {
      const hasProfile = CANDIDATE_POOL.some(c => c.id === "me");
      state.portal = "seeker";
      state.view = hasProfile ? "results" : "quiz";
      if (!hasProfile) unlockAchievement("started");
      render();
    }

    // The career field with the highest accumulated interest score wins —
    // each CAREER_PROFILES entry's id matches a field id directly, so no
    // weighting step is needed here (that only happens for deriving skills).
    function calculateTopFit() {
      let bestProfile = CAREER_PROFILES[0];
      let highestScore = -1;

      CAREER_PROFILES.forEach(prof => {
        const score = state.interests[prof.id] || 0;
        if (score > highestScore) {
          highestScore = score;
          bestProfile = prof;
        }
      });

      return bestProfile;
    }

    // Match percentage for the top-fit career path, shown in the ring on the
    // "Your Career Path" profile card — the winning field's share of the
    // total interest points earned across all 14 fields.
    function getTopFitPercentage() {
      const best = calculateTopFit();
      const total = Object.values(state.interests).reduce((a, b) => a + b, 0);
      if (total <= 0) return 0;
      return Math.max(1, Math.min(99, Math.round(((state.interests[best.id] || 0) / total) * 100)));
    }

    function getTopCareerMatches(n) {
      return CAREER_PROFILES
        .map(prof => ({ profile: prof, score: state.interests[prof.id] || 0 }))
        .sort((a, b) => b.score - a.score)
        .slice(0, n)
        .map(item => item.profile);
    }

    function getSkillLevel(score) {
      if (score >= 4.5) return "Expert / Mastery";
      if (score >= 3.5) return "Intermediate-Advanced";
      if (score >= 2.5) return "Intermediate";
      if (score >= 1.5) return "Beginner-Intermediate";
      return "Novice";
    }

    function getStrengthsAndGaps() {
      const sorted = Object.entries(state.skills).sort((a,b) => b[1] - a[1]);
      const strengths = sorted.slice(0, 3).map(item => item[0]);
      const gaps = sorted.slice(-2).map(item => item[0]);
      return { strengths, gaps };
    }

    // Derives a salary range purely from real, currently-open postings in a
    // career path (min of all posted lows, max of all posted highs). Returns
    // null when there's no open posting to derive it from — no guessing off
    // the static per-profile estimate.
    function getEstimatedSalaryRange(pathId) {
      const openJobs = JOBS.filter(job => job.careerPath === pathId && !job.closed);
      let lo = Infinity, hi = -Infinity;
      openJobs.forEach(job => {
        const nums = (job.salary.match(/[\d,]+/g) || []).map(n => parseInt(n.replace(/,/g, ""), 10));
        if (!nums.length) return;
        lo = Math.min(lo, Math.min(...nums));
        hi = Math.max(hi, Math.max(...nums));
      });
      if (!isFinite(lo) || !isFinite(hi)) return null;
      return `₱${lo.toLocaleString()} – ₱${hi.toLocaleString()} / month`;
    }

    function calcJobMatch(job) {
      const reqSkills = job.reqSkills && job.reqSkills.length ? job.reqSkills : [{ skill: "communication", level: 3 }];
      // Fit per skill is how close the user's level is to what the company
      // actually requires, not just the user's raw skill score — meeting or
      // exceeding the requirement counts as a full 100% fit on that skill.
      const avgFit = reqSkills.reduce((sum, r) => {
        const userLevel = state.skills[r.skill] || 1;
        const required = r.level || 1;
        return sum + Math.min(1, userLevel / required);
      }, 0) / reqSkills.length;
      return Math.min(98, Math.round(avgFit * 100));
    }

    // Withdraw an in-progress application. Only allowed while the application
    // is still in a withdrawable state (not already hired/rejected/withdrawn).
    function withdrawApplication(jobId) {
      const app = getMyApplication(jobId);
      if (app && WITHDRAWABLE_STATUSES.includes(app.status)) {
        app.status = "withdrawn";
      }
      state.appliedJobs[jobId] = false;
      render();
    }

    // Candidate confirms they accept a "hired" offer. Only valid while the
    // application is in the "hired" status and hasn't already been accepted —
    // this flips a separate offerAccepted flag rather than a new pipeline
    // status, so the employer-side status history stays untouched.
    function acceptOffer(jobId) {
      const app = getMyApplication(jobId);
      if (app && app.status === "hired" && !app.offerAccepted) {
        app.offerAccepted = true;
        awardXP(25, "Offer accepted");
        state.offerAcceptedModal = JOBS.find(j => j.id === jobId) || null;
        // Close the job details modal (if open) so it isn't stacked underneath
        // the celebration modal — only one overlay should show at a time.
        state.selectedJobModal = null;
      }
      render();
    }

    function closeOfferAcceptedModal() {
      state.offerAcceptedModal = null;
      render();
    }

    // Applicant-facing status label — shows "Offer Accepted" once the candidate
    // has confirmed a hire, without touching the shared STATUS_META used by the
    // employer-side pipeline view.
    function getApplicantStatusLabel(app) {
      if (!app) return "";
      if (app.status === "hired" && app.offerAccepted) return "Offer Accepted";
      return STATUS_META[app.status].label;
    }

    function openCompanyModal(companyName) {
      state.selectedCompanyModal = COMPANIES[companyName] ? { name: companyName, ...COMPANIES[companyName] } : null;
      render();
    }

    function closeCompanyModal() {
      state.selectedCompanyModal = null;
      render();
    }

    function copyTextResume() {
      ensureResumeDefaults();
      const r = state.resume;
      const expText = r.experience.length
        ? r.experience.map(e => `- ${e.title || "Role"} at ${e.company || "Company"} (${e.duration || "Dates"})\n  ${e.desc || ""}`).join("\n")
        : "- None added yet";
      const certText = r.certifications.length
        ? r.certifications.map(c => `- ${c.name || "Certification"} — ${c.issuer || "Issuer"} (${c.year || "Year"})`).join("\n")
        : "- None added yet";
      const projText = r.projects.length
        ? r.projects.map(p => `- ${p.title || "Project"}: ${p.desc || ""}`).join("\n")
        : "- None added yet";
      const eduText = (r.education.level || r.education.school || r.education.year)
        ? [r.education.level, r.education.school, r.education.year].filter(Boolean).join(" — ")
        : "None added yet";

      const text = `================================================
JOBSTART CAREER PROFILE RESUME
================================================
${r.name || "Your Name"}
${[r.email, r.phone, r.location].filter(Boolean).join(" | ")}

CAREER OBJECTIVE
${r.objective}

SKILLS
${r.skills.join(", ")}

EDUCATION
${eduText}

WORK EXPERIENCE
${expText}

CERTIFICATIONS
${certText}

PROJECTS
${projText}

RECOMMENDED JOB ROLES
${r.recommendedRoles.join(", ")}
================================================`;

      navigator.clipboard.writeText(text);
      alert("Plain-text resume copied to clipboard!");
    }

    /* ==========================================================================
       RESUME BUILDER — defaults, editing helpers, and the apply-with-review flow
       ========================================================================== */

    function buildDefaultResume() {
      const best = calculateTopFit();
      const { strengths } = getStrengthsAndGaps();
      const topSkills = Object.entries(state.skills)
        .filter(([, val]) => val >= 3)
        .sort((a, b) => b[1] - a[1])
        .map(([key]) => SKILL_LABELS[key] || key.charAt(0).toUpperCase() + key.slice(1));
      const roles = getTopCareerMatches(3).map(p => p.title);
      const strengthLabels = strengths.map(s => SKILL_LABELS[s] || s.charAt(0).toUpperCase() + s.slice(1));
      // Strengths from the assessment quiz are folded straight into Skills
      // (dedup'd) instead of living in their own section.
      const mergedSkills = [...new Set([...topSkills, ...strengthLabels])];

      return {
        name: "",
        email: "",
        phone: "",
        location: "",
        objective: `Entry-level jobseeker pursuing a career in ${best.title}, bringing strengths in ${strengthLabels.join(", ")}. Seeking a ${state.preferences.setup.toLowerCase()} role where I can grow professionally.`,
        skills: mergedSkills.length ? mergedSkills : ["Communication"],
        education: { level: "", school: "", year: "" },
        experience: [],
        certifications: [],
        projects: [],
        recommendedRoles: roles
      };
    }

    function ensureResumeDefaults() {
      if (!state.resume) state.resume = buildDefaultResume();
    }

    function openResumeBuilder() {
      ensureResumeDefaults();
      state.view = "resumeBuilder";
      render();
    }

    // Generic tag helpers (skills, recommendedRoles, strengths)
    function addTag(field, inputId) {
      const input = document.getElementById(inputId);
      const val = input.value.trim();
      if (!val) return;
      state.resume[field].push(val);
      input.value = "";
      render();
    }

    function removeTag(field, idx) {
      state.resume[field].splice(idx, 1);
      render();
    }

    // Work experience
    function addExperience() {
      state.resume.experience.push({ title: "", company: "", duration: "", desc: "" });
      render();
    }
    function removeExperience(idx) {
      state.resume.experience.splice(idx, 1);
      render();
    }

    // Certifications
    function addCertification() {
      state.resume.certifications.push({ name: "", issuer: "", year: "" });
      render();
    }
    function removeCertification(idx) {
      state.resume.certifications.splice(idx, 1);
      render();
    }

    // Projects
    function addProject() {
      state.resume.projects.push({ title: "", desc: "" });
      render();
    }
    function removeProject(idx) {
      state.resume.projects.splice(idx, 1);
      render();
    }

    // Safety net: pull current values straight from the input boxes before
    // saving/previewing, in case a browser autofill (or anything else) set
    // the field's text without firing our oninput handler.
    function syncResumeContactFieldsFromDOM() {
      const map = [
        ["resumeName", "name"],
        ["resumeEmail", "email"],
        ["resumePhone", "phone"],
        ["resumeLocation", "location"]
      ];
      map.forEach(([id, field]) => {
        const el = document.getElementById(id);
        if (el && el.value !== state.resume[field]) {
          state.resume[field] = el.value;
        }
      });
    }

    function finishResumeBuilder(target) {
      syncResumeContactFieldsFromDOM();
      if (target === "preview") {
        state.view = "visualResume";
        render();
        return;
      }
      // "save" — return to where the person came from
      upsertMyCandidateProfile();
      checkAchievements();
      if (state.pendingApplyJobId) {
        const job = JOBS.find(j => j.id === state.pendingApplyJobId);
        state.applyReviewJob = job || null;
      }
      state.view = "results";
      render();
    }

    // Apply-with-resume-review flow
    function startApply(jobId) {
      if (!isApplyEnrollUnlocked()) return;
      ensureResumeDefaults();
      state.selectedJobModal = null;
      state.pendingApplyJobId = jobId;
      state.applyReviewJob = JOBS.find(j => j.id === jobId) || null;
      render();
    }

    function editResumeFromReview() {
      state.applyReviewJob = null;
      state.pendingApplyJobId = null;
      state.view = "resumeBuilder";
      render();
    }

    function cancelApply() {
      state.applyReviewJob = null;
      state.pendingApplyJobId = null;
      render();
    }

    function confirmApply() {
      if (state.pendingApplyJobId) {
        const jobId = state.pendingApplyJobId;
        state.appliedJobs[jobId] = true;
        const job = JOBS.find(j => j.id === jobId);
        ensureResumeDefaults();
        upsertMyCandidateProfile();
        // Always create a fresh application record — including when re-applying after
        // a withdrawal — so the withdrawn attempt is preserved as its own row in the
        // company's applicant list instead of being overwritten.
        APPLICATIONS.push({
          id: "app_" + Date.now(),
          jobId: jobId,
          jobTitle: job ? job.title : "Job",
          company: job ? job.company : "",
          candidateId: "me",
          candidateName: state.resume.name || "Anonymous Applicant",
          candidateSkills: { ...state.skills },
          objective: state.resume.objective,
          status: "applied",
          appliedAt: Date.now()
        });
        // Check achievements (e.g. "First Application") before awarding the flat
        // per-job XP below, so the achievement toast is queued — and therefore
        // shown — ahead of the plain "+XP" action toast.
        checkAchievements();
        if (!state.xpAwardedApply[jobId]) {
          state.xp += APPLY_XP;
          state.xpAwardedApply[jobId] = true;
          showXpToast("⚡", `+${APPLY_XP} XP`, "Application submitted");
        }
      }
      state.applyReviewJob = null;
      state.pendingApplyJobId = null;
      render();
    }

    // Opens the job-details modal so a jobseeker can review a role before applying.
    function openJobModal(jobId) {
      const job = JOBS.find(j => j.id === jobId);
      state.selectedJobModal = job || null;
      render();
    }

    function closeJobModal() {
      state.selectedJobModal = null;
      state.pendingDeleteJobId = null;
      render();
    }

    // Opens the course-details modal so a jobseeker can review a course before enrolling.
    function openCourseModal(courseId) {
      const course = COURSES.find(c => c.id === courseId);
      state.selectedCourseModal = course || null;
      state.pendingDeleteCourseId = null;
      render();
    }

    function closeCourseModal() {
      state.selectedCourseModal = null;
      state.pendingDeleteCourseId = null;
      render();
    }

    // Jobseeker enrolls in a training-provider course, normally from the course-details modal.
    function enrollInCourse(courseId) {
      if (!isApplyEnrollUnlocked()) return;
      if (state.enrolledCourseIds[courseId]) return;
      const course = COURSES.find(c => c.id === courseId);
      if (!course) return;
      course.enrolled = (course.enrolled || 0) + 1;
      state.enrolledCourseIds[courseId] = true;
      ensureResumeDefaults();
      ENROLLMENTS.push({
        id: "enr_" + Date.now(),
        candidateId: "me",
        courseId,
        courseTitle: course.title,
        provider: course.provider,
        learnerName: state.resume.name || "Anonymous Learner",
        enrolledAt: Date.now()
      });
      // Check achievements (e.g. "Lifelong Learner") before awarding the flat
      // per-course XP below, so the achievement toast is queued — and
      // therefore shown — ahead of the plain "+XP" action toast.
      checkAchievements();
      if (!state.xpAwardedEnroll[courseId]) {
        state.xp += ENROLL_XP;
        state.xpAwardedEnroll[courseId] = true;
        showXpToast("⚡", `+${ENROLL_XP} XP`, "Course enrollment");
      }
      render();
    }

    // Jobseeker cancels an existing enrollment — allowed at any time.
    function cancelEnrollment(courseId) {
      if (!state.enrolledCourseIds[courseId]) return;
      const course = COURSES.find(c => c.id === courseId);
      if (course) course.enrolled = Math.max(0, (course.enrolled || 0) - 1);
      delete state.enrolledCourseIds[courseId];
      ENROLLMENTS = ENROLLMENTS.filter(e => !(e.courseId === courseId && e.candidateId === "me"));
      render();
    }

    /* ==========================================================================
       COMPANIES PORTAL — post jobs, search candidates, review applications, hire
       ========================================================================== */

    // Shared sidebar nav for every company-portal screen, so a company can
    // jump straight between "Job posts", "Applications" and "Search
    // candidates" without threading back through a home screen first.
    function renderCompanyNav(activeView) {
      const myJobs = getCompanyPostedJobs();
      const items = [
        { view: "companyHome", icon: "", label: "Job posts", count: myJobs.length },
        { view: "companyCompanies", icon: "", label: "Companies", count: getAllCompanyNames().length }
      ];
      return `
        <div class="card no-print">
          <div class="sidebar-section-title">Company Portal</div>
          <div class="company-nav">
            ${items.map(it => `
              <button class="company-nav-btn ${activeView === it.view ? "active" : ""}"
                onclick="${it.view === 'companyApplications' ? 'backToApplicationsOverview(); ' : ''}state.view='${it.view}'; render();">
                <span class="nav-icon">${it.icon}</span>
                <span>${it.label}</span>
                ${it.count !== null ? `<span class="nav-count">${it.count}</span>` : ""}
              </button>
            `).join("")}
          </div>
          <hr class="company-nav-divider" />
          <button class="btn company-btn" style="width:100%;" onclick="openPostJobForm()">+ Post a job</button>
        </div>
      `;
    }

    // Shared hero/stats banner for every company-portal screen — pulled out
    // of the "Job posts" view so it renders identically no matter which tab
    // is active, instead of vanishing when you switch tabs.
    function renderCompanyHero() {
      const myJobs = getCompanyPostedJobs();
      const myJobIds = myJobs.map(j => j.id);
      const myApps = APPLICATIONS.filter(a => myJobIds.includes(a.jobId));
      const companyCount = getAllCompanyNames().length;
      return `
        <div class="card company-hero">
          <div class="profile-id-card" style="margin-bottom: 20px;">
            <div class="profile-avatar">JS</div>
            <div>
              <div class="profile-id-name">All Companies</div>
              <div class="profile-id-role"><span class="portal-role-tag company">Company Dashboard</span></div>
            </div>
          </div>
          <div class="quick-stats-row">
            <div class="quick-stat"><div class="quick-stat-num">${myJobs.length}</div><div class="quick-stat-label">Jobs posted</div></div>
            <div class="quick-stat"><div class="quick-stat-num">${companyCount}</div><div class="quick-stat-label">Companies</div></div>
            <div class="quick-stat"><div class="quick-stat-num">${myApps.length}</div><div class="quick-stat-label">Applications received</div></div>
            <div class="quick-stat"><div class="quick-stat-num">${myApps.filter(a => a.status === 'hired').length}</div><div class="quick-stat-label">Hired</div></div>
            <div class="quick-stat"><div class="quick-stat-num">${CANDIDATE_POOL.length}</div><div class="quick-stat-label">Jobseekers in pool</div></div>
          </div>
        </div>
      `;
    }

    // Turns a plain company-entered range like "15000-17000" or "15000 - 17000"
    // into a formatted "₱15,000 - ₱17,000" string. Returns null if the input
    // doesn't parse as two numbers, so the caller can show a validation error
    // instead of silently saving something malformed.
    function formatSalaryRange(raw) {
      const cleaned = (raw || "").trim();
      if (!cleaned) return { value: null, error: null }; // empty is allowed (falls back to "Negotiable")
      const m = cleaned.match(/^(\d[\d,]*)\s*-\s*(\d[\d,]*)$/);
      if (!m) return { value: null, error: "Enter a plain number range, e.g. 15000-17000." };
      const lo = parseInt(m[1].replace(/,/g, ""), 10);
      const hi = parseInt(m[2].replace(/,/g, ""), 10);
      if (hi < lo) return { value: null, error: "The second number should be higher than the first." };
      return { value: `₱${lo.toLocaleString()} - ₱${hi.toLocaleString()}`, error: null };
    }

    // Same idea as formatSalaryRange but for a single fixed course price
    // (not a range): plain number in, "₱2,500" out. "Free" (any casing) is
    // accepted as-is, and entering 0 is treated as "Free" too since a ₱0
    // course is a free course.
    function formatCoursePrice(raw) {
      const cleaned = (raw || "").trim();
      if (!cleaned) return { value: null, error: null }; // empty is allowed (falls back to "Free")
      if (/^free$/i.test(cleaned)) return { value: "Free", error: null };
      const m = cleaned.match(/^\d[\d,]*$/);
      if (!m) return { value: null, error: "Enter a plain number, e.g. 1500, or \"Free\"." };
      const amount = parseInt(cleaned.replace(/,/g, ""), 10);
      if (amount === 0) return { value: "Free", error: null };
      return { value: `₱${amount.toLocaleString()}`, error: null };
    }

    // Reverses formatSalaryRange for editing: turns a stored "₱22,000 - ₱28,000"
    // back into plain "22000-28000" so the edit form always shows/accepts the
    // same plain-number format, even for older postings or "Negotiable".
    function toPlainSalaryInput(salaryStr) {
      const nums = (salaryStr || "").match(/[\d,]+/g);
      if (!nums || nums.length < 2) return "";
      return `${nums[0].replace(/,/g, "")}-${nums[1].replace(/,/g, "")}`;
    }

    function openPostJobForm(jobId) {
      state.jobDraftErrors = {};
      if (jobId) {
        const job = JOBS.find(j => j.id === jobId);
        state.jobDraft = job
          ? { company: job.company, title: job.title, location: job.location, salary: toPlainSalaryInput(job.salary), type: job.type, reqSkills: job.reqSkills.map(r => ({ ...r })), careerPath: job.careerPath || "", setup: job.setup, description: job.description || "", editId: job.id }
          : { company: "", title: "", location: "", salary: "", type: "Full-time", reqSkills: [{ skill: "communication", level: 3 }], careerPath: "", setup: "Onsite", description: "", editId: null };
      } else {
        state.jobDraft = { company: "", title: "", location: "", salary: "", type: "Full-time", reqSkills: [{ skill: "communication", level: 3 }], careerPath: "", setup: "Onsite", description: "", editId: null };
      }
      state.view = "companyPostJob";
      render();
    }

    function submitJobPost() {
      const d = state.jobDraft;
      const errors = {};
      if (!d.company.trim()) errors.company = "Company name is required.";
      if (!d.title.trim()) errors.title = "Job title is required.";
      if (!d.reqSkills || !d.reqSkills.length) errors.reqSkills = "Select at least one required skill.";
      if (!d.careerPath) errors.careerPath = "Select the career path this job belongs to.";
      const salaryResult = formatSalaryRange(d.salary);
      if (salaryResult.error) errors.salary = salaryResult.error;
      state.jobDraftErrors = errors;
      if (Object.keys(errors).length) {
        render();
        return;
      }
      if (d.editId) {
        const job = JOBS.find(j => j.id === d.editId);
        if (job) {
          job.title = d.title.trim();
          job.company = d.company.trim();
          job.location = d.location.trim() || "Philippines";
          job.salary = salaryResult.value || "Negotiable";
          job.type = d.type;
          job.reqSkills = d.reqSkills.map(r => ({ ...r }));
          job.careerPath = d.careerPath;
          job.setup = d.setup;
          job.description = d.description.trim();
          // Editing can rename the company (or the job's original company may
          // never have gotten an entry). Make sure a COMPANIES record exists
          // so "View company" keeps working after an edit, same as on create.
          if (!COMPANIES[job.company]) {
            COMPANIES[job.company] = {
              industry: "Employer on JobStart",
              size: "Growing team",
              benefits: ["Details shared during interview"],
              description: `${job.company} is hiring through JobStart.`,
              link: "https://www.google.com/search?q=" + encodeURIComponent(job.company + " Careers")
            };
          }
        }
        state.jobDraft = { company: "", title: "", location: "", salary: "", type: "Full-time", reqSkills: [{ skill: "communication", level: 3 }], careerPath: "", setup: "Onsite", description: "", editId: null };
        state.jobDraftErrors = {};
        state.view = "companyHome";
        render();
        return;
      }
      const newJob = {
        id: Date.now(),
        title: d.title.trim(),
        company: d.company.trim(),
        location: d.location.trim() || "Philippines",
        salary: salaryResult.value || "Negotiable",
        type: d.type,
        reqSkills: d.reqSkills.map(r => ({ ...r })),
        careerPath: d.careerPath,
        setup: d.setup,
        description: d.description.trim(),
        companyPosted: true
      };
      JOBS.push(newJob);
      if (!COMPANIES[newJob.company]) {
        COMPANIES[newJob.company] = {
          industry: "Employer on JobStart",
          size: "Growing team",
          benefits: ["Details shared during interview"],
          description: `${newJob.company} is hiring through JobStart.`,
          link: "https://www.google.com/search?q=" + encodeURIComponent(newJob.company + " Careers")
        };
      }
      state.jobDraft = { company: d.company, title: "", location: "", salary: "", type: "Full-time", reqSkills: [{ skill: "communication", level: 3 }], careerPath: "", setup: "Onsite", description: "", editId: null };
      state.jobDraftErrors = {};
      state.view = "companyHome";
      render();
    }

    // Deletes a job post (and any applications against it) from the Companies portal.
    // Requires two clicks: the first arms a brief inline "confirm?" state on the
    // icon itself (no native dialog — those are blocked in sandboxed previews),
    // the second, on the same job, actually deletes it.
    function deleteJob(jobId) {
      if (state.pendingDeleteJobId !== jobId) {
        state.pendingDeleteJobId = jobId;
        render();
        return;
      }
      JOBS = JOBS.filter(j => j.id !== jobId);
      APPLICATIONS = APPLICATIONS.filter(a => a.jobId !== jobId);
      if (state.selectedApplicationsJobId === jobId) state.selectedApplicationsJobId = null;
      if (state.selectedJobModal && state.selectedJobModal.id === jobId) state.selectedJobModal = null;
      if (state.jobDraft && state.jobDraft.editId === jobId) {
        state.jobDraft = { company: state.jobDraft.company, title: "", location: "", salary: "", type: "Full-time", reqSkills: [{ skill: "communication", level: 3 }], careerPath: "", setup: "Onsite", editId: null };
        state.jobDraftErrors = {};
        state.view = "companyHome";
      }
      state.pendingDeleteJobId = null;
      render();
    }

    // Closes (or reopens) a job to new applications, without deleting the post or its
    // existing applicants. Closed jobs drop out of jobseekers' match results, but stay
    // visible in the Companies portal and to anyone who already applied.
    function toggleJobClosed(jobId) {
      const job = JOBS.find(j => j.id === jobId);
      if (!job) return;
      job.closed = !job.closed;
      if (state.selectedJobModal && state.selectedJobModal.id === jobId) {
        state.selectedJobModal = job;
      }
      render();
    }

    // The Companies portal manages every job on JobStart — the ones seeded into
    // the catalog as well as anything posted through this portal — not just a
    // single employer's own postings. (Name kept as-is since it's used all over
    // the Companies portal; it now means "jobs the Companies portal can manage.")
    function getCompanyPostedJobs() {
      return JOBS;
    }

    // Same list, filtered by the free-text search on the Job posts tab (matches
    // against job title or company name, case-insensitive). Empty search = all jobs.
    function getFilteredCompanyJobs() {
      const q = (state.companyJobSearch || "").trim().toLowerCase();
      const jobs = getCompanyPostedJobs();
      if (!q) return jobs;
      return jobs.filter(j => j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q));
    }

    // Every company that has ever appeared on JobStart: the seeded COMPANIES
    // catalog plus any company name referenced by a job (in case a job's
    // company was renamed/edited and doesn't yet have a COMPANIES entry).
    function getAllCompanyNames() {
      const names = new Set(Object.keys(COMPANIES));
      JOBS.forEach(j => names.add(j.company));
      return [...names].sort((a, b) => a.localeCompare(b));
    }

    // Removes a company from the catalog along with every job it posted (and
    // any applications against those jobs) — mirrors deleteJob's two-click
    // confirm pattern so a stray click can't wipe out a company by accident.
    function deleteCompany(companyName) {
      if (state.pendingDeleteCompanyName !== companyName) {
        state.pendingDeleteCompanyName = companyName;
        render();
        return;
      }
      const deadJobIds = JOBS.filter(j => j.company === companyName).map(j => j.id);
      JOBS = JOBS.filter(j => j.company !== companyName);
      APPLICATIONS = APPLICATIONS.filter(a => !deadJobIds.includes(a.jobId));
      delete COMPANIES[companyName];
      if (state.selectedApplicationsJobId && deadJobIds.includes(state.selectedApplicationsJobId)) {
        state.selectedApplicationsJobId = null;
      }
      if (state.selectedJobModal && deadJobIds.includes(state.selectedJobModal.id)) {
        state.selectedJobModal = null;
      }
      if (state.selectedCompanyModal && state.selectedCompanyModal.name === companyName) {
        state.selectedCompanyModal = null;
      }
      state.pendingDeleteCompanyName = null;
      render();
    }

    function viewApplicationsForJob(jobId) {
      state.selectedApplicationsJobId = jobId;
      state.pendingDeleteJobId = null;
      render();
    }

    function backToApplicationsOverview() {
      state.selectedApplicationsJobId = null;
      state.pendingDeleteJobId = null;
      render();
    }

    // Used by the "← Back to all jobs" button inside a single job's applicant
    // list — takes the company back to the Job posts tab (not just up one
    // level to the applications overview).
    function backToJobPostsTab() {
      state.selectedApplicationsJobId = null;
      state.pendingDeleteJobId = null;
      state.view = "companyHome";
      render();
    }

    function updateApplicationStatus(appId, status) {
      const app = APPLICATIONS.find(a => a.id === appId);
      if (app) app.status = status;
      state.openStatusDropdown = null;
      render();
    }

    function toggleStatusDropdown(appId) {
      state.openStatusDropdown = state.openStatusDropdown === appId ? null : appId;
      render();
    }

    /* Generic custom-select dropdown — same look and interaction as the application
       status dropdown above, reused anywhere a plain <select> would otherwise appear
       (job-post / course-offer forms) so every dropdown in the app matches.
       id: unique string key for open/close state.
       currentLabel: label text shown on the closed button.
       options: array of [value, label] pairs.
       onSelect: JS expression string, evaluated with the chosen value substituted for %VALUE%.
       openUp: optional — pass true to open the list above the button instead of below. */
    function renderFieldDropdown(id, currentLabel, options, onSelect, openUp) {
      const isOpen = state.openFieldDropdown === id;
      return `
        <div class="status-dropdown">
          <button type="button" class="status-select status-select-block" onclick="event.stopPropagation(); toggleFieldDropdown('${id}')">
            <span>${currentLabel}</span>
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          ${isOpen ? `
            <div class="status-dropdown-list${openUp ? " status-dropdown-list-up" : ""}" onclick="event.stopPropagation();">
              ${options.map(([val, label]) => `
                <div class="status-dropdown-item ${currentLabel === label ? "is-active" : ""}" onclick="${onSelect.replace(/%VALUE%/g, val)}; state.openFieldDropdown=null; render();">${label}</div>
              `).join("")}
            </div>
          ` : ""}
        </div>
      `;
    }

    function toggleFieldDropdown(id) {
      state.openFieldDropdown = state.openFieldDropdown === id ? null : id;
      render();
    }

    // Toggles a skill on/off in the job posting draft's list of required skills.
    // A job can need more than one skill (e.g. a helpdesk role needs both "tech"
    // and "customerService"), so this is a multi-select rather than the old
    // single-skill dropdown.
    function toggleJobDraftSkill(skillKey) {
      const d = state.jobDraft;
      if (!d.reqSkills) d.reqSkills = [];
      const idx = d.reqSkills.findIndex(r => r.skill === skillKey);
      if (idx === -1) {
        // Default a newly-added required skill to level 3 (Intermediate) —
        // the employer can adjust it with the stepper right after selecting it.
        d.reqSkills.push({ skill: skillKey, level: 3 });
      } else {
        d.reqSkills.splice(idx, 1);
      }
      if (state.jobDraftErrors) delete state.jobDraftErrors.reqSkills;
      render();
    }

    // Sets the employer's required proficiency level (1-5) for a skill that's
    // already selected on the job draft, via the stepper next to its pill.
    function setJobDraftSkillLevel(skillKey, level) {
      const d = state.jobDraft;
      if (!d.reqSkills) return;
      const entry = d.reqSkills.find(r => r.skill === skillKey);
      if (entry) {
        entry.level = Math.min(5, Math.max(1, level));
        render();
      }
    }

    /* ==========================================================================
       TRAINING PROVIDERS PORTAL — offer courses, close skill gaps, track learners
       ========================================================================== */

    function openOfferCourseForm(courseId) {
      state.courseDraftErrors = {};
      if (courseId) {
        const course = COURSES.find(c => c.id === courseId);
        state.courseDraft = course
          ? { provider: course.provider, title: course.title, skill: course.skill, level: course.level, duration: course.duration, price: toPlainPriceInput(course.price), description: course.description || "", editId: course.id }
          : { provider: "", title: "", skill: "communication", level: "Beginner", duration: "", price: "", description: "", editId: null };
      } else {
        state.courseDraft = { provider: "", title: "", skill: "communication", level: "Beginner", duration: "", price: "", description: "", editId: null };
      }
      state.view = "trainingOfferCourse";
      render();
    }

    // The Training Providers portal manages every course on JobStart — the
    // seeded catalog as well as anything offered through this portal — not
    // just one provider's own listings. (Name kept for consistency with
    // getCompanyPostedJobs; it now means "courses the portal can manage.")
    function getProviderOfferedCourses() {
      return COURSES;
    }

    // Same list, filtered by the free-text search on the Courses offered tab
    // (matches against course title or provider name, case-insensitive).
    function getFilteredProviderCourses() {
      const q = (state.trainingCourseSearch || "").trim().toLowerCase();
      const courses = getProviderOfferedCourses();
      if (!q) return courses;
      return courses.filter(c => c.title.toLowerCase().includes(q) || c.provider.toLowerCase().includes(q));
    }

    // Every training provider that has ever listed a course on JobStart.
    function getAllProviderNames() {
      const names = new Set(COURSES.map(c => c.provider));
      return [...names].sort((a, b) => a.localeCompare(b));
    }

    // Removes a provider along with every course it offers (and any
    // enrollments against those courses) — mirrors deleteCompany's two-click
    // confirm pattern.
    function deleteProvider(providerName) {
      if (state.pendingDeleteProviderName !== providerName) {
        state.pendingDeleteProviderName = providerName;
        render();
        return;
      }
      const deadCourseIds = COURSES.filter(c => c.provider === providerName).map(c => c.id);
      COURSES = COURSES.filter(c => c.provider !== providerName);
      ENROLLMENTS = ENROLLMENTS.filter(e => !deadCourseIds.includes(e.courseId));
      deadCourseIds.forEach(id => delete state.enrolledCourseIds[id]);
      if (state.selectedApplicationsCourseId && deadCourseIds.includes(state.selectedApplicationsCourseId)) {
        state.selectedApplicationsCourseId = null;
      }
      if (state.selectedCourseModal && deadCourseIds.includes(state.selectedCourseModal.id)) {
        state.selectedCourseModal = null;
      }
      state.pendingDeleteProviderName = null;
      render();
    }

    // Shared sidebar nav for every training-portal screen, mirroring
    // renderCompanyNav so both employer-side portals feel like the same product.
    function renderTrainingNav(activeView) {

      const myCourseIds = myCourses.map(c => c.id);

      const items = [
        { view: "trainingHome", icon: "", label: "Courses offered", count: myCourses.length },
        { view: "trainingProviders", icon: "", label: "Providers", count: getAllProviderNames().length },

    // Reverses formatCoursePrice for editing: turns a stored "₱2,500" back
    // into plain "2500" (or leaves "Free" as-is) so the edit form always
    // shows/accepts the same plain-number format.
    function toPlainPriceInput(priceStr) {
      const cleaned = (priceStr || "").trim();
      if (!cleaned || /^free$/i.test(cleaned)) return cleaned && /^free$/i.test(cleaned) ? "Free" : "";
      const num = cleaned.match(/[\d,]+/);
      return num ? num[0].replace(/,/g, "") : "";
    }

    function submitCourseOffer() {
      const d = state.courseDraft;
      const errors = {};
      if (!d.provider.trim()) errors.provider = "Provider name is required.";
      if (!d.title.trim()) errors.title = "Course title is required.";
      const priceResult = formatCoursePrice(d.price);
      if (priceResult.error) errors.price = priceResult.error;
      state.courseDraftErrors = errors;
      if (Object.keys(errors).length) {
        render();
        return;
      }
      if (d.editId) {
        const course = COURSES.find(c => c.id === d.editId);
        if (course) {
          course.provider = d.provider.trim();
          course.title = d.title.trim();
          course.skill = d.skill;
          course.level = d.level;
          course.duration = d.duration.trim() || "Self-paced";
          course.price = priceResult.value || "Free";
          course.description = d.description.trim();
        }
        state.courseDraft = { provider: "", title: "", skill: "communication", level: "Beginner", duration: "", price: "", description: "", editId: null };
        state.courseDraftErrors = {};
        state.view = "trainingHome";
        render();
        return;
      }
      COURSES.push({
        id: "tc_" + Date.now(),
        provider: d.provider.trim(),
        title: d.title.trim(),
        skill: d.skill,
        level: d.level,
        duration: d.duration.trim() || "Self-paced",
        price: priceResult.value || "Free",
        description: d.description.trim(),
        enrolled: 0,
        postedByMe: true
      });
      state.courseDraft = { provider: d.provider, title: "", skill: "communication", level: "Beginner", duration: "", price: "", description: "", editId: null };
      state.courseDraftErrors = {};
      state.view = "trainingHome";
      render();
    }

    // Deletes a course offer (and any enrollments against it) from the Training Providers portal.
    // Same two-click inline confirm pattern as deleteJob — see comment there.
    function deleteCourse(courseId) {
      if (state.pendingDeleteCourseId !== courseId) {
        state.pendingDeleteCourseId = courseId;
        render();
        return;
      }
      COURSES = COURSES.filter(c => c.id !== courseId);
      ENROLLMENTS = ENROLLMENTS.filter(e => e.courseId !== courseId);
      delete state.enrolledCourseIds[courseId];
      state.pendingDeleteCourseId = null;
      if (state.selectedCourseModal && state.selectedCourseModal.id === courseId) state.selectedCourseModal = null;
      if (state.courseDraft && state.courseDraft.editId === courseId) {
        state.courseDraft = { provider: state.courseDraft.provider, title: "", skill: "communication", level: "Beginner", duration: "", price: "", editId: null };
        state.courseDraftErrors = {};
        state.view = "trainingHome";
      }
      render();
    }

    // Marks a course as no longer being offered (or reopens it), without deleting the
    // listing or existing enrollments. Closed courses drop out of jobseekers' skill-gap
    // recommendations, but stay visible in the Training Providers portal and to anyone
    // already enrolled.
    function toggleCourseClosed(courseId) {
      const course = COURSES.find(c => c.id === courseId);
      if (!course) return;
      course.closed = !course.closed;
      if (state.selectedCourseModal && state.selectedCourseModal.id === courseId) {
        state.selectedCourseModal = course;
      }
      render();
    }

    // Drills into the Enrollees tab to show enrolled learners for one course.
    function viewEnrolleesForCourse(courseId) {
      state.selectedApplicationsCourseId = courseId;
      state.view = "trainingApplications";
      render();
    }

    // Clears the drill-down so the Enrollees tab shows the course overview again.
    function backToTrainingApplicationsOverview() {
      state.selectedApplicationsCourseId = null;
      render();
    }

    // Used by the "← Back to all courses" button inside a single course's
    // enrollee list — takes the provider back to the Courses offered tab
    // (not just up one level to the enrollees overview).
    function backToCoursesOfferedTab() {
      state.selectedApplicationsCourseId = null;
      state.view = "trainingHome";
      render();
    }

    // Averages every candidate's skill scores to find where the talent pool is
    // weakest — the gaps training providers are best positioned to close.
    function computeSkillGapReport() {
      const pool = CANDIDATE_POOL.length ? CANDIDATE_POOL : [];
      const keys = Object.keys(EMPTY_SKILLS);
      const avgs = keys.map(key => {
        const total = pool.reduce((sum, c) => sum + (c.skills[key] || 1), 0);
        return { key, avg: pool.length ? total / pool.length : 1 };
      });
      return avgs.sort((a, b) => a.avg - b.avg);
    }

                          : (prog ? `Next: ${Math.min(prog.cur, prog.target)}/${prog.target} — keep going` : "Locked");
                        return `
                          <div class="achievement-item ${earned ? "earned" : ""}" tabindex="0" onclick="event.stopPropagation(); this.classList.toggle('tapped');">

                              <div class="achievement-tooltip-title">${a.label}</div>
                              <div>${a.desc}</div>
                              <div class="achievement-tooltip-next">${nextLine}</div>

                          </div>
